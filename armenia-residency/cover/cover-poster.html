<!doctype html>
<!-- IRAM CO. poster-style cover for the residency reel (same layout as the IRAM business poster).
     Render: node tools/render_cover.cjs ../output cover-poster.html armenia-residency-cover.png -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      @font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("../assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+2026, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("../assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+2026, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("../assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      :root { --gold: linear-gradient(180deg, #f6dc98 0%, #e6bf68 50%, #c99a45 100%); --gold-flat: #e2bb63; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Vazirmatn", sans-serif; }
      #bg { position: absolute; inset: 0;
        background: radial-gradient(ellipse 95% 60% at 18% 6%, #2f6b4b 0%, rgba(47, 107, 75, 0) 70%),
                    radial-gradient(ellipse 120% 90% at 50% 45%, #174a33 0%, #113a28 55%, #0b2a1d 100%); }
      #grain { position: absolute; inset: 0; opacity: 0.06; background-image: radial-gradient(rgba(255,255,255,0.8) 0.6px, transparent 0.7px); background-size: 5px 5px; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 110% 85% at 50% 48%, transparent 60%, rgba(0, 0, 0, 0.35) 100%); }

      #logo { position: absolute; top: 108px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #logo .ic { width: 270px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35)); }
      #logo .wd { width: 400px; }

      #title { position: absolute; top: 590px; left: 0; right: 0; text-align: center; color: #ffffff; font-weight: 900; font-size: 128px; line-height: 1.22;
               text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
      #title .big { font-size: 150px; }
      #sub { position: absolute; top: 1105px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 74px; line-height: 1.32;
             color: transparent; background: var(--gold); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35)); }

      #div { position: absolute; top: 1360px; left: 110px; right: 110px; height: 120px; }
      #div .ln { position: absolute; top: 58px; height: 4px; width: 345px; border-radius: 2px; }
      #div .ln.r { right: 0; background: linear-gradient(270deg, rgba(226, 187, 99, 0) 0%, #e2bb63 100%); }
      #div .ln.l { left: 0; background: linear-gradient(90deg, rgba(226, 187, 99, 0) 0%, #e2bb63 100%); }
      #div svg { position: absolute; left: 50%; top: 0; margin-left: -75px; width: 150px; height: 120px; }

      #flag { position: absolute; top: 1500px; left: 50%; width: 430px; height: 290px; margin-left: -215px; filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.45)); }
    </style>
  </head>
  <body>
    <div id="bg"></div><div id="grain"></div><div id="vig"></div>

    <div id="logo"><img class="ic" src="../assets/iram-icon.png" alt="" /><img class="wd" src="../assets/iram-word.png" alt="IRAM CO." /></div>

    <div id="title">فقط ۳ راه<br />برای اقامت<br /><span class="big">ارمنستان!</span></div>
    <div id="sub">ثبت شرکت، کار یا تحصیل<br />کدوم مسیر مال توئه؟</div>

    <div id="div">
      <div class="ln r"></div><div class="ln l"></div>
      <!-- a gold line-art key, the film's emblem -->
      <svg viewBox="0 0 150 120"><g fill="none" stroke="#e2bb63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="40" cy="60" r="27" /><circle cx="40" cy="60" r="9" />
        <path d="M67 60 H138 M122 60 V82 M104 60 V76" />
      </g></svg>
    </div>

    <!-- waving Armenian flag: three bands on a sine-shaped cloth, shaded with a soft light/dark sweep -->
    <svg id="flag" viewBox="0 0 430 290">
      <defs>
        <clipPath id="cloth"><path id="clothPath" d="" /></clipPath>
        <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.18" /><stop offset="0.22" stop-color="#fff" stop-opacity="0.22" />
          <stop offset="0.45" stop-color="#000" stop-opacity="0.16" /><stop offset="0.7" stop-color="#fff" stop-opacity="0.2" />
          <stop offset="1" stop-color="#000" stop-opacity="0.2" />
        </linearGradient>
      </defs>
      <g clip-path="url(#cloth)">
        <path id="b1" fill="#d90012" d="" /><path id="b2" fill="#1d47d3" d="" /><path id="b3" fill="#f2a800" d="" />
        <rect x="0" y="0" width="430" height="290" fill="url(#shade)" />
      </g>
    </svg>

    <script>
      // build the waving cloth: top edge and the band boundaries follow the same gentle sine wave
      const W = 430, X0 = 10, X1 = 420, A = 13, T0 = 22, H = 240;
      const wave = (x) => A * Math.sin(((x - X0) / (X1 - X0)) * Math.PI * 2.1 + 0.4);
      const edge = (y0, dir) => { const pts = []; for (let i = 0; i <= 60; i++) { const x = dir > 0 ? X0 + (i / 60) * (X1 - X0) : X1 - (i / 60) * (X1 - X0); pts.push(`${x.toFixed(1)},${(y0 + wave(x)).toFixed(1)}`); } return pts; };
      const band = (ya, yb) => "M" + edge(ya, 1).join(" L") + " L" + edge(yb, -1).join(" L") + " Z";
      document.getElementById("clothPath").setAttribute("d", band(T0, T0 + H));
      document.getElementById("b1").setAttribute("d", band(T0, T0 + H / 3));
      document.getElementById("b2").setAttribute("d", band(T0 + H / 3, T0 + (2 * H) / 3));
      document.getElementById("b3").setAttribute("d", band(T0 + (2 * H) / 3, T0 + H));
      document.fonts.ready.then(() => Promise.all(Array.from(document.images).map((im) => im.decode().catch(() => {})))).then(() => requestAnimationFrame(() => (window.__ready = true)));
    </script>
  </body>
</html>
