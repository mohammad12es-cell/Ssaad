<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent}</style>
<script src="../../long-form/ep01/design/lib.js"></script><script src="../../long-form/ep01/build/art.js"></script></head><body><svg id="s"></svg>
<script>
// ?k=avatar (800x800) | banner (2560x1440, text inside the 1546x423 centre safe area)
const k = new URLSearchParams(location.search).get('k'), svg = document.getElementById('s');
const tower = (x, y, s, lit) => `<g transform="translate(${x},${y}) scale(${s})" filter="url(#ink)">
  <path d="M-58,0 L-34,-300 L34,-300 L58,0Z" fill="#e6dcc6" stroke="${INK}" stroke-width="6"/>
  <path d="M-46,-140 h92 M-40,-220 h80" stroke="#9e9583" stroke-width="4"/>
  <rect x="-56" y="-322" width="112" height="22" fill="#3a3430" stroke="${INK}" stroke-width="6"/>
  <rect x="-34" y="-392" width="68" height="70" fill="${lit ? '#ffd27a' : '#05080d'}" stroke="${INK}" stroke-width="6"/>
  <path d="M-40,-390 Q0,-446 40,-390Z" fill="#3a3430" stroke="${INK}" stroke-width="6"/></g>`;
if (k === 'avatar') {
  svg.setAttribute('width', 800); svg.setAttribute('height', 800); svg.setAttribute('viewBox', '0 0 800 800');
  svg.innerHTML = defs() + `<rect width="800" height="800" fill="#1d2633"/>
  <circle cx="400" cy="400" r="330" fill="${PAPER}"/>
  <path d="M400,300 L800,170 L800,430Z M400,300 L0,170 L0,430Z" fill="#ffd27a" opacity=".0"/>
  <circle cx="400" cy="300" r="120" fill="#ffd27a" opacity=".55" filter="url(#glow)"/>
  <path d="M120,560 Q260,520 400,550 Q540,520 680,560 L680,640 Q400,700 120,640Z" fill="#2a2622" stroke="${INK}" stroke-width="6" filter="url(#ink)"/>
  ${tower(400, 560, 0.62, true)}
  <circle cx="400" cy="400" r="330" fill="none" stroke="${RED}" stroke-width="18" stroke-dasharray="40 18" filter="url(#ink)"/>` + texture(800, 800);
} else {
  svg.setAttribute('width', 2560); svg.setAttribute('height', 1440); svg.setAttribute('viewBox', '0 0 2560 1440');
  svg.innerHTML = defs() + `<linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d141f"/><stop offset="1" stop-color="#34424f"/></linearGradient>
  <rect width="2560" height="1440" fill="url(#bk)"/>${Array.from({length:40},(_,i)=>`<circle cx="${(i*613)%2560}" cy="${40+(i*233)%520}" r="${2+i%3}" fill="#e9e1cc" opacity=".7"/>`).join('')}
  <rect y="900" width="2560" height="540" fill="#17232c"/>${waves(930, 8, '#9fb3b8', .3, 2560)}
  <path d="M1650,920 L1760,760 L1900,700 L2050,730 L2200,820 L2300,920Z" fill="#2a2622" stroke="${INK}" stroke-width="6" filter="url(#ink)"/>
  <circle cx="1975" cy="460" r="110" fill="#ffd27a" opacity=".5" filter="url(#glow)"/>
  <path d="M1975,455 L2600,330 L2600,600Z M1975,455 L1250,360 L1250,560Z" fill="#ffe7a8" opacity=".18"/>
  ${tower(1975, 720, 0.78, true)}
  <g font-family="${SERIF}" fill="${PAPER}">
   <text x="507" y="690" font-size="150" font-weight="700" letter-spacing="14">THE LAST LOG</text>
   <text x="512" y="770" font-family="${MONO}" font-size="44" font-weight="700" fill="#e46a5e" letter-spacing="6">REAL MYSTERIES · LEGEND VS RECORD</text>
   <text x="512" y="830" font-family="${MONO}" font-size="34" fill="#cfc6b4" letter-spacing="4">New case file every week</text></g>` + texture(2560, 1440);
}
</script></body></html>
