<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/characters.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      :root { --ground: #7be0ff; --ink: #ffffff; --stroke: #2b2a6e; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: 1080px; height: 1920px; }
      .cap {
        position: absolute; left: 60px; right: 60px; top: 260px; text-align: center;
        color: var(--ink); font-weight: 700; font-size: 104px; line-height: 1.05;
        -webkit-text-stroke: 16px var(--stroke); paint-order: stroke fill;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <svg id="world" class="clip stage" data-start="0" data-duration="13" data-track-index="0" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb38a" /><stop offset="0.45" stop-color="#ffd9a8" /><stop offset="1" stop-color="#fff3d6" />
          </linearGradient>
        </defs>
        <rect width="1080" height="1920" fill="url(#sky)" />
        <circle cx="200" cy="560" r="110" fill="#fff1b8" />
        <path d="M0,1250 C300,1180 700,1320 1080,1230 L1080,1920 L0,1920 Z" fill="#8be08f" />
        <path d="M0,1520 C320,1470 760,1580 1080,1500 L1080,1920 L0,1920 Z" fill="#5fcf6a" />
        <g fill="#ffffff" opacity="0.8"><circle cx="120" cy="1600" r="10" /><circle cx="960" cy="1660" r="12" /><circle cx="420" cy="1720" r="9" /></g>

        <g id="zoom" transform="translate(540,1300) scale(1.35) translate(-540,-1300)">
        <!-- flower -->
        <g id="flower">
          <path d="M560,1420 C556,1330 566,1260 560,1190" stroke="#3fa34d" stroke-width="14" fill="none" />
          <ellipse cx="530" cy="1320" rx="34" ry="14" fill="#3fa34d" transform="rotate(-30 530 1320)" />
          <g id="bloom">
            <circle cx="560" cy="1150" r="30" fill="#ff8fb1" /><circle cx="600" cy="1180" r="30" fill="#ff8fb1" />
            <circle cx="520" cy="1180" r="30" fill="#ff8fb1" /><circle cx="580" cy="1215" r="30" fill="#ff8fb1" />
            <circle cx="540" cy="1215" r="30" fill="#ff8fb1" /><circle cx="560" cy="1185" r="24" fill="#ffd166" />
          </g>
        </g>

        <!-- net (swing) -->
        <g id="net">
          <line x1="380" y1="1330" x2="500" y2="1170" stroke="#a0673e" stroke-width="12" stroke-linecap="round" />
          <ellipse cx="530" cy="1130" rx="62" ry="44" fill="rgba(255,255,255,0.35)" stroke="#555a7a" stroke-width="7" />
          <path d="M478,1120 L582,1120 M490,1100 L570,1160 M570,1100 L490,1160" stroke="#555a7a" stroke-width="3" />
        </g>

        <g id="tongue" opacity="0">
          <rect x="0" y="-11" width="270" height="22" rx="11" fill="#ff6f91" />
          <circle cx="270" cy="0" r="20" fill="#ff6f91" />
        </g>
        <g id="pip"></g>
        <g id="netHat" opacity="0">
          <ellipse cx="0" cy="0" rx="120" ry="60" fill="rgba(255,255,255,0.4)" stroke="#555a7a" stroke-width="7" />
          <path d="M-100,0 L100,0 M-80,-30 L80,30 M80,-30 L-80,30" stroke="#555a7a" stroke-width="3" />
        </g>
        <g id="pebble"></g>
        <g id="dizzy" opacity="0" fill="#ffd166"></g>
        <text id="bang" x="0" y="0" font-family="Fredoka" font-weight="700" font-size="120" fill="#ff5a5f" stroke="#2b2a6e" stroke-width="10" paint-order="stroke" opacity="0">!!</text>
        <text id="zz" x="0" y="0" font-family="Fredoka" font-weight="700" font-size="70" fill="#6a7bff" stroke="#fff" stroke-width="8" paint-order="stroke" opacity="0">✨</text>

        <g id="fly">
          <g id="wings" fill="rgba(220,240,255,0.85)" stroke="#7a8aa0" stroke-width="2">
            <ellipse cx="-10" cy="-16" rx="12" ry="18" transform="rotate(-25 -10 -16)" />
            <ellipse cx="10" cy="-16" rx="12" ry="18" transform="rotate(25 10 -16)" />
          </g>
          <ellipse cx="0" cy="0" rx="16" ry="12" fill="#2b2a3e" />
          <circle cx="-10" cy="-4" r="7" fill="#d23" /><circle cx="10" cy="-4" r="7" fill="#d23" />
        </g>
      </g>
      </svg>

      <div id="c1" class="clip cap" data-start="0" data-duration="1.7" data-track-index="1">Pip vs. ONE fly 🪰</div>
      <div id="c2" class="clip cap" data-start="2.6" data-duration="1.7" data-track-index="1">MISS 😤</div>
      <div id="c3" class="clip cap" data-start="5.75" data-duration="1.5" data-track-index="1">Miss AGAIN 😵</div>
      <div id="c4" class="clip cap" data-start="7.4" data-duration="1.5" data-track-index="1">Pebble's turn 🐌</div>
      <div id="c5" class="clip cap" data-start="9" data-duration="1.9" data-track-index="1">Just… wait 😌</div>
      <div id="c6" class="clip cap" data-start="11.2" data-duration="1.8" data-track-index="1">NOOO 😭</div>

      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="13" data-volume="1"></audio>
    </div>

    <script>
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      $("pip").innerHTML = `<g transform="scale(0.5)">${PIP(0, -165, 1)}</g>`;
      $("pebble").innerHTML = `<g transform="scale(0.5)">${PEBBLE(0, -92, 1)}</g>`;
      for (let i = 0; i < 3; i++) {
        const p = document.createElementNS(NS, "path");
        const a = (i * 2 * Math.PI) / 3, x = Math.cos(a) * 70, y = Math.sin(a) * 20;
        p.setAttribute("d", `M${x},${y - 20} L${x + 6},${y - 6} L${x + 20},${y} L${x + 6},${y + 6} L${x},${y + 20} L${x - 6},${y + 6} L${x - 20},${y} L${x - 6},${y - 6} Z`);
        $("dizzy").appendChild(p);
      }

      const PIP0 = { x: 330, y: 1400 };
      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => tl.fromTo(id, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.5)" }, t);

      // wings flap the whole time
      tl.fromTo("#wings", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 0.35, transformOrigin: "50% 100%", duration: 0.04, yoyo: true, repeat: 323, ease: "none" }, 0);

      tl.set("#pip", PIP0, 0);
      tl.set("#pebble", { x: 800, y: 1440 }, 0);
      tl.set("#net", { rotation: 0, svgOrigin: "380 1330" }, 0);

      // HOOK: fly zooms in from the camera (matches the loop end)
      tl.fromTo("#fly", { x: 540, y: 760, scale: 5 }, { x: 620, y: 1040, scale: 1, duration: 0.7, ease: "power3.out" }, 0);
      pop("#c1", 0.05);
      // net swings and misses
      tl.to("#net", { rotation: -55, svgOrigin: "380 1330", duration: 0.25, ease: "power2.in" }, 1.2);
      tl.to("#fly", { x: 470, y: 980, duration: 0.25, ease: "power1.inOut" }, 1.2);
      tl.to("#net", { rotation: 35, svgOrigin: "380 1330", duration: 0.3, ease: "power2.in" }, 1.75);
      tl.to("#fly", { x: 640, y: 1000, duration: 0.3, ease: "power1.inOut" }, 1.75);
      tl.to("#pip", { rotation: 360, transformOrigin: "50% 100%", duration: 0.4, ease: "power2.inOut" }, 2.1);
      tl.to("#net", { rotation: 395, svgOrigin: "380 1330", duration: 0.4, ease: "power2.inOut" }, 2.1);
      // net lands on Pip's own head
      tl.to("#net", { opacity: 0, duration: 0.05 }, 2.55);
      tl.set("#netHat", { x: 330, y: 1250 }, 2.55);
      tl.fromTo("#netHat", { opacity: 0, y: 1150 }, { opacity: 1, y: 1250, duration: 0.15, ease: "power2.in" }, 2.55);
      tl.to("#pip", { scaleY: 0.85, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 1 }, 2.65);
      pop("#c2", 2.6);
      tl.to("#fly", { keyframes: [{ x: 360, y: 1120, duration: 0.5 }, { x: 300, y: 1080, duration: 0.4 }, { x: 420, y: 1060, duration: 0.4 }, { x: 640, y: 1010, duration: 0.5 }], ease: "sine.inOut" }, 2.7);
      tl.to("#netHat", { opacity: 0, y: 1100, duration: 0.3 }, 4.2);

      // tongue shot: fly dodges, tongue sticks to the flower
      tl.set("#tongue", { x: 345, y: 1322, rotation: -31.7, transformOrigin: "0% 50%" }, 4.5);
      tl.set("#tongue", { opacity: 1 }, 4.6);
      tl.fromTo("#tongue", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.4, ease: "power3.out" }, 4.6);
      tl.to("#fly", { x: 700, y: 900, duration: 0.3, ease: "power2.out" }, 4.7);
      tl.to("#bloom", { scale: 1.15, svgOrigin: "560 1185", duration: 0.1, yoyo: true, repeat: 1 }, 5.0);
      // yank: Pip flies into the flower
      tl.to("#pip", { x: 500, y: 1300, rotation: 20, duration: 0.45, ease: "power3.in" }, 5.3);
      tl.to("#tongue", { scaleX: 0.15, x: 515, y: 1222, duration: 0.45, ease: "power3.in" }, 5.3);
      tl.to("#tongue", { opacity: 0, duration: 0.05 }, 5.75);
      tl.to("#flower", { rotation: 18, svgOrigin: "560 1420", duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, 5.75);
      tl.to("#pip", { x: 470, y: 1420, rotation: -90, duration: 0.35, ease: "bounce.out" }, 5.75);
      pop("#c3", 5.75);
      tl.set("#dizzy", { x: 420, y: 1360 }, 5.9);
      tl.to("#dizzy", { opacity: 1, duration: 0.15 }, 5.9);
      tl.fromTo("#dizzy", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 540, transformOrigin: "50% 50%", duration: 1.3, ease: "none" }, 5.9);
      tl.to("#dizzy", { opacity: 0, duration: 0.2 }, 7.2);
      tl.to("#pip", { x: PIP0.x, y: PIP0.y, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, 7.2);

      // fly drifts to Pebble and settles on the shell
      tl.to("#fly", { keyframes: [{ x: 820, y: 1000, duration: 0.8 }, { x: 900, y: 1150, duration: 0.6 }, { x: 760, y: 1200, duration: 0.6 }, { x: 785, y: 1335, duration: 0.6 }], ease: "sine.inOut" }, 6.2);
      pop("#c4", 7.4);
      tl.to("#pebble", { scaleY: 0.9, transformOrigin: "50% 100%", duration: 0.15, yoyo: true, repeat: 1 }, 8.0);
      tl.set("#zz", { x: 880, y: 1290 }, 8.0);
      tl.fromTo("#zz", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 8.0);
      tl.to("#zz", { opacity: 0, duration: 0.3 }, 8.8);
      pop("#c5", 9.0);
      tl.to("#pebble", { rotation: -6, transformOrigin: "50% 100%", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.1);
      tl.to("#fly", { rotation: -6, svgOrigin: "800 1440", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.1);
      // Pip shocked
      tl.set("#bang", { x: 390, y: 1170 }, 10.0);
      tl.fromTo("#bang", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)" }, 10.0);
      tl.to("#pip", { x: "+=12", duration: 0.05, yoyo: true, repeat: 9 }, 10.05);
      tl.to("#bang", { opacity: 0, duration: 0.2 }, 10.9);
      // Pip lunges, the fly escapes into the camera (loops to frame 0)
      pop("#c6", 11.2);
      tl.to("#pip", { keyframes: [{ x: 560, y: 1150, rotation: 25, duration: 0.35, ease: "power2.out" }, { x: 700, y: 1450, rotation: 90, duration: 0.35, ease: "power2.in" }] }, 11.2);
      tl.to("#pebble", { x: 825, duration: 0.2, ease: "power2.out" }, 11.55);
      tl.to("#fly", { x: 540, y: 760, scale: 5, duration: 1.5, ease: "power2.in" }, 11.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
