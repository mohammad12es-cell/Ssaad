<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/characters.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      :root { --ground: #7be0ff; --ink: #ffffff; --stroke: #2b2a6e; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: 1080px; height: 1920px; }
      .cap {
        position: absolute; left: 50px; right: 50px; top: 260px; text-align: center;
        color: var(--ink); font-weight: 700; font-size: 100px; line-height: 1.05;
        -webkit-text-stroke: 16px var(--stroke); paint-order: stroke fill;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <svg id="world" class="clip stage" data-start="0" data-duration="13" data-track-index="0" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6fd3ff" /><stop offset="0.6" stop-color="#b8ecff" /><stop offset="1" stop-color="#e8fbff" />
          </linearGradient>
        </defs>
        <rect width="1080" height="1920" fill="url(#sky)" />
        <circle id="sun" cx="860" cy="560" r="100" fill="#ffe27a" />
        <rect id="gloom" width="1080" height="1920" fill="#3b4a6b" opacity="0" />
        <g id="rainbow" opacity="0" fill="none" stroke-width="26">
          <path d="M120,1250 A420,420 0 0,1 960,1250" stroke="#ff5a5f" />
          <path d="M146,1250 A394,394 0 0,1 934,1250" stroke="#ffb347" />
          <path d="M172,1250 A368,368 0 0,1 908,1250" stroke="#ffe066" />
          <path d="M198,1250 A342,342 0 0,1 882,1250" stroke="#5fcf6a" />
          <path d="M224,1250 A316,316 0 0,1 856,1250" stroke="#6a7bff" />
        </g>

        <g id="zoom" transform="translate(540,1300) scale(1.35) translate(-540,-1300)">
          <path d="M0,1250 C300,1180 700,1320 1080,1230 L1080,1920 L0,1920 Z" fill="#8be08f" />
          <path d="M0,1520 C320,1470 760,1580 1080,1500 L1080,1920 L0,1920 Z" fill="#5fcf6a" />
          <ellipse id="puddle" cx="330" cy="1405" rx="150" ry="34" fill="#4fc3f7" opacity="0.85" />
          <ellipse id="ripple" cx="330" cy="1405" rx="80" ry="18" fill="none" stroke="#fff" stroke-width="6" opacity="0" />

          <g id="pebble"></g>
          <g id="shellBall" opacity="0">
            <circle cx="0" cy="0" r="52" fill="#ff7b6b" />
            <path d="M0,-40 a40,40 0 1,1 -1,0 M0,-26 a26,26 0 1,0 1,0 M0,-13 a13,13 0 1,1 -1,0" fill="none" stroke="#c94f63" stroke-width="7" />
          </g>
          <g id="bounces" fill="#bfe9ff"></g>

          <g id="rig">
            <g id="umb" opacity="0">
              <path d="M30,-250 L30,-60 C30,-30 60,-30 60,-55" fill="none" stroke="#5a4636" stroke-width="10" stroke-linecap="round" />
              <g id="canopy">
                <path d="M-150,-250 C-140,-370 200,-370 210,-250 C185,-275 150,-275 125,-250 C100,-275 70,-275 45,-250 C20,-275 -10,-275 -35,-250 C-60,-275 -95,-275 -120,-250 Z" fill="#ff5a5f" stroke="#c43c47" stroke-width="6" />
                <circle cx="30" cy="-355" r="9" fill="#c43c47" />
              </g>
            </g>
            <g id="pip"></g>
            <g id="drips" fill="#4fc3f7" opacity="0"></g>
          </g>
          <g id="splash" fill="#4fc3f7"></g>
        </g>

        <g id="cloud" fill="#8d97ad">
          <ellipse cx="540" cy="470" rx="330" ry="110" /><ellipse cx="420" cy="400" rx="170" ry="130" />
          <ellipse cx="660" cy="390" rx="190" ry="150" /><ellipse cx="540" cy="350" rx="140" ry="120" />
        </g>
        <g id="rain" opacity="0" stroke="#d6f1ff" stroke-width="6" stroke-linecap="round"></g>
        <g id="wind" opacity="0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
          <path d="M-200,900 C0,860 200,940 400,900" /><path d="M-300,1100 C-100,1060 100,1140 300,1100" /><path d="M-150,1300 C50,1260 250,1340 450,1300" />
        </g>
      </svg>

      <div id="c1" class="clip cap" data-start="0" data-duration="1.7" data-track-index="1">Surprise RAIN ☔</div>
      <div id="c2" class="clip cap" data-start="1.8" data-duration="1.7" data-track-index="1">Pip came prepared 😎</div>
      <div id="c3" class="clip cap" data-start="3.6" data-duration="2.6" data-track-index="1">WIND 🌬️😱</div>
      <div id="c4" class="clip cap" data-start="7.2" data-duration="2.4" data-track-index="1">Pebble's umbrella?<br />Built-in 🐌</div>
      <div id="c5" class="clip cap" data-start="11.3" data-duration="1.7" data-track-index="1">…and Pip? 😂</div>

      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="13" data-volume="1"></audio>
    </div>

    <script>
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      $("pip").innerHTML = `<g transform="scale(0.5)">${PIP(0, -165, 1)}</g>`;
      $("pebble").innerHTML = `<g transform="scale(0.5)">${PEBBLE(0, -92, 1)}</g>`;
      // rain: two stacked tiles of 400px so a 400px shift loops seamlessly
      for (let row = -1; row < 6; row++)
        for (let i = 0; i < 9; i++) {
          const x = 40 + i * 125 + ((row * 53) % 60), y = row * 400 + ((i * 137) % 400);
          mk("line", { x1: x, y1: y, x2: x - 14, y2: y + 60 }, $("rain"));
        }
      for (let i = 0; i < 6; i++) mk("ellipse", { class: "bnc", cx: 800, cy: 1360, rx: 7, ry: 10 }, $("bounces"));
      for (let i = 0; i < 8; i++) mk("ellipse", { class: "spl", cx: 330, cy: 1395, rx: 14, ry: 20 }, $("splash"));
      for (let i = 0; i < 3; i++) mk("ellipse", { class: "drip", cx: -40 + i * 40, cy: -40, rx: 7, ry: 11 }, $("drips"));

      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => tl.fromTo(id, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.5)" }, t);

      tl.set("#rig", { x: 330, y: 1400 }, 0);
      tl.set("#pebble", { x: 800, y: 1440 }, 0);
      tl.set("#shellBall", { x: 790, y: 1395 }, 0);
      tl.set(".bnc, .spl", { opacity: 0 }, 0);
      tl.set("#umb", { opacity: 0, x: 0, y: -110, rotation: 0, scale: 1 }, 0);

      // HOOK: cloud rushes in, sky darkens, rain starts
      pop("#c1", 0.05);
      tl.fromTo("#cloud", { x: -1100 }, { x: 0, duration: 0.8, ease: "power3.out" }, 0.1);
      tl.to("#gloom", { opacity: 0.35, duration: 0.6 }, 0.4);
      tl.to("#sun", { opacity: 0, duration: 0.5 }, 0.4);
      tl.to("#rain", { opacity: 1, duration: 0.3 }, 0.9);
      tl.fromTo("#rain", { y: 0 }, { y: 400, duration: 0.32, ease: "none", repeat: 26 }, 0.9);
      tl.to("#rig", { y: 1380, duration: 0.12, yoyo: true, repeat: 3 }, 1.0);

      // umbrella opens
      pop("#c2", 1.8);
      tl.fromTo("#umb", { opacity: 0, scale: 0.2, transformOrigin: "20% 100%" }, { opacity: 1, scale: 1, transformOrigin: "20% 100%", duration: 0.35, ease: "back.out(2.5)" }, 1.9);
      tl.to("#rig", { rotation: -4, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.4);

      // wind gust: umbrella flips inside out and carries Pip away
      pop("#c3", 3.6);
      tl.to("#wind", { opacity: 1, duration: 0.2 }, 3.6);
      tl.fromTo("#wind", { x: 0 }, { x: 900, duration: 0.7, ease: "none", repeat: 2 }, 3.6);
      tl.to("#wind", { opacity: 0, duration: 0.3 }, 5.6);
      tl.to("#canopy", { scaleY: -1, svgOrigin: "30 -250", duration: 0.2, ease: "back.out(3)" }, 4.0);
      tl.to("#rig", { x: 380, y: 1340, rotation: 10, duration: 0.4, ease: "power2.out" }, 4.2);
      tl.to("#rig", { keyframes: [{ x: 560, y: 1000, rotation: 25, duration: 0.8 }, { x: 760, y: 820, rotation: 5, duration: 0.6 }, { x: 1300, y: 300, rotation: 30, duration: 0.9 }], ease: "sine.inOut" }, 4.6);

      // Pebble hides in his shell; rain bounces off
      pop("#c4", 7.2);
      tl.to("#pebble", { opacity: 0, scale: 0.6, transformOrigin: "50% 100%", duration: 0.15 }, 7.4);
      tl.to("#shellBall", { opacity: 1, duration: 0.1 }, 7.42);
      tl.to("#shellBall", { scaleY: 0.9, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 1 }, 7.45);
      tl.set(".bnc", { opacity: 1 }, 7.6);
      tl.fromTo(".bnc", { x: 0, y: 0 }, { keyframes: { y: [0, -70, 30] }, x: (i) => (i - 2.5) * 45, duration: 0.45, stagger: 0.25, repeat: 1, ease: "power1.in" }, 7.6);
      tl.to(".bnc", { opacity: 0, duration: 0.1 }, 9.5);

      // rain stops, sun and rainbow, Pebble pops out dry
      tl.to("#rain", { opacity: 0, duration: 0.3 }, 9.4);
      tl.to("#cloud", { x: 1200, duration: 0.8, ease: "power2.in" }, 9.5);
      tl.to("#gloom", { opacity: 0, duration: 0.6 }, 9.5);
      tl.to("#sun", { opacity: 1, duration: 0.5 }, 9.6);
      tl.fromTo("#rainbow", { opacity: 0, scale: 0.8, svgOrigin: "540 1250" }, { opacity: 1, scale: 1, svgOrigin: "540 1250", duration: 0.6, ease: "back.out(1.5)" }, 9.8);
      tl.to("#shellBall", { opacity: 0, duration: 0.1 }, 9.9);
      tl.to("#pebble", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 9.9);
      tl.to("#pebble", { rotation: -6, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 10.3);

      // Pip falls back into the puddle, soaked, umbrella lands on his head
      tl.set("#rig", { x: 330, y: -500, rotation: 0 }, 10.6);
      tl.set("#canopy", { scaleY: 1, svgOrigin: "30 -250" }, 10.6);
      tl.set("#umb", { opacity: 0 }, 10.6);
      tl.to("#rig", { y: 1400, duration: 0.8, ease: "power2.in" }, 10.6);
      tl.fromTo("#ripple", { opacity: 0.9, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 0, scale: 2, transformOrigin: "50% 50%", duration: 0.8 }, 11.4);
      tl.set(".spl", { opacity: 0 }, 11.4);
      tl.fromTo(".spl", { x: 0, y: 0 }, { keyframes: { y: [0, -220, 30] }, x: (i) => (i - 3.5) * 95, duration: 0.7, ease: "power1.in" }, 11.4);
      tl.to(".spl", { opacity: 0, duration: 0.15 }, 11.95);
      tl.to("#rig", { scaleY: 0.8, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 1 }, 11.4);
      tl.fromTo("#umb", { opacity: 1, y: -700, rotation: -30, transformOrigin: "50% 100%" }, { y: -110, rotation: 0, transformOrigin: "50% 100%", duration: 0.5, ease: "bounce.out" }, 11.5);
      tl.to("#drips", { opacity: 1, duration: 0.1 }, 11.6);
      tl.fromTo(".drip", { y: 0 }, { y: 60, duration: 0.4, stagger: 0.13, repeat: 2, ease: "power1.in" }, 11.6);
      pop("#c5", 11.3);
      // loop back to the sunny opening frame
      tl.to("#rainbow", { opacity: 0, duration: 0.5 }, 12.4);
      tl.to(["#umb", "#drips"], { opacity: 0, duration: 0.3 }, 12.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
