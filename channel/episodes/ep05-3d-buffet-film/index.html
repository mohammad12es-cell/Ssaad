      #film { position: absolute; left: 0; top: 656px; width: 1080px; height: 607.5px; overflow: hidden; }

  <body>

        </div>
      </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "./assets/jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "./assets/jsm/postprocessing/RenderPass.js";
      import { BokehPass } from "./assets/jsm/postprocessing/BokehPass.js";
      import { UnrealBloomPass } from "./assets/jsm/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "./assets/jsm/postprocessing/OutputPass.js";

      const W = 1440, H = 810;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      const skyC = document.createElement("canvas"); skyC.width = 4; skyC.height = 256;
      { const g = skyC.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 256);
        gr.addColorStop(0, "#3a2f7a"); gr.addColorStop(0.45, "#ff7b54"); gr.addColorStop(0.75, "#ffcf7a"); gr.addColorStop(1, "#ffe9b0");
        g.fillStyle = gr; g.fillRect(0, 0, 4, 256); }
      const skyTex = new THREE.CanvasTexture(skyC); skyTex.colorSpace = THREE.SRGBColorSpace; scene.background = skyTex;
      scene.fog = new THREE.Fog(0xffb98a, 10, 34);
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 120);

      scene.add(new THREE.HemisphereLight(0xffd9a8, 0x3f7d3a, 1.1));
      const sun = new THREE.DirectionalLight(0xffb070, 3.2); sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); sun.shadow.radius = 5; sun.shadow.bias = -0.0005;
      scene.add(sun); scene.add(sun.target);
      const rim = new THREE.DirectionalLight(0x9fb8ff, 1.5); rim.position.set(14, 4, -8); scene.add(rim);

      const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.25, ...o });
      const SPH = new THREE.SphereGeometry(1, 48, 32);
      const mesh = (geo, mat, parent, pos = [0, 0, 0], scl = [1, 1, 1]) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scl); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
      const white = M(0xffffff, { roughness: 0.15, clearcoat: 1 }), black = M(0x15142a, { roughness: 0.1, clearcoat: 1 });

      // ---------------- WORLD ----------------
      const ground = mesh(new THREE.CircleGeometry(70, 64), M(0x6fae45, { clearcoat: 0, roughness: 0.9 }), scene, [10, 0, 0]); ground.rotation.x = -Math.PI / 2;
      const path = mesh(new THREE.PlaneGeometry(90, 2.8), M(0xd2a86e, { clearcoat: 0, roughness: 1 }), scene, [10, 0.01, 0.3]); path.rotation.x = -Math.PI / 2;
      for (let i = 0; i < 16; i++) {
        const tr = new THREE.Group(); scene.add(tr); tr.position.set(-8 + i * 2.6, 0, -6.5 - (i % 3) * 1.6);
        mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.6, 12), M(0x6b4a33, { clearcoat: 0 }), tr, [0, 0.8, 0]);
        mesh(SPH, M(i % 2 ? 0x2f6d3a : 0x3c7d3f, { clearcoat: 0, roughness: 0.8 }), tr, [0, 2.2, 0], [1.2, 1.4 + (i % 3) * 0.2, 1.2]);
      }
      const fc = [0xff8fb1, 0xffd166, 0xff6b6b, 0xb28dff];
      for (let i = 0; i < 22; i++) {
        const f = new THREE.Group(); scene.add(f); f.position.set(-4 + i * 1.35, 0, (i % 2 ? -2.6 : -1.8) + (i % 3) * 0.35);
        mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), M(0x3fa34d), f, [0, 0.4, 0]);
        for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2; mesh(SPH, M(fc[i % 4]), f, [Math.cos(a) * 0.16, 0.85, Math.sin(a) * 0.16], [0.12, 0.06, 0.12]); }
        mesh(SPH, M(0xffe066), f, [0, 0.87, 0], [0.08, 0.06, 0.08]);
      }

      // ---------------- PIP ----------------
      const pip = new THREE.Group(); scene.add(pip);
      const green = M(0x5fcf6a), bellyM = M(0xc9f2a8);
      const pipBody = new THREE.Group(); pip.add(pipBody);
      mesh(SPH, green, pipBody, [0, 0.62, 0], [0.78, 0.62, 0.68]);
      mesh(SPH, bellyM, pipBody, [0, 0.5, 0.38], [0.52, 0.38, 0.34]);
      const lids = [];
      [-0.36, 0.36].forEach((x) => {
        const e = new THREE.Group(); pipBody.add(e); e.position.set(x, 1.12, 0.12);
        mesh(SPH, green, e, [0, 0, 0], [0.3, 0.3, 0.3]);
        mesh(SPH, white, e, [0, 0.02, 0.12], [0.24, 0.24, 0.22]);
        mesh(SPH, black, e, [0, 0.02, 0.29], [0.12, 0.12, 0.08]);
        mesh(SPH, M(0xffffff, { emissive: 0xffffff, emissiveIntensity: 1 }), e, [0.05, 0.08, 0.36], [0.035, 0.035, 0.02]);
        const lidPivot = new THREE.Group(); lidPivot.position.set(0, 0.02, 0.12); e.add(lidPivot);
        mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), green, lidPivot, [0, 0, 0], [0.262, 0.262, 0.245]);
        lids.push(lidPivot);
      });
      [-0.5, 0.5].forEach((x) => mesh(SPH, M(0xff8fb1, { clearcoat: 0 }), pipBody, [x, 0.72, 0.5], [0.12, 0.07, 0.05]));
      const smile = mesh(new THREE.TorusGeometry(0.2, 0.035, 12, 40, Math.PI), black, pipBody, [0, 0.9, 0.66]); smile.rotation.z = Math.PI; smile.rotation.x = -0.35;
      [-0.45, 0.45].forEach((x) => mesh(SPH, green, pipBody, [x, 0.12, 0.35], [0.22, 0.12, 0.3]));

      // ---------------- PEBBLE ----------------
      const yellow = M(0xffd166), coral = M(0xff7b6b, { roughness: 0.25, clearcoat: 1 }), dark = M(0xc94f63);
      function makeShell(parent) {
        const sh = new THREE.Group(); parent.add(sh);
        mesh(SPH, coral, sh, [0, 0, 0], [0.55, 0.55, 0.42]);
        const pts = []; for (let i = 0; i <= 120; i++) { const a = i * 0.16, r = 0.46 - i * 0.0036; pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0.42 * Math.sqrt(Math.max(0, 1 - (r / 0.55) ** 2)) + 0.012)); }
        mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.035, 8), dark, sh);
        mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((v) => new THREE.Vector3(v.x, v.y, -v.z))), 240, 0.035, 8), dark, sh);
        return sh;
      }
      const peb = new THREE.Group(); scene.add(peb);
      const pebBody = new THREE.Group(); peb.add(pebBody);
      mesh(new THREE.CapsuleGeometry(0.22, 1.1, 12, 24), yellow, pebBody, [0, 0.2, 0], [1, 0.8, 1.1]).rotation.z = Math.PI / 2;
      mesh(new THREE.CapsuleGeometry(0.2, 0.45, 12, 24), yellow, pebBody, [0.62, 0.5, 0]).rotation.z = -0.35;
      const pSmile = mesh(new THREE.TorusGeometry(0.09, 0.022, 10, 30, Math.PI), black, pebBody, [0.86, 0.62, 0]); pSmile.rotation.set(0, Math.PI / 2, Math.PI);
      const shell = makeShell(pebBody); shell.position.set(-0.15, 0.68, 0);
      const stalks = new THREE.Group(); pebBody.add(stalks); stalks.position.set(0.72, 0.78, 0);
      const eyeballs = [];
      [[-0.12, 0.1], [0.12, -0.1]].forEach(([z, tilt]) => {
        const s = new THREE.Group(); stalks.add(s); s.position.z = z; s.rotation.z = -0.25; s.rotation.x = tilt;
        mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.55, 10), yellow, s, [0, 0.27, 0]);
        const eb = new THREE.Group(); eb.position.set(0, 0.58, 0); s.add(eb); eyeballs.push(eb);
        mesh(SPH, white, eb, [0, 0, 0], [0.13, 0.13, 0.13]); mesh(SPH, black, eb, [0.09, 0.01, 0], [0.06, 0.07, 0.07]);
      });
      const glasses = new THREE.Group(); stalks.add(glasses);
      const gm = M(0x111111, { roughness: 0.05, clearcoat: 1 });
      [-0.15, 0.15].forEach((z) => mesh(new THREE.BoxGeometry(0.05, 0.17, 0.26), gm, glasses, [0.3, 0.57, z]));
      mesh(new THREE.BoxGeometry(0.04, 0.04, 0.08), gm, glasses, [0.3, 0.6, 0]);
      const glint = mesh(SPH, new THREE.MeshBasicMaterial({ color: 0xffffff }), glasses, [0.34, 0.66, 0.2], [0.001, 0.001, 0.001]);

      // shell ball for SHELL MODE
      const ball = new THREE.Group(); scene.add(ball); const ballShell = makeShell(ball);
      const fireM = [0xff5a1f, 0xffb347].map((c) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.85 }));
      const fire = []; for (let i = 0; i < 9; i++) { const f = new THREE.Mesh(SPH, fireM[i % 2]); scene.add(f); fire.push(f); }

      // ---------------- LADYBUG ----------------
      const lady = new THREE.Group(); scene.add(lady);
      mesh(new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), M(0xff2d2d, { roughness: 0.2, clearcoat: 1 }), lady, [0, 0.02, 0], [0.22, 0.16, 0.26]);
      mesh(SPH, black, lady, [0, 0.05, 0.25], [0.12, 0.1, 0.1]);
      [[0.09, 0.1, 0.05], [-0.09, 0.1, 0.05], [0.1, 0.07, -0.12], [-0.1, 0.07, -0.12], [0, 0.155, -0.04]].forEach((p) => mesh(SPH, black, lady, p, [0.045, 0.02, 0.045]));
      [-0.05, 0.05].forEach((x) => mesh(SPH, white, lady, [x, 0.1, 0.33], [0.035, 0.035, 0.03]));

      // ---------------- OFFICER BEETLE ----------------
      const cop = new THREE.Group(); scene.add(cop);
      const brown = M(0x5a3d2b, { roughness: 0.2, clearcoat: 1 }), brown2 = M(0x6b4a33);
      mesh(SPH, brown, cop, [0, 0.95, 0], [0.62, 0.8, 0.5]);
      mesh(SPH, brown2, cop, [0, 1.95, 0.05], [0.4, 0.38, 0.38]);
      mesh(new THREE.CylinderGeometry(0.34, 0.38, 0.22, 32), M(0x2f4aa0), cop, [0, 2.32, 0]);
      mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.05, 32), M(0x22357a), cop, [0, 2.22, 0.08]);
      mesh(SPH, M(0xffd166, { metalness: 0.6, roughness: 0.3 }), cop, [0, 2.33, 0.36], [0.06, 0.06, 0.02]);
      [-0.15, 0.15].forEach((x) => mesh(new THREE.BoxGeometry(0.22, 0.12, 0.04), gm, cop, [x, 2.0, 0.39]));
      const stache = new THREE.Group(); cop.add(stache); stache.position.set(0, 1.83, 0.39);
      [-1, 1].forEach((sd) => { const st = mesh(SPH, M(0x2a1a10), stache, [sd * 0.16, 0, 0], [0.2, 0.06, 0.07]); st.rotation.z = sd * 0.3; });
      [-1, 1].forEach((sd) => { const a = mesh(new THREE.CapsuleGeometry(0.1, 0.55, 8, 16), brown, cop, [sd * 0.05, 1.15, 0.42]); a.rotation.z = Math.PI / 2 + sd * 0.25; });
      const sign = new THREE.Group(); cop.add(sign); sign.position.set(0.85, 0, 0.1);
      mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.2, 10), M(0x999999, { metalness: 0.5 }), sign, [0, 1.1, 0]);
      const stopC = document.createElement("canvas"); stopC.width = stopC.height = 256;
      { const g = stopC.getContext("2d"); g.fillStyle = "#e63946"; g.fillRect(0, 0, 256, 256); g.fillStyle = "#fff"; g.font = "bold 84px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("STOP", 128, 132); }
      const stopTex = new THREE.CanvasTexture(stopC); stopTex.colorSpace = THREE.SRGBColorSpace;
      const oct = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.05, 8), [M(0xe63946), new THREE.MeshStandardMaterial({ map: stopTex }), M(0xe63946)], sign, [0, 2.25, 0]);
      oct.rotation.x = Math.PI / 2; oct.rotation.y = Math.PI / 8;

      // ---------------- MUSHROOM HOUSE + TABLE ----------------
      const house = new THREE.Group(); scene.add(house); house.position.set(22, 0, -1.6);
      mesh(new THREE.CylinderGeometry(1.1, 1.3, 2.0, 40), M(0xf3e2c8, { clearcoat: 0.2 }), house, [0, 1.0, 0]);
      mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), M(0xe63946, { roughness: 0.25, clearcoat: 1 }), house, [0, 1.9, 0], [2.0, 1.4, 2.0]);
      [[0.8, 2.9, 1.1], [-0.9, 2.6, 1.2], [0.1, 3.2, 0.4], [1.5, 2.2, 0.6], [-1.4, 2.3, -0.2]].forEach((p) => mesh(SPH, M(0xffffff), house, p, [0.22, 0.12, 0.22]));
      const glowM = new THREE.MeshBasicMaterial({ color: 0xffe9a8 });
      const doorway = mesh(new THREE.PlaneGeometry(0.7, 1.15), glowM, house, [0, 0.62, 1.17]);
      const lettuce = new THREE.Group(); house.add(lettuce); lettuce.position.set(0, 0.05, 1.0);
      [[0, 0.18, 0], [-0.2, 0.14, 0.05], [0.2, 0.15, 0.02], [0, 0.36, 0.02]].forEach((p, i) => mesh(SPH, M([0x7ed957, 0x5fcf6a, 0x9be36f, 0x7ed957][i], { clearcoat: 0.4 }), lettuce, p, [0.2, 0.17, 0.18]));
      const doorHinge = new THREE.Group(); house.add(doorHinge); doorHinge.position.set(-0.36, 0, 1.2);
      mesh(new THREE.BoxGeometry(0.72, 1.18, 0.06), M(0x3fa3a8), doorHinge, [0.36, 0.6, 0]);
      mesh(SPH, M(0xffd166, { metalness: 0.6 }), doorHinge, [0.62, 0.6, 0.05], [0.04, 0.04, 0.04]);
      const doorLight = new THREE.PointLight(0xffd27a, 0, 6, 1.6); doorLight.position.set(0, 0.8, 1.6); house.add(doorLight);
      const table = new THREE.Group(); scene.add(table); table.position.set(21.2, 0, 1.5);
      mesh(new THREE.BoxGeometry(1.6, 0.08, 0.9), M(0x8a5a35, { clearcoat: 0.2 }), table, [0, 0.62, 0]);
      [[-0.7, -0.35], [0.7, -0.35], [-0.7, 0.35], [0.7, 0.35]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(0.08, 0.6, 0.08), M(0x7a4a2a), table, [x, 0.3, z]));
      mesh(new THREE.CylinderGeometry(0.38, 0.3, 0.05, 40), white, table, [0, 0.69, 0]);
      [[0.1, 0.05], [-0.12, -0.08], [0.02, 0.15]].forEach(([x, z]) => mesh(SPH, M(0x7ed957), table, [x, 0.72, z], [0.03, 0.02, 0.03]));
      const tPhone = mesh(new THREE.BoxGeometry(0.22, 0.03, 0.4), M(0x22213a), table, [0.55, 0.68, 0.1]);

      // ---------------- PHONE (shot 1) ----------------
      const phoneSet = new THREE.Group(); scene.add(phoneSet); phoneSet.position.set(-30, 0, 0);
      mesh(new THREE.CylinderGeometry(1.6, 1.7, 0.08, 48), M(0x4f9a3a, { clearcoat: 0, roughness: 1 }), phoneSet, [0, 0.04, 0]);
      mesh(new THREE.BoxGeometry(0.62, 0.06, 1.2), M(0x22213a, { roughness: 0.2, clearcoat: 1 }), phoneSet, [0, 0.11, 0]);
      const scr = (on) => { const c = document.createElement("canvas"); c.width = 300; c.height = 580; const g = c.getContext("2d");
        g.fillStyle = "#0f0f1c"; g.fillRect(0, 0, 300, 580);
        if (on) { g.fillStyle = "#fff"; g.beginPath(); g.roundRect(14, 60, 272, 120, 22); g.fill(); g.fillStyle = "#2b2a6e"; g.font = "bold 28px sans-serif"; g.fillText("🥬 LETTUCE BUFFET", 30, 110); g.fillStyle = "#555"; g.font = "20px sans-serif"; g.fillText("FREE · first come, first served!", 30, 150); }
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.MeshBasicMaterial({ map: t, color: 0x9a9a9a }); };
      const screenOff = mesh(new THREE.PlaneGeometry(0.56, 1.1), scr(false), phoneSet, [0, 0.142, 0]); screenOff.rotation.x = -Math.PI / 2;
      const screenOn = mesh(new THREE.PlaneGeometry(0.56, 1.1), scr(true), phoneSet, [0, 0.143, 0]); screenOn.rotation.x = -Math.PI / 2;

      // ---------------- DUST ----------------
      const dustM = new THREE.MeshStandardMaterial({ color: 0xead7b0, transparent: true, opacity: 0.7, roughness: 1 });
      const dust = []; for (let i = 0; i < 12; i++) { const d = new THREE.Mesh(SPH, dustM.clone()); scene.add(d); dust.push(d); }
      function puffs(ox, oz, t0, t) {
        dust.forEach((d, i) => { const dt = t - t0 - i * 0.03; if (dt < 0 || dt > 1.1) { d.visible = false; return; }
          d.visible = true; const a = (i * 2.4) % (Math.PI * 2); d.position.set(ox - dt * 0.9 - (i % 3) * 0.15, 0.15 + dt * 0.5, oz + Math.sin(a) * 0.5 * dt);
          d.scale.setScalar(0.12 + dt * 0.4); d.material.opacity = 0.75 * (1 - dt / 1.1); });
      }

      // ---------------- POST ----------------
      const composer = new EffectComposer(renderer); composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bokeh = new BokehPass(scene, camera, { focus: 5, aperture: 0.004, maxblur: 0.008 });
      composer.addPass(bokeh);
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.6, 0.86));
      composer.addPass(new OutputPass());

      // ---------------- SHOTS ----------------
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
      const lerp = (a, b, k) => a + (b - a) * k, cl = (x) => Math.max(0, Math.min(1, x));
      const ease = (k) => k * k * (3 - 2 * k), easeIn = (k) => k * k;
      const $ = (id) => document.getElementById(id);
      function cam(pos, look, fov = 32, ap = 0.004) {
        camera.position.copy(pos); camera.lookAt(look); camera.fov = fov; camera.updateProjectionMatrix();
        bokeh.uniforms.focus.value = pos.distanceTo(look); bokeh.uniforms.aperture.value = ap;
        sun.position.copy(look).add(v3(-6, 6, 5)); sun.target.position.copy(look);
      }
      const show = (id, on, s = 1) => { const e = $(id); e.style.opacity = on ? 1 : 0; e.style.transform = `scale(${s})`; };

      function pose(t) {
        // defaults
        pip.visible = peb.visible = true; ball.visible = false; fire.forEach((f) => (f.visible = false)); dust.forEach((d) => (d.visible = false));
        pip.position.set(0, 0, 0); pip.rotation.set(0, 0.4, 0); pipBody.scale.set(1, 1, 1); pipBody.rotation.set(0, 0, 0);
        lids.forEach((l) => (l.rotation.x = -1.6));
        peb.position.set(0, 0, 1.3); peb.rotation.set(0, -1.2, 0); peb.scale.setScalar(0.95); pebBody.scale.set(1, 1, 1);
        eyeballs.forEach((e) => e.scale.setScalar(1)); glasses.position.y = 0; glint.scale.setScalar(0.001);
        stalks.rotation.z = Math.sin(t * 2.1) * 0.1;
        lady.position.set(9.2, 0, -1.6); lady.rotation.y = 0;
        cop.position.set(10.4, 0, 0.1); cop.rotation.y = -1.1; stache.scale.set(1, 1, 1);
        doorHinge.rotation.y = 0; doorLight.intensity = 0; lettuce.visible = true; doorway.visible = false;
        tPhone.position.x = 0.55; screenOn.visible = false;
        ["screech", "slow", "shellTxt", "burp"].forEach((id) => show(id, false)); $("notif").style.opacity = 0;
        // blink for Pip
        if (t % 2.6 < 0.1) lids.forEach((l) => (l.rotation.x = 0));
      }

      function render(t) {
        pose(t);
        if (t < 2.5) { // S1 phone
          const k = t / 2.5; screenOn.visible = t > 0.4;
          cam(v3(-30 + 0.05, 1.9 - k * 0.35, 0.9 - k * 0.15), v3(-30, 0.1, 0.0), 34, 0.004);
        } else if (t < 4.0) { // S2 Pebble eyes widen, glasses drop
          const lt = t - 2.5; peb.position.set(0, 0, 1.3);
          glasses.position.y = lt < 0.8 ? 0.45 : lerp(0.45, 0, ease(cl((lt - 0.8) / 0.25)));
          const pop = lt < 0.2 ? 1 : 1 + 0.45 * Math.max(0, Math.sin(cl((lt - 0.2) / 0.5) * Math.PI)) + (lt > 0.45 ? 0.2 : 0);
          eyeballs.forEach((e) => e.scale.setScalar(pop));
          cam(v3(0.75, 1.35, 3.25 - lt * 0.2), v3(0.28, 1.3, 2.0), 30, 0.008);
        } else if (t < 5.5) { // S3 Pip determined
          const lt = t - 4.0; pip.rotation.y = 0.15; peb.visible = false;
          const lid = lt < 0.35 ? -1.6 : lerp(-1.6, -0.55, ease(cl((lt - 0.35) / 0.3)));
          lids.forEach((l) => (l.rotation.x = lid));
          cam(v3(0.15, 1.12, 2.15 - lt * 0.25), v3(0, 0.98, 0.2), 30, 0.008);
        } else if (t < 8.0) { // S4 launch + run, then Pebble chill
          const lt = t - 5.5; pip.rotation.y = Math.PI / 2;
          let px = 0; if (lt > 0.3) px = easeIn(cl((lt - 0.3) / 2.2)) * 8.0;
          const hop = lt > 0.3 ? Math.abs(Math.sin((lt - 0.3) * 9)) * 0.35 : 0;
          pip.position.set(px, hop, 0);
          if (lt < 0.3) pipBody.scale.set(1.08, 0.86, 1.08);
          puffs(px, 0, 5.8, t);
          peb.rotation.y = -1.6; peb.position.set(-0.4, 0, 1.7);
          if (lt < 1.2) cam(v3(3.6, 1.3, 5.6), v3(0.8, 0.6, 0.5), 34, 0.003);
          else if (lt < 1.7) cam(v3(px - 2.5, 0.9, 3.4), v3(px + 1, 0.5, 0), 34, 0.003);
          else { // Pebble calm close-up with glint
            const k = (lt - 1.7) / 0.8; peb.rotation.y = -1.2; peb.position.set(-0.4, 0, 1.7);
            glint.scale.setScalar(Math.max(0.001, Math.sin(cl((t - 7.4) / 0.35) * Math.PI) * 0.06));
            cam(v3(0.2, 1.1, 4.2 - k * 0.3), v3(-0.1, 0.9, 1.7), 30, 0.006);
          }
        } else if (t < 10.0) { // S5 slow-mo ladybug + skid
          const lt = t - 8.0; show("screech", lt > 0.1 && lt < 1.2, 1); show("slow", lt > 0.3);
          lady.position.set(9.2, 0, lerp(-1.4, 0.4, lt / 2)); lady.rotation.y = 0.05;
          const px = lerp(5.6, 7.0, ease(cl(lt / 0.5)));
          pip.position.set(px, 0, 0.1); pip.rotation.set(0, Math.PI / 2, 0); pipBody.rotation.z = lt < 1.2 ? 0.35 : 0.1;
          puffs(px + 0.4, 0.1, 8.0, 8.0 + lt * 0.5);
          cam(v3(10.9, 0.16, 1.5), v3(9.1, 0.22, 0.1), 30, 0.012);
        } else if (t < 12.0) { // S6 officer beetle
          const lt = t - 10.0; pip.position.set(8.7, 0, 0.25); pip.rotation.y = Math.PI / 2;
          lady.position.set(9.2, 0, 1.4);
          stache.scale.y = lt < 0.6 ? 1 + 0.4 * Math.abs(Math.sin(lt * 30)) : 1;
          if (lt > 1.1) pipBody.scale.set(1.06, lerp(1, 0.84, ease(cl((lt - 1.1) / 0.5))), 1.06);
          cam(v3(8.0 + lt * 0.15, 0.45, 2.9), v3(9.8, 1.25, 0.1), 34, 0.004);
        } else if (t < 15.5) { // S7 SHELL MODE
          const lt = t - 12.0; peb.visible = false; ball.visible = true;
          pip.position.set(8.7, 0, 0.25); pip.rotation.y = Math.PI / 2; pipBody.scale.set(1.06, 0.84, 1.06);
          show("shellTxt", lt > 0.05 && lt < 1.1, 1);
          let bx, by = 0.5; const bz = 0.4;
          if (lt < 0.8) bx = 0; else if (lt < 1.8) bx = easeIn((lt - 0.8) / 1.0) * 7.2;
          else if (lt < 2.8) { const k = (lt - 1.8) / 1.0; bx = lerp(7.2, 12.0, k); by = 0.5 + Math.sin(k * Math.PI) * 2.0; }
          else bx = lerp(12.0, 19, (lt - 2.8) / 0.7);
          ball.position.set(bx, by, bz); ball.rotation.set(0, Math.PI / 2, 0); ballShell.rotation.z = -lt * (lt < 0.8 ? 10 : 22);
          const glow = lt < 0.8 ? lt / 0.8 : 1;
          fire.forEach((f, i) => { f.visible = lt > 0.3; f.position.set(bx - 0.35 - i * 0.28 * glow, by + Math.sin(i * 1.7 + lt * 20) * 0.05, bz); f.scale.setScalar((0.32 - i * 0.03) * glow); });
          if (lt > 1.9 && lt < 2.8) { cop.position.y = 0; stache.rotation.z = 0.3; }
          if (lt < 0.8) cam(v3(1.6, 0.7, 2.6), v3(0, 0.5, 0.4), 30, 0.006);
          else if (lt < 1.8) cam(v3(bx - 1.5, 0.7, 3.2), v3(bx + 1.2, 0.5, 0.3), 36, 0.003);
          else cam(v3(7.0, 0.35, 3.6), v3(10.0, 1.8, 0), 38, 0.003);
        } else if (t < 18.3) { // S8 house
          const lt = t - 15.5; pip.visible = false;
          if (lt < 0.4) { peb.visible = false; ball.visible = true; const k = ease(lt / 0.4); ball.position.set(lerp(17.0, 20.2, k), 0.5, 0.8); ball.rotation.set(0, Math.PI / 2, 0); ballShell.rotation.z = -k * 14; puffs(20.2, 0.8, 15.6, t); }
          else { const s = lt < 0.6 ? 0.6 + (lt - 0.4) * 2 : 1; peb.position.set(lerp(20.2, 21.6, ease(cl((lt - 1.9) / 0.9))), 0, lerp(0.8, -0.2, ease(cl((lt - 1.9) / 0.9)))); peb.rotation.y = -0.6; peb.scale.setScalar(0.95 * s); }
          const dk = ease(cl((lt - 0.8) / 0.5)); doorHinge.rotation.y = -dk * 1.7; doorway.visible = dk > 0.02; doorLight.intensity = dk * 9;
          cam(v3(19.2, 1.2, 4.6), v3(21.4, 0.9, -0.6), 34, 0.003);
        } else { // S9 table twist + loop
          const lt = t - 18.3; lettuce.visible = false; doorHinge.rotation.y = -1.7; doorway.visible = true; doorLight.intensity = 6;
          peb.position.set(22.3, 0, 1.6); peb.rotation.y = -2.0; pebBody.scale.set(1.18, 1.05, 1.18);
          if (lt > 1.5 && lt < 2.1) pebBody.scale.set(1.3, 1.15, 1.3);
          show("burp", lt > 1.5 && lt < 2.3, 1);
          const px = lerp(17.0, 20.0, ease(cl((lt - 0.2) / 0.5)));
          pip.position.set(px, 0, 1.7); pip.rotation.y = lt < 0.7 ? Math.PI / 2 : 0.6;
          const pant = lt > 0.7 && lt < 2.2 ? 1 + 0.06 * Math.sin(lt * 18) : 1;
          pipBody.scale.set(1, pant, 1);
          if (lt > 2.2) pipBody.scale.set(1.08, lerp(1, 0.82, ease(cl((lt - 2.2) / 0.6))), 1.08);
          if (lt > 3.6) { pipBody.scale.set(1, 1.05, 1); tPhone.position.x = 0.55 + Math.sin(lt * 80) * 0.02; $("notif").style.opacity = 1; peb.rotation.y = -2.6; }
          cam(v3(20.9, 1.6, 6.6), v3(21.2, 0.8, 1.4), 34, 0.003);
        }
        composer.render();
      }

      const state = { t: 0 };
      render(0);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 22.5, duration: 22.5, ease: "none", onUpdate: () => render(state.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
