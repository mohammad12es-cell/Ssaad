<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fredoka"; font-weight: 500; src: url("assets/fredoka-latin-500-normal.woff2") format("woff2"); }
      :root { --ground: #000; --ink: #fff; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); background: #000; }
      .clip { position: absolute; inset: 0; }
      #topcap { position: absolute; left: 70px; right: 70px; top: 360px; text-align: center; color: var(--ink); font-weight: 700; font-size: 66px; line-height: 1.15; }
      #brand { position: absolute; left: 0; right: 0; top: 1340px; text-align: center; color: #9a9ab5; font-weight: 500; font-size: 42px; }
      #gl { position: absolute; left: 0; top: 656px; width: 1080px; height: 607.5px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="caps" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="topcap">When the buffet says<br />“first come, first served” 🥬</div>
        <div id="brand">Pip &amp; Pebble 🐸🐌</div>
      </div>
      <div id="glClip" class="clip" data-start="0" data-duration="6" data-track-index="0"><canvas id="gl" width="1440" height="810"></canvas></div>
    </div>

    <script type="module">
      import * as THREE from "./assets/three.module.js";
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1440, 810, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      // golden-hour sky gradient
      const sky = document.createElement("canvas"); sky.width = 4; sky.height = 256;
      const g = sky.getContext("2d"); const gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, "#3a2f7a"); gr.addColorStop(0.45, "#ff7b54"); gr.addColorStop(0.75, "#ffcf7a"); gr.addColorStop(1, "#ffe9b0");
      g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
      const skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace;
      scene.background = skyTex;
      scene.fog = new THREE.Fog(0xffb98a, 9, 30);

      const camera = new THREE.PerspectiveCamera(32, 1440 / 810, 0.1, 100);

      // lights
      scene.add(new THREE.HemisphereLight(0xffd9a8, 0x3f7d3a, 1.1));
      const sun = new THREE.DirectionalLight(0xffb070, 3.2);
      sun.position.set(-6, 5, 4); sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6; sun.shadow.radius = 6; sun.shadow.bias = -0.0005;
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0x9fb8ff, 1.6); rim.position.set(4, 3, -5); scene.add(rim);

      const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.25, ...o });
      const mesh = (geo, mat, parent, pos = [0, 0, 0], scl = [1, 1, 1]) => {
        const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scl); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
      };
      const SPH = new THREE.SphereGeometry(1, 48, 32);

      // ground + path + props
      const ground = mesh(new THREE.CircleGeometry(40, 64), M(0x6fae45, { clearcoat: 0, roughness: 0.9 }), scene);
      ground.rotation.x = -Math.PI / 2;
      const path = mesh(new THREE.PlaneGeometry(60, 2.6), M(0xd2a86e, { clearcoat: 0, roughness: 1 }), scene, [0, 0.01, 0.3]);
      path.rotation.x = -Math.PI / 2;
      for (let i = 0; i < 9; i++) {
        const tree = new THREE.Group(); scene.add(tree);
        tree.position.set(-12 + i * 3.2, 0, -7 - (i % 3) * 1.5);
        mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.6, 12), M(0x6b4a33, { clearcoat: 0 }), tree, [0, 0.8, 0]);
        mesh(SPH, M(0x2f6d3a, { clearcoat: 0, roughness: 0.8 }), tree, [0, 2.2, 0], [1.2, 1.4, 1.2]);
      }
      const flowerCols = [0xff8fb1, 0xffd166, 0xff6b6b, 0xb28dff];
      [[-3.2, 1.9], [-2.4, 2.6], [2.8, 2.2], [3.6, 1.7], [-4.2, -1.6], [4.4, -1.4]].forEach(([x, z], i) => {
        const f = new THREE.Group(); scene.add(f); f.position.set(x, 0, z);
        mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), M(0x3fa34d), f, [0, 0.4, 0]);
        for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2; mesh(SPH, M(flowerCols[i % 4]), f, [Math.cos(a) * 0.16, 0.85, Math.sin(a) * 0.16], [0.12, 0.06, 0.12]); }
        mesh(SPH, M(0xffe066), f, [0, 0.87, 0], [0.08, 0.06, 0.08]);
      });

      // ---------- PIP (frog) ----------
      const pip = new THREE.Group(); scene.add(pip);
      const green = M(0x5fcf6a), belly = M(0xc9f2a8), white = M(0xffffff, { roughness: 0.15, clearcoat: 1 }), black = M(0x15142a, { roughness: 0.1, clearcoat: 1 });
      const pipBody = new THREE.Group(); pip.add(pipBody);
      mesh(SPH, green, pipBody, [0, 0.62, 0], [0.78, 0.62, 0.68]);
      mesh(SPH, belly, pipBody, [0, 0.5, 0.38], [0.52, 0.38, 0.34]);
      const eyeL = new THREE.Group(), eyeR = new THREE.Group(); pipBody.add(eyeL, eyeR);
      [[eyeL, -0.36], [eyeR, 0.36]].forEach(([e, x]) => {
        e.position.set(x, 1.12, 0.12);
        mesh(SPH, green, e, [0, 0, 0], [0.3, 0.3, 0.3]);
        mesh(SPH, white, e, [0, 0.02, 0.12], [0.24, 0.24, 0.22]);
        mesh(SPH, black, e, [0, 0.02, 0.29], [0.12, 0.12, 0.08]);
        mesh(SPH, M(0xffffff, { emissive: 0xffffff, emissiveIntensity: 1 }), e, [0.05, 0.08, 0.36], [0.035, 0.035, 0.02]);
      });
      [-0.5, 0.5].forEach((x) => mesh(SPH, M(0xff8fb1, { clearcoat: 0 }), pipBody, [x, 0.72, 0.5], [0.12, 0.07, 0.05]));
      const smile = mesh(new THREE.TorusGeometry(0.2, 0.035, 12, 40, Math.PI), black, pipBody, [0, 0.9, 0.66]); smile.rotation.z = Math.PI; smile.rotation.x = -0.35;
      
      [-0.45, 0.45].forEach((x) => mesh(SPH, green, pipBody, [x, 0.12, 0.35], [0.22, 0.12, 0.3]));
      pip.position.set(-1.1, 0, 0.4); pip.rotation.y = 0.35;

      // ---------- PEBBLE (snail) ----------
      const peb = new THREE.Group(); scene.add(peb);
      const yellow = M(0xffd166), coral = M(0xff7b6b, { roughness: 0.25, clearcoat: 1 }), dark = M(0xc94f63);
      mesh(new THREE.CapsuleGeometry(0.22, 1.1, 12, 24), yellow, peb, [0, 0.2, 0], [1, 0.8, 1.1]).rotation.z = Math.PI / 2;
      const neck = mesh(new THREE.CapsuleGeometry(0.2, 0.45, 12, 24), yellow, peb, [0.62, 0.5, 0]); neck.rotation.z = -0.35;
      const pSmile = mesh(new THREE.TorusGeometry(0.09, 0.022, 10, 30, Math.PI), black, peb, [0.86, 0.62, 0]); pSmile.rotation.set(0, Math.PI / 2, Math.PI);
      const shell = new THREE.Group(); peb.add(shell); shell.position.set(-0.15, 0.68, 0);
      mesh(SPH, coral, shell, [0, 0, 0], [0.55, 0.55, 0.42]);
      const pts = []; for (let i = 0; i <= 120; i++) { const a = i * 0.16, r = 0.46 - i * 0.0036; pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0.42 * Math.sqrt(Math.max(0, 1 - (r / 0.55) ** 2)) + 0.012)); }
      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.035, 8), dark, shell);
      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((v) => new THREE.Vector3(v.x, v.y, -v.z))), 240, 0.035, 8), dark, shell);
      const stalks = new THREE.Group(); peb.add(stalks); stalks.position.set(0.72, 0.78, 0);
      const glasses = new THREE.Group();
      [[-0.12, 0.1], [0.12, -0.1]].forEach(([z, tilt]) => {
        const s = new THREE.Group(); stalks.add(s); s.position.z = z; s.rotation.z = -0.25; s.rotation.x = tilt;
        mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.55, 10), yellow, s, [0, 0.27, 0]);
        mesh(SPH, white, s, [0, 0.58, 0], [0.13, 0.13, 0.13]);
        mesh(SPH, black, s, [0.09, 0.59, 0], [0.06, 0.07, 0.07]);
      });
      stalks.add(glasses);
      [-0.15, 0.15].forEach((z) => mesh(new THREE.BoxGeometry(0.05, 0.17, 0.26), M(0x111111, { roughness: 0.05, clearcoat: 1 }), glasses, [0.3, 0.57, z]));
      mesh(new THREE.BoxGeometry(0.04, 0.04, 0.08), M(0x111111), glasses, [0.3, 0.6, 0]);
      peb.position.set(1.2, 0, 0.6); peb.rotation.y = -1.2; peb.scale.setScalar(0.95);

      // ---------- animation (seekable) ----------
      const state = { t: 0 };
      function render() {
        const t = state.t; // seconds 0..6
        // cinematic dolly-in + slight arc
        const k = t / 6;
        camera.position.set(-0.6 + k * 0.9, 1.25 - k * 0.15, 6.4 - k * 1.6);
        camera.lookAt(0, 0.75, 0.3);
        // Pip: excited hops + blink
        const hop = Math.max(0, Math.sin(t * Math.PI * 1.6)) * 0.25;
        pip.position.y = hop;
        pipBody.scale.set(1 + (hop < 0.02 ? 0.06 : 0), 1 - (hop < 0.02 ? 0.06 : 0), 1);
        const blink = (t % 2.2) < 0.12 ? 0.15 : 1;
        eyeL.scale.y = eyeR.scale.y = blink;
        pip.rotation.y = 0.35 + Math.sin(t * 1.3) * 0.08;
        // Pebble: cool sway, eye stalks wobble, glasses glint via tilt
        stalks.rotation.z = Math.sin(t * 2.1) * 0.12;
        peb.rotation.y = -1.2 + Math.sin(t * 0.8) * 0.05;
        shell.rotation.z = Math.sin(t * 1.1) * 0.04;
        renderer.render(scene, camera);
      }
      render();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: 6, duration: 6, ease: "none", onUpdate: render }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
