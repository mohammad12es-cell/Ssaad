<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/characters.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fredoka"; font-weight: 500; src: url("assets/fredoka-latin-500-normal.woff2") format("woff2"); }
      :root { --ground: #0b1033; --ink: #ffffff; --stroke: #2b2a6e; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 50px; right: 50px; top: 250px; bottom: auto; text-align: center; color: var(--ink); font-weight: 700; font-size: 96px; line-height: 1.05;
        -webkit-text-stroke: 16px var(--stroke); paint-order: stroke fill; }
      .cap { top: 300px; color: #2b2a6e; -webkit-text-stroke: 0; font-size: 78px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <svg id="world" class="clip stage" data-start="0" data-duration="14" data-track-index="0" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1033" /><stop offset="0.6" stop-color="#2a2a6e" /><stop offset="1" stop-color="#4a3f8a" /></linearGradient>
          <clipPath id="cardclip"><rect x="40" y="520" width="1000" height="1180" rx="60" /></clipPath>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c4" /><stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.7" /><stop offset="1" stop-color="#ffb347" stop-opacity="0" /></radialGradient>
        </defs>
        <rect width="1080" height="1920" fill="#fff7ea" />
        <g clip-path="url(#cardclip)"><rect width="1080" height="1920" fill="url(#sky)" />
        <circle cx="820" cy="520" r="80" fill="#fff4c8" /><circle cx="790" cy="500" r="80" fill="#2a2a6e" opacity="0.0" />
<g fill="#fff" id="stars"><circle cx="120" cy="420" r="4" /><circle cx="300" cy="560" r="3" /><circle cx="520" cy="430" r="5" /><circle cx="660" cy="640" r="3" /><circle cx="960" cy="700" r="4" /><circle cx="210" cy="760" r="3" /><circle cx="420" cy="820" r="4" /><circle cx="980" cy="420" r="3" /></g>

        <g id="zoom" transform="translate(540,1110) scale(1.4) translate(-575,-1330)">
          <path d="M0,1250 C300,1180 700,1320 1080,1230 L1080,1920 L0,1920 Z" fill="#3c7a55" />
          <path d="M0,1520 C320,1470 760,1580 1080,1500 L1080,1920 L0,1920 Z" fill="#2f6447" />
          <g id="house" transform="translate(-90,0)">
  <circle id="glowH" cx="840" cy="1370" r="70" fill="url(#glow)" opacity="0" />
  <rect x="772" y="1280" width="136" height="150" rx="16" fill="#d8c6ac" />
  <rect id="door" x="812" y="1335" width="56" height="95" rx="24" fill="#2d7a7f" />
  <circle cx="800" cy="1305" r="12" fill="#ffd27a" opacity="0.8" />
  <path d="M700,1300 C700,1150 980,1150 980,1300 Z" fill="#b8323d" />
  <g fill="#e8e0f0"><circle cx="760" cy="1250" r="16" /><circle cx="840" cy="1205" r="20" /><circle cx="920" cy="1255" r="14" /></g>
</g>
<g id="snack" opacity="0" transform="translate(-70,0)">
  <rect x="330" y="1405" width="190" height="16" rx="6" fill="#8a5a35" /><rect x="345" y="1421" width="12" height="60" fill="#7a4a2a" /><rect x="493" y="1421" width="12" height="60" fill="#7a4a2a" />
  <ellipse cx="425" cy="1402" rx="70" ry="12" fill="#fff" />
  <g id="food"><circle cx="405" cy="1385" r="20" fill="#7ed957" /><circle cx="445" cy="1385" r="20" fill="#5fcf6a" /><circle cx="425" cy="1366" r="20" fill="#9be36f" /></g>
  <g id="peb"></g>
</g>
<g id="pip"></g>
<g id="flies" fill="#fff27a"></g>
<text id="zzz" x="380" y="1250" font-family="Fredoka" font-weight="700" font-size="60" fill="#fff" stroke="#2b2a6e" stroke-width="7" paint-order="stroke">Z z z</text>
<text id="bangP" x="640" y="1270" font-family="Fredoka" font-weight="700" font-size="70" fill="#ff5a5f" stroke="#2b2a6e" stroke-width="7" paint-order="stroke" opacity="0">!!</text>
<text id="burp" x="420" y="1300" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="66" fill="#ffd166" stroke="#2b2a6e" stroke-width="8" paint-order="stroke" opacity="0">BURP!</text>

        </g>
        <g transform="translate(0,140)"><rect id="gloom" width="1080" height="1920" fill="#0a0d30" opacity="0.45" />
<rect id="flash" width="1080" height="1920" fill="#fff" opacity="0" />
</g>
        </g><rect x="40" y="520" width="1000" height="1180" rx="60" fill="none" stroke="#2b2a6e" stroke-width="6" /><text x="540" y="1800" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="58" fill="#2b2a6e">Pip &amp; Pebble 🐸🐌</text>
      </svg>
      <div id="c1" class="clip cap" data-start="0" data-duration="1.6" data-track-index="1">3 AM… 😴</div>
<div id="c2" class="clip cap" data-start="1.6" data-duration="1.2" data-track-index="1">*grrrowl* 🍽️</div>
<div id="c3" class="clip cap" data-start="2.8" data-duration="3.2" data-track-index="1">Sneaky mode 🥷</div>
<div id="c4" class="clip cap" data-start="7.5" data-duration="2.4" data-track-index="1">…you're late 😎</div>
<div id="c5" class="clip cap" data-start="11.4" data-duration="2.1" data-track-index="1">*grrrowl* 😭</div>
      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="14" data-volume="1"></audio>
    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const pipSVG = (s = 0.5) => `<g transform="scale(${s})">${PIP(0, -165, 1)}</g>`;
      const pebSVG = (s = 0.5, shades = false) => `<g transform="scale(${s})">${PEBBLE(0, -92, 1)}${shades ? `<g><rect x="105" y="-245" width="62" height="44" rx="14" fill="#111"/><rect x="167" y="-240" width="62" height="44" rx="14" fill="#111"/><rect x="150" y="-232" width="30" height="8" fill="#111"/><rect x="115" y="-238" width="18" height="8" rx="4" fill="#fff" opacity=".6"/></g>` : ""}</g>`;
      // eyelids for Pip (scaled 0.5): eye centres (+/-42.5, -158.5), r 29
      const lidsSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="-42.5" cy="-158.5" r="31" fill="#5fcf6a"/><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M-62,-156 C-50,-146 -35,-146 -23,-156 M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const winkSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const star = (x, y, s) => `M${x},${y - s} L${x + s * 0.25},${y - s * 0.25} L${x + s},${y} L${x + s * 0.25},${y + s * 0.25} L${x},${y + s} L${x - s * 0.25},${y + s * 0.25} L${x - s},${y} L${x - s * 0.25},${y - s * 0.25} Z`;
      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => tl.fromTo(id, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.5)" }, t);
      // dust/splash puff helper: creates n circles in group g around (x,y) and animates them at t
      function puff(g, x, y, t, color = "#e8d6b0", n = 6, spread = 60) {
        const els = []; for (let i = 0; i < n; i++) els.push(mk("circle", { cx: x, cy: y, r: 22 + (i % 3) * 8, fill: color, opacity: 0 }, $(g)));
        els.forEach((e, i) => tl.fromTo(e, { opacity: 0.9, x: 0, y: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 0, x: (i - n / 2) * spread * 0.5, y: -40 - (i % 2) * 40, scale: 1.8, transformOrigin: "50% 50%", duration: 0.7, immediateRender: false }, t));
        tl.set(els, { opacity: 0 }, 0);
      }
      $("pip").innerHTML = `<g id="pipIn">${pipSVG(0.5)}<g id="lids">${lidsSVG(0.5)}</g></g>`;
      $("peb").innerHTML = `<g id="pebIn">${pebSVG(0.5, true)}</g>`;
      const fl = []; for (let i = 0; i < 9; i++) fl.push(mk("circle", { cx: 200 + i * 80, cy: 1250 + (i % 3) * 60, r: 6 }, $("flies")));
      fl.forEach((f, i) => tl.fromTo(f, { opacity: 0.2, y: 0 }, { opacity: 1, y: -30, duration: 0.6 + (i % 3) * 0.2, yoyo: true, repeat: 13 - (i % 3) * 3, ease: "sine.inOut" }, i * 0.1));
      tl.set("#pip", { x: 330, y: 1440 }, 0); tl.set("#peb", { x: 520, y: 1480 }, 0); tl.set("#lids", { opacity: 1 }, 0);
      // asleep
      tl.to("#pipIn", { scaleY: 1.04, transformOrigin: "50% 100%", duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0);
      tl.fromTo("#zzz", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 1.6 }, 0);
      tl.to("#pipIn", { x: 8, duration: 0.05, yoyo: true, repeat: 9 }, 1.6);
      tl.set("#lids", { opacity: 0 }, 2.3);
      tl.fromTo("#pipIn", { scale: 1, transformOrigin: "50% 100%" }, { scale: 1.12, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, 2.3);
      // tiptoe
      tl.to("#pip", { x: 640, duration: 3.2, ease: "none" }, 2.8);
      tl.to("#pipIn", { y: -22, rotation: 6, transformOrigin: "50% 100%", duration: 0.4, yoyo: true, repeat: 7, ease: "sine.inOut" }, 2.8);
      // door creaks
      tl.to("#door", { scaleX: 0.55, transformOrigin: "0% 50%", duration: 0.8 }, 6.2);
      tl.to("#glowH", { opacity: 0.8, scale: 1.4, transformOrigin: "50% 50%", duration: 0.8 }, 6.2);
      // LIGHTS ON
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.4, immediateRender: false }, 7.4);
      tl.set("#gloom", { opacity: 0 }, 7.4); tl.set("#snack", { opacity: 1 }, 7.4);
      tl.fromTo("#bangP", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.2, ease: "back.out(3)" }, 7.6);
      tl.to("#bangP", { opacity: 0, duration: 0.2 }, 8.6);
      tl.to("#pipIn", { scaleY: 1.1, transformOrigin: "50% 100%", duration: 0.1, yoyo: true, repeat: 1 }, 7.6);
      // Pebble eats
      tl.to("#pebIn", { rotation: -5, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 9 }, 9.6);
      tl.to("#food", { scale: 0, transformOrigin: "50% 100%", duration: 1.3 }, 9.6);
      tl.set("#pebIn", { scaleX: 1.2, transformOrigin: "50% 100%" }, 10.9);
      tl.fromTo("#burp", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 11.0);
      tl.to("#burp", { opacity: 0, duration: 0.3 }, 11.8);
      tl.to("#pipIn", { x: 8, duration: 0.05, yoyo: true, repeat: 7 }, 11.4);
      tl.to("#pipIn", { scaleY: 0.8, scaleX: 1.08, transformOrigin: "50% 100%", duration: 0.5 }, 11.8);
      // lights out, walk back to bed (loops)
      tl.to("#gloom", { opacity: 0.45, duration: 0.4 }, 12.5); tl.to("#snack", { opacity: 0, duration: 0.4 }, 12.5);
      tl.to("#door", { scaleX: 1, duration: 0.3 }, 12.5); tl.to("#glowH", { opacity: 0, duration: 0.3 }, 12.5);
      tl.to("#pip", { x: 330, duration: 1.1, ease: "power1.inOut" }, 12.6);
      tl.to("#pipIn", { scaleY: 1, scaleX: 1, duration: 0.3 }, 13.4);
      tl.set("#lids", { opacity: 1 }, 13.75);

      pop("#c1", 0.02);
      pop("#c2", 1.62);
      pop("#c3", 2.82);
      pop("#c4", 7.52);
      pop("#c5", 11.42);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
