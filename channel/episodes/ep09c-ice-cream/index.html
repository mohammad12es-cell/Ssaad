<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/characters.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fredoka"; font-weight: 500; src: url("assets/fredoka-latin-500-normal.woff2") format("woff2"); }
      :root { --ground: #ffb347; --ink: #ffffff; --stroke: #2b2a6e; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 50px; right: 50px; top: 250px; bottom: auto; text-align: center; color: var(--ink); font-weight: 700; font-size: 96px; line-height: 1.05;
        -webkit-text-stroke: 16px var(--stroke); paint-order: stroke fill; }
      .cap { top: 300px; color: #2b2a6e; -webkit-text-stroke: 0; font-size: 78px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <svg id="world" class="clip stage" data-start="0" data-duration="14" data-track-index="0" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347" /><stop offset="0.6" stop-color="#ffd9a8" /><stop offset="1" stop-color="#fff3d6" /></linearGradient>
          <clipPath id="cardclip"><rect x="40" y="520" width="1000" height="1180" rx="60" /></clipPath>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c4" /><stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.7" /><stop offset="1" stop-color="#ffb347" stop-opacity="0" /></radialGradient>
        </defs>
        <rect width="1080" height="1920" fill="#fff7ea" />
        <g clip-path="url(#cardclip)"><rect width="1080" height="1920" fill="url(#sky)" />
        
        <g id="zoom" transform="translate(540,1110) scale(1.45) translate(-545,-1330)">
          <path d="M0,1250 C300,1180 700,1320 1080,1230 L1080,1920 L0,1920 Z" fill="#8be08f" />
          <path d="M0,1520 C320,1470 760,1580 1080,1500 L1080,1920 L0,1920 Z" fill="#5fcf6a" />
          <g id="sun"><circle cx="840" cy="1000" r="70" fill="#ffd166" /><circle cx="840" cy="1000" r="95" fill="#ffd166" opacity="0.3" /></g>
<g id="heat" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.6"><path d="M300,1180 q15,-20 0,-40 q-15,-20 0,-40" /><path d="M560,1160 q15,-20 0,-40 q-15,-20 0,-40" /><path d="M760,1190 q15,-20 0,-40 q-15,-20 0,-40" /></g>
<g id="peb"></g>
<g id="pip"></g>
<g id="ice" fill="#bfe9ff" opacity="0"></g>
<g id="sweat"></g>

        </g>
        <g transform="translate(0,140)"></g>
        </g><rect x="40" y="520" width="1000" height="1180" rx="60" fill="none" stroke="#2b2a6e" stroke-width="6" /><text x="540" y="1800" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="58" fill="#2b2a6e">Pip &amp; Pebble 🐸🐌</text>
      </svg>
      <div id="c1" class="clip cap" data-start="0" data-duration="1.6" data-track-index="1">It's 40°C outside 🥵</div>
<div id="c2" class="clip cap" data-start="1.7" data-duration="1.5" data-track-index="1">ICE CREAM! 🍦</div>
<div id="c3" class="clip cap" data-start="3.3" data-duration="1.1" data-track-index="1">One bite 😤</div>
<div id="c4" class="clip cap" data-start="4.4" data-duration="2.8" data-track-index="1">BRAIN FREEZE 🥶</div>
<div id="c5" class="clip cap" data-start="7.2" data-duration="2.4" data-track-index="1">Pebble: slow licks 😌</div>
<div id="c6" class="clip cap" data-start="9.8" data-duration="2.0" data-track-index="1">Mine 😎🐌</div>
<div id="c7" class="clip cap" data-start="12.2" data-duration="1.8" data-track-index="1">Still 40°C 🥵</div>
      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="14" data-volume="1"></audio>
    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const pipSVG = (s = 0.5) => `<g transform="scale(${s})">${PIP(0, -165, 1)}</g>`;
      const pebSVG = (s = 0.5, shades = false) => `<g transform="scale(${s})">${PEBBLE(0, -92, 1)}${shades ? `<g><rect x="105" y="-245" width="62" height="44" rx="14" fill="#111"/><rect x="167" y="-240" width="62" height="44" rx="14" fill="#111"/><rect x="150" y="-232" width="30" height="8" fill="#111"/><rect x="115" y="-238" width="18" height="8" rx="4" fill="#fff" opacity=".6"/></g>` : ""}</g>`;
      // eyelids for Pip (scaled 0.5): eye centres (+/-42.5, -158.5), r 29
      const lidsSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="-42.5" cy="-158.5" r="31" fill="#5fcf6a"/><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M-62,-156 C-50,-146 -35,-146 -23,-156 M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const winkSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const star = (x, y, s) => `M${x},${y - s} L${x + s * 0.25},${y - s * 0.25} L${x + s},${y} L${x + s * 0.25},${y + s * 0.25} L${x},${y + s} L${x - s * 0.25},${y + s * 0.25} L${x - s},${y} L${x - s * 0.25},${y - s * 0.25} Z`;
      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => tl.fromTo(id, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.5)" }, t);
      // dust/splash puff helper: creates n circles in group g around (x,y) and animates them at t
      function puff(g, x, y, t, color = "#e8d6b0", n = 6, spread = 60) {
        const els = []; for (let i = 0; i < n; i++) els.push(mk("circle", { cx: x, cy: y, r: 22 + (i % 3) * 8, fill: color, opacity: 0 }, $(g)));
        els.forEach((e, i) => tl.fromTo(e, { opacity: 0.9, x: 0, y: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 0, x: (i - n / 2) * spread * 0.5, y: -40 - (i % 2) * 40, scale: 1.8, transformOrigin: "50% 50%", duration: 0.7, immediateRender: false }, t));
        tl.set(els, { opacity: 0 }, 0);
      }
      const cone = (id, s) => `<g id="${id}" transform="scale(${s})"><path d="M-22,0 L22,0 L0,70 Z" fill="#e0a85a"/><path d="M-22,0 L0,70 M-8,0 L10,50 M8,0 L-10,50" stroke="#c4893f" stroke-width="3"/>
        <circle class="scoop" cx="0" cy="-14" r="24" fill="#ff8fb1"/><circle class="scoop" cx="0" cy="-48" r="22" fill="#fff3e6"/><circle class="scoop" cx="0" cy="-80" r="20" fill="#9be36f"/></g>`;
      $("pip").innerHTML = `<g id="pipIn">${pipSVG(0.5)}<ellipse id="blue" cx="0" cy="-90" rx="82" ry="72" fill="#6ec6ff" opacity="0"/><g id="lids" opacity="0">${lidsSVG(0.5)}</g><g transform="translate(105,-110)">${cone("pcone", 1.1)}</g></g>`;
      $("peb").innerHTML = `<g id="pebIn">${pebSVG(0.5, true)}<g transform="translate(110,-30)">${cone("bcone", 0.55)}</g></g>`;
      for (let i = 0; i < 6; i++) mk("path", { d: star(-80 + (i % 3) * 80, -240 - (i % 2) * 40, 14) }, $("ice"));
      const drops = []; for (let i = 0; i < 3; i++) drops.push(mk("path", { d: "M0,0 C-8,12 -8,22 0,22 C8,22 8,12 0,0 Z", fill: "#7fd6ff", opacity: 0 }, $("sweat")));
      tl.set("#pip", { x: 360, y: 1450 }, 0); tl.set("#peb", { x: 690, y: 1480 }, 0); tl.set(["#pcone", "#bcone"], { scale: 0, transformOrigin: "50% 100%" }, 0);
      // heat
      tl.to("#sun", { scale: 1.12, transformOrigin: "50% 50%", duration: 0.4, yoyo: true, repeat: 3 }, 0);
      tl.to("#heat", { y: -20, duration: 0.5, yoyo: true, repeat: 3 }, 0);
      drops.forEach((d, i) => { tl.set(d, { x: 300 + i * 40, y: 1300 }, 0.2 + i * 0.3); tl.fromTo(d, { opacity: 1, y: 1300 }, { opacity: 0, y: 1400, duration: 0.6, immediateRender: false }, 0.2 + i * 0.3); });
      tl.to("#pipIn", { scaleY: 0.92, transformOrigin: "50% 100%", duration: 0.4, yoyo: true, repeat: 1 }, 0.3);
      // cones
      tl.to("#pcone", { scale: 1.1, duration: 0.3, ease: "back.out(2.5)" }, 1.7);
      tl.to("#bcone", { scale: 0.55, duration: 0.3, ease: "back.out(2.5)" }, 1.9);
      tl.to("#pipIn", { y: -40, duration: 0.15, yoyo: true, repeat: 3 }, 2.0);
      // one bite
      tl.to("#pcone", { x: -95, y: 20, scale: 0.2, duration: 0.35, ease: "power3.in" }, 3.3);
      tl.to("#pcone", { opacity: 0, duration: 0.05 }, 3.65);
      tl.to("#pipIn", { scaleX: 1.2, scaleY: 1.1, transformOrigin: "50% 100%", duration: 0.12, yoyo: true, repeat: 1 }, 3.65);
      // brain freeze
      tl.to("#blue", { opacity: 0.6, duration: 0.3 }, 4.4); tl.set("#lids", { opacity: 1 }, 4.4);
      tl.to("#pipIn", { x: 6, duration: 0.04, yoyo: true, repeat: 49 }, 4.4);
      tl.set("#ice", { x: 360, y: 1450 }, 4.4); tl.to("#ice", { opacity: 1, duration: 0.2 }, 4.5);
      tl.fromTo("#ice", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 30, transformOrigin: "50% 50%", duration: 0.3, yoyo: true, repeat: 7, immediateRender: false }, 4.5);
      tl.to("#ice", { opacity: 0, duration: 0.3 }, 7.0);
      // Pebble slow licks
      tl.to("#pebIn", { rotation: -6, transformOrigin: "50% 100%", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 7.2);
      tl.to("#bcone .scoop:last-child", { scale: 0.7, transformOrigin: "50% 50%", duration: 2.0 }, 7.2);
      // Pip lunges, Pebble shells up with the cone
      tl.to("#blue", { opacity: 0, duration: 0.3 }, 9.4); tl.set("#lids", { opacity: 0 }, 9.4);
      tl.to("#pip", { keyframes: [{ x: 500, y: 1330, duration: 0.3, ease: "power2.out" }, { x: 600, y: 1470, duration: 0.3, ease: "power2.in" }] }, 9.8);
      tl.to("#pebIn", { scaleY: 0.6, transformOrigin: "50% 100%", duration: 0.12 }, 9.9); tl.to("#bcone", { scale: 0, duration: 0.12 }, 9.9);
      tl.to("#pipIn", { rotation: 80, transformOrigin: "50% 100%", duration: 0.2 }, 10.3);
      // Pebble pops back out licking, Pip sweaty again (loop)
      tl.to("#pebIn", { scaleY: 1, duration: 0.25, ease: "back.out(3)" }, 11.4); tl.to("#bcone", { scale: 0.55, duration: 0.25, ease: "back.out(3)" }, 11.4);
      tl.to("#pipIn", { rotation: 0, duration: 0.3 }, 12.0);
      tl.to("#pip", { x: 360, y: 1450, duration: 0.8 }, 12.3);
      tl.to("#pipIn", { scaleY: 0.85, transformOrigin: "50% 100%", duration: 0.4 }, 13.1);
      tl.to("#sun", { scale: 1.15, transformOrigin: "50% 50%", duration: 0.3, yoyo: true, repeat: 1 }, 13.2);

      pop("#c1", 0.02);
      pop("#c2", 1.72);
      pop("#c3", 3.32);
      pop("#c4", 4.42);
      pop("#c5", 7.22);
      pop("#c6", 9.82);
      pop("#c7", 12.219999999999999);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
