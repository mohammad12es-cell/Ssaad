<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/characters.js"></script>
    <style>
      @font-face { font-family: "Fredoka"; font-weight: 700; src: url("assets/fredoka-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fredoka"; font-weight: 500; src: url("assets/fredoka-latin-500-normal.woff2") format("woff2"); }
      :root { --ground: #d9e4ff; --ink: #ffffff; --stroke: #2b2a6e; --font-display: "Fredoka", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 50px; right: 50px; top: 250px; bottom: auto; text-align: center; color: var(--ink); font-weight: 700; font-size: 96px; line-height: 1.05;
        -webkit-text-stroke: 16px var(--stroke); paint-order: stroke fill; }
      .cap { top: 300px; color: #2b2a6e; -webkit-text-stroke: 0; font-size: 78px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <svg id="world" class="clip stage" data-start="0" data-duration="14" data-track-index="0" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e4ff" /><stop offset="0.6" stop-color="#eef2ff" /><stop offset="1" stop-color="#f8f9ff" /></linearGradient>
          <clipPath id="cardclip"><rect x="40" y="520" width="1000" height="1180" rx="60" /></clipPath>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c4" /><stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.7" /><stop offset="1" stop-color="#ffb347" stop-opacity="0" /></radialGradient>
        </defs>
        <rect width="1080" height="1920" fill="#fff7ea" />
        <g clip-path="url(#cardclip)"><rect width="1080" height="1920" fill="url(#sky)" />
        
        <g id="zoom" transform="translate(540,1110) scale(1.42) translate(-560,-1300)">
          <path d="M0,1250 C300,1180 700,1320 1080,1230 L1080,1920 L0,1920 Z" fill="#c9b6e8" />
          <path d="M0,1520 C320,1470 760,1580 1080,1500 L1080,1920 L0,1920 Z" fill="#b39ddb" />
          <g id="bed"><rect x="215" y="1360" width="22" height="120" rx="8" fill="#a0673e" /><rect x="225" y="1420" width="290" height="40" rx="12" fill="#c98a5a" /><rect x="230" y="1460" width="16" height="30" fill="#a0673e" /><rect x="495" y="1460" width="16" height="30" fill="#a0673e" /></g>
<g id="outlet" transform="translate(-180,0)"><rect x="850" y="1330" width="56" height="76" rx="10" fill="#fff" stroke="#bbb" stroke-width="4" /><rect x="864" y="1352" width="8" height="18" rx="3" fill="#555" /><rect x="884" y="1352" width="8" height="18" rx="3" fill="#555" /></g>
<path d="M770,1440 C760,1480 700,1470 698,1400" stroke="#fff" stroke-width="7" fill="none" />
<g id="pcable" transform="translate(-100,0)"><path d="M600,1478 C650,1500 690,1460 740,1488" stroke="#fff" stroke-width="7" fill="none" /><rect id="brick" x="735" y="1470" width="40" height="30" rx="6" fill="#eee" stroke="#bbb" stroke-width="3" /><rect x="772" y="1478" width="10" height="5" fill="#999" /><rect x="772" y="1489" width="10" height="5" fill="#999" />
  <rect id="plugEnd" x="585" y="1470" width="22" height="14" rx="4" fill="#ddd" /></g>
<g id="peb"></g>
<g id="pip"></g>
<g id="arrow" opacity="0" transform="translate(-100,-20)"><path d="M760,1380 L760,1440" stroke="#ff5a5f" stroke-width="10" stroke-linecap="round" /><path d="M740,1420 L760,1450 L780,1420" stroke="#ff5a5f" stroke-width="10" fill="none" stroke-linecap="round" /></g>
<path id="glint" d="M0,-24 L5,-5 L24,0 L5,5 L0,24 L-5,5 L-24,0 L-5,-5 Z" fill="#fff" opacity="0" />

        </g>
        <g transform="translate(0,140)"></g>
        </g><rect x="40" y="520" width="1000" height="1180" rx="60" fill="none" stroke="#2b2a6e" stroke-width="6" /><text x="540" y="1800" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="58" fill="#2b2a6e">Pip &amp; Pebble 🐸🐌</text>
      </svg>
      <div id="c1" class="clip cap" data-start="0" data-duration="1.5" data-track-index="1">1% battery 🔋</div>
<div id="c2" class="clip cap" data-start="1.5" data-duration="2.0" data-track-index="1">Too lazy to get up 😩</div>
<div id="c3" class="clip cap" data-start="3.6" data-duration="1.8" data-track-index="1">Plan B 👅</div>
<div id="c4" class="clip cap" data-start="5.5" data-duration="2.0" data-track-index="1">Plan C 🐛</div>
<div id="c5" class="clip cap" data-start="7.6" data-duration="1.4" data-track-index="1">Plugged in! ✅</div>
<div id="c6" class="clip cap" data-start="9.0" data-duration="2.6" data-track-index="1">…charger wasn't<br />plugged in 💀</div>
<div id="c7" class="clip cap" data-start="11.6" data-duration="2.4" data-track-index="1">Pebble: 100% 😎🔋</div>
      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="14" data-volume="1"></audio>
    </div>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const pipSVG = (s = 0.5) => `<g transform="scale(${s})">${PIP(0, -165, 1)}</g>`;
      const pebSVG = (s = 0.5, shades = false) => `<g transform="scale(${s})">${PEBBLE(0, -92, 1)}${shades ? `<g><rect x="105" y="-245" width="62" height="44" rx="14" fill="#111"/><rect x="167" y="-240" width="62" height="44" rx="14" fill="#111"/><rect x="150" y="-232" width="30" height="8" fill="#111"/><rect x="115" y="-238" width="18" height="8" rx="4" fill="#fff" opacity=".6"/></g>` : ""}</g>`;
      // eyelids for Pip (scaled 0.5): eye centres (+/-42.5, -158.5), r 29
      const lidsSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="-42.5" cy="-158.5" r="31" fill="#5fcf6a"/><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M-62,-156 C-50,-146 -35,-146 -23,-156 M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const winkSVG = (s = 0.5) => `<g transform="scale(${s / 0.5})"><circle cx="42.5" cy="-158.5" r="31" fill="#5fcf6a"/><path d="M23,-156 C35,-146 50,-146 62,-156" stroke="#1b1a2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
      const star = (x, y, s) => `M${x},${y - s} L${x + s * 0.25},${y - s * 0.25} L${x + s},${y} L${x + s * 0.25},${y + s * 0.25} L${x},${y + s} L${x - s * 0.25},${y + s * 0.25} L${x - s},${y} L${x - s * 0.25},${y - s * 0.25} Z`;
      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => tl.fromTo(id, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.5)" }, t);
      // dust/splash puff helper: creates n circles in group g around (x,y) and animates them at t
      function puff(g, x, y, t, color = "#e8d6b0", n = 6, spread = 60) {
        const els = []; for (let i = 0; i < n; i++) els.push(mk("circle", { cx: x, cy: y, r: 22 + (i % 3) * 8, fill: color, opacity: 0 }, $(g)));
        els.forEach((e, i) => tl.fromTo(e, { opacity: 0.9, x: 0, y: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 0, x: (i - n / 2) * spread * 0.5, y: -40 - (i % 2) * 40, scale: 1.8, transformOrigin: "50% 50%", duration: 0.7, immediateRender: false }, t));
        tl.set(els, { opacity: 0 }, 0);
      }
      const phone = (id, txtId, col) => `<g id="${id}"><rect x="-26" y="-44" width="52" height="88" rx="10" fill="#22213a"/><rect id="${id}S" x="-20" y="-36" width="40" height="72" rx="6" fill="${col}"/><text id="${txtId}" x="0" y="8" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="18" fill="#fff"></text></g>`;
      $("pip").innerHTML = `<g id="pipIn">${pipSVG(0.5)}<g transform="translate(95,-160)">${phone("pp", "ppT", "#ff5a5f")}</g><g id="tongue" opacity="0"><rect x="0" y="-8" width="200" height="16" rx="8" fill="#ff6f91"/><circle cx="200" cy="0" r="12" fill="#ff6f91"/></g></g>`;
      $("peb").innerHTML = `<g id="pebIn">${pebSVG(0.5, true)}<g transform="translate(-30,-40) scale(0.8)">${phone("bp", "bpT", "#5fcf6a")}</g></g>`;
      tl.set("#pip", { x: 360, y: 1410, rotation: -10 }, 0); tl.set("#peb", { x: 805, y: 1480 }, 0);
      tl.set("#ppT", { textContent: "1%" }, 0); tl.set("#bpT", { textContent: "100%" }, 0); tl.set("#tongue", { x: 30, y: -80, rotation: 15, transformOrigin: "0% 50%" }, 0);
      tl.to("#ppS", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 3 }, 0);
      // stretch
      tl.to("#pip", { rotation: 0, duration: 0.3 }, 1.5);
      tl.to("#pipIn", { scaleX: 1.6, transformOrigin: "0% 100%", duration: 0.8, ease: "power2.out" }, 1.7);
      tl.to("#pipIn", { scaleX: 1.5, duration: 0.15, yoyo: true, repeat: 5 }, 2.5);
      tl.to("#pipIn", { scaleX: 1, duration: 0.3, ease: "back.out(2)" }, 3.3);
      // tongue
      tl.set("#tongue", { opacity: 1, scaleX: 0 }, 3.6);
      tl.to("#tongue", { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.6);
      tl.to("#tongue", { scaleX: 0.95, duration: 0.1, yoyo: true, repeat: 5 }, 3.9);
      tl.to("#tongue", { scaleX: 0, duration: 0.2 }, 5.1); tl.set("#tongue", { opacity: 0 }, 5.3);
      // roll off bed, crawl
      tl.to("#pip", { keyframes: [{ x: 480, y: 1350, rotation: 60, duration: 0.3 }, { x: 520, y: 1480, rotation: 90, duration: 0.3, ease: "power2.in" }] }, 5.5);
      tl.to("#pip", { x: 530, duration: 1.2, ease: "none" }, 6.2);
      tl.to("#pipIn", { scaleX: 1.1, transformOrigin: "50% 100%", duration: 0.15, yoyo: true, repeat: 7 }, 6.2);
      // plugged in... dies
      tl.to("#pip", { rotation: 0, y: 1470, duration: 0.3 }, 7.5);
      tl.to("#plugEnd", { x: 60, y: -40, duration: 0.2 }, 7.6);
      tl.set("#ppT", { textContent: "⚡1%" }, 7.8); tl.set("#ppS", { opacity: 1 }, 7.8);
      tl.set("#ppT", { textContent: "0%" }, 8.6); tl.to("#ppS", { attr: { fill: "#000" }, duration: 0.2 }, 8.8); tl.set("#ppT", { textContent: "" }, 8.9);
      // the reveal
      tl.to("#arrow", { opacity: 1, duration: 0.2 }, 9.2); tl.to("#arrow", { y: 15, duration: 0.25, yoyo: true, repeat: 5 }, 9.2); tl.to("#arrow", { opacity: 0, duration: 0.2 }, 11.0);
      tl.to("#pipIn", { scaleY: 0.8, transformOrigin: "50% 100%", duration: 0.5 }, 10.0);
      // Pebble 100%
      tl.set("#glint", { x: 790, y: 1400 }, 11.6);
      tl.fromTo("#glint", { opacity: 0, scale: 0.2, rotation: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 90, transformOrigin: "50% 50%", duration: 0.25, yoyo: true, repeat: 1 }, 11.6);
      tl.to("#pebIn", { rotation: -6, transformOrigin: "50% 100%", duration: 0.3, yoyo: true, repeat: 3 }, 11.8);
      tl.to("#pipIn", { rotation: -80, transformOrigin: "50% 100%", duration: 0.5, ease: "bounce.out" }, 12.8);

      pop("#c1", 0.02);
      pop("#c2", 1.52);
      pop("#c3", 3.62);
      pop("#c4", 5.52);
      pop("#c5", 7.619999999999999);
      pop("#c6", 9.02);
      pop("#c7", 11.62);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
