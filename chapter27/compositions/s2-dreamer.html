    (function () {
      const tl = gsap.timeline({ paused: true });
      const boy = window.HFFig("#s2-boy");
      // A child: smaller body, larger head. Stands on the rock, left third, looking at the sun.
      gsap.set("#s2-boy", { x: 600, y: 650, scale: 0.64 });
      gsap.set(boy.parts.neck, { scale: 1.42 });
      boy.setPose(tl, "look", 0);
      // He lifts his head slowly toward the horizon, weight shifts once.
      tl.to(boy.parts.neck, { rotation: -20, duration: 5, ease: "sine.inOut" }, 2.0);
      tl.to(boy.parts.torso, { rotation: -5, duration: 4, ease: "sine.inOut" }, 3.0);
      tl.to(boy.parts.shL, { rotation: -4, duration: 4, ease: "sine.inOut" }, 3.0);

      // Camera: one slow dolly-in with 3-layer parallax.
      tl.fromTo("#s2-cam", { scale: 1.0, transformOrigin: "1100px 640px" }, { scale: 1.12, duration: 11.3, ease: "sine.inOut" }, 0);
      tl.fromTo("#s2-far", { x: 0 }, { x: -24, duration: 11.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#s2-mid", { x: 0 }, { x: -60, duration: 11.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#s2-fg", { x: 0 }, { x: -150, duration: 11.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#s2-sun", { y: 14 }, { y: 0, duration: 12, ease: "sine.out" }, 0);
      tl.fromTo("#s2-rays", { rotation: -4, opacity: 0.6 }, { rotation: 3, opacity: 1, duration: 13, ease: "none" }, 0);
      tl.fromTo("#s2-birds", { x: -60 }, { x: 260, duration: 13, ease: "none" }, 0);

      // Grass sways (finite repeats).
      [["#s2-grass1", 2.2, 3], ["#s2-grass2", 2.6, -2.5], ["#s2-grass3", 1.9, 4]].forEach(([sel, half, amp], i) => {
        tl.fromTo(sel, { rotation: -amp, transformOrigin: "50% 100%" },
          { rotation: amp, duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(13 / half) - 1) }, 0.2 * i);
      });

      // Opening: rise from the S1 black, horizon first.
      tl.fromTo("#s2-stage", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.out" }, 0);

      // Hand-off: push into the sun until the frame whites out to gold.

      tl.to("#s2-flash", { opacity: 1, duration: 0.7, ease: "power2.in" }, 12.25);

      const dust = window.HFDust(document.getElementById("s2-dust"), {
        seed: 2, count: 90, minR: 0.7, maxR: 2.4, drift: [9, -3], sway: 14, alpha: 0.55,
        light: { x: 1370, y: 660, r: 900 },
      });

      window.__timelines["s2"] = tl;
