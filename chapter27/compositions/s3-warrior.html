  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const W = "#s3-world ";
      const fig = window.HFFig("#s3-fig");
      gsap.set("#s3-ball", { svgOrigin: "0 0" });
      const ball = "#s3-ball";

      // ── Open: the gold bloom from S2 resolves into one flood light switching on (26.35 s).
      tl.fromTo("#s3-flash", { opacity: 1 }, { opacity: 0, duration: 1.1, ease: "power2.out" }, 0);
      tl.fromTo(W + ".bank2 .bulbs-on", { opacity: 0 }, { opacity: 1, duration: 0.06 }, 0.35);
      tl.fromTo(W + ".bank2 .glow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.35);
      tl.fromTo([W + ".cone", W + ".pool"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.37);
      tl.fromTo(W + ".bank1 .bulbs-off, " + W + ".bank3 .bulbs-off", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);

      // ── Shot A (0 – 5): wide. He is alone under the one light, bouncing the ball.
      tl.set("#s3-cam", { scale: 1.0, x: 0, y: 0, transformOrigin: "960px 540px" }, 0);
      tl.fromTo("#s3-cam", { scale: 1.0 }, { scale: 1.06, duration: 5, ease: "sine.inOut" }, 0);
      tl.set("#s3-fig", { x: 700, y: 668, scale: 0.87, opacity: 1 }, 0);
      fig.setPose(tl, "dribbleUp", 0);
      const hand = { x: 742, y: 694 }, floorY = 818;
      tl.set(ball, { x: hand.x, y: hand.y, scale: 0.87, opacity: 1 }, 0);
      [1.55, 2.75, 3.95].forEach((tf) => {
        tl.to(ball, { y: floorY, duration: 0.55, ease: "power2.in" }, tf - 0.55);
        tl.to(ball, { y: hand.y, duration: 0.6, ease: "power2.out" }, tf);
        fig.pose(tl, "dribbleDown", tf - 0.5, 0.5, "sine.in");
        fig.pose(tl, "dribbleUp", tf, 0.6, "sine.out");
      });
      tl.to(ball, { rotation: 140, duration: 4, ease: "none" }, 1);

      // ── Shot B (5 – 12): punch-in, low. Slow motion: approach, jump, LEFT-arm spike.
      tl.set("#s3-cam", { scale: 1.5, x: 0, y: 90, transformOrigin: "760px 430px" }, 5.0);
      tl.to("#s3-cam", { x: -150, duration: 6.5, ease: "sine.inOut" }, 5.0);
      tl.set("#s3-fig", { x: 520, y: 668 }, 5.0);
      tl.set(ball, { x: 260, y: 120, rotation: 0 }, 5.0);
      fig.setPose(tl, "runB", 5.0);
      fig.cycle(tl, "runA", "runB", 5.0, 0.42, 4);
      tl.to("#s3-fig", { x: 700, duration: 1.68, ease: "none" }, 5.0);
      fig.pose(tl, "load", 6.68, 0.62, "power2.out");
      tl.to("#s3-fig", { x: 765, y: 700, duration: 0.62, ease: "power1.out" }, 6.68);
      fig.pose(tl, "rise", 7.3, 0.55, "power2.out");
      tl.to("#s3-fig", { x: 840, y: 480, duration: 0.7, ease: "power2.out" }, 7.3);
      fig.pose(tl, "cock", 7.85, 0.75, "sine.inOut");
      tl.to("#s3-fig", { x: 858, y: 458, duration: 0.95, ease: "sine.out" }, 8.0);
      fig.pose(tl, "contact", 8.6, 0.35, "power3.in");
      fig.pose(tl, "follow", 8.95, 0.9, "power2.out");
      tl.to("#s3-fig", { x: 900, y: 560, duration: 0.9, ease: "sine.in" }, 8.95);
      fig.pose(tl, "land", 9.85, 0.7, "power2.out");
      tl.to("#s3-fig", { x: 925, y: 698, duration: 0.7, ease: "power2.out" }, 9.85);
      fig.pose(tl, "stand", 10.6, 1.2, "sine.inOut");
      tl.to("#s3-fig", { y: 668, duration: 1.2, ease: "sine.inOut" }, 10.6);
      // The set arrives from the dark and meets the hand at 8.95 s (34.95 s on the film).
      tl.to(ball, { x: 950, duration: 2.05, ease: "none" }, 6.9);
      tl.to(ball, { y: 215, duration: 1.1, ease: "power1.out" }, 6.9);
      tl.to(ball, { y: 282, duration: 0.95, ease: "power1.in" }, 8.0);
      tl.to(ball, { rotation: 220, duration: 2.05, ease: "none" }, 6.9);
      // Contact: the ball leaves fast even in slow motion.
      tl.to(ball, { x: 1720, y: 905, rotation: 900, duration: 0.5, ease: "power1.in" }, 8.95);
      tl.set("#s3-flash", { opacity: 0 }, 1.2);
      tl.to("#s3-flash", { opacity: 0.32, duration: 0.05, ease: "none" }, 8.95);
      tl.to("#s3-flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 9.0);

      tl.set("#s3-shadow", { x: 700, y: 832, scale: 1, opacity: 0.5, svgOrigin: "0 0" }, 0);
      tl.set("#s3-shadow", { x: 520 }, 5.0);
      // Contact shadow on the floor: shrinks and fades while he is in the air.
      tl.to("#s3-shadow", { x: 700, duration: 1.68, ease: "none" }, 5.0);
      tl.to("#s3-shadow", { x: 765, duration: 0.62, ease: "power1.out" }, 6.68);
      tl.to("#s3-shadow", { x: 840, duration: 0.7, ease: "power2.out" }, 7.3);
      tl.to("#s3-shadow", { x: 858, duration: 0.95, ease: "sine.out" }, 8.0);
      tl.to("#s3-shadow", { x: 900, duration: 0.9, ease: "sine.in" }, 8.95);
      tl.to("#s3-shadow", { x: 925, duration: 0.7, ease: "power2.out" }, 9.85);
      tl.to("#s3-shadow", { scale: 0.5, opacity: 0.2, duration: 0.7, ease: "power2.out" }, 7.3);
      tl.to("#s3-shadow", { scale: 0.42, opacity: 0.16, duration: 0.95, ease: "sine.out" }, 8.0);
      tl.to("#s3-shadow", { scale: 0.7, opacity: 0.3, duration: 0.9, ease: "sine.in" }, 8.95);
      tl.to("#s3-shadow", { scale: 1, opacity: 0.5, duration: 0.7, ease: "power2.out" }, 9.85);

      // ── Shot C (12 – 16): the floor. The ball lands in the dark; dust rises.
      tl.set("#s3-cam", { scale: 2.2, x: 0, y: -150, transformOrigin: "1650px 905px" }, 12.0);
      tl.set(["#s3-fig", "#s3-shadow"], { opacity: 0 }, 12.0);
      tl.to("#s3-cam", { scale: 2.36, duration: 4, ease: "sine.inOut" }, 12.0);
      tl.set(ball, { x: 1380, y: 590, rotation: 0 }, 12.0);
      tl.to(ball, { x: 1650, y: 893, duration: 0.95, ease: "power2.in" }, 12.0);
      tl.to(ball, { rotation: 300, duration: 0.95, ease: "none" }, 12.0);
      tl.to(ball, { x: 1840, duration: 1.4, ease: "power1.out" }, 12.95);
      tl.to(ball, { y: 760, duration: 0.7, ease: "power2.out" }, 12.95);
      tl.to(ball, { y: 893, duration: 0.7, ease: "power2.in" }, 13.65);
      tl.to(ball, { rotation: 520, duration: 1.4, ease: "power1.out" }, 12.95);
      tl.fromTo("#s3-ring ellipse", { attr: { rx: 10, ry: 2 }, opacity: 0.8 },
        { attr: { rx: 190, ry: 34 }, opacity: 0, duration: 1.6, ease: "expo.out" }, 12.95);

      // ── End: the light cuts out (41.9 s).
      tl.to([W + ".bank2 .bulbs-on", W + ".bank2 .glow", W + ".cone", W + ".pool"], { opacity: 0, duration: 0.08, ease: "none" }, 15.9);
      tl.to("#s3-dark", { opacity: 0.6, duration: 0.08, ease: "none" }, 15.9);

      // Dust in the light cone (world space, moves with the camera).
      const dust = window.HFDust(document.getElementById("s3-dust"), {
        seed: 3, count: 140, minR: 0.6, maxR: 2.0, drift: [3, -5], sway: 18, alpha: 0.7,
        region: { x: 380, y: 180, w: 840, h: 830 }, light: { x: 780, y: 620, r: 470 },
      });
      // Bursts: sweat at the contact (slow-mo), floor dust where the ball lands.
      const bctx = document.getElementById("s3-burst").getContext("2d");
      const R = window.HFRand(33);
      const mk = (n, sp, up, spread) => Array.from({ length: n }, () => {
        const a = -Math.PI / 2 + (R() - 0.5) * spread;
        const v = sp * (0.3 + R());
        return { vx: Math.cos(a) * v, vy: Math.sin(a) * v * up, r: 0.8 + R() * 2.4, a: 0.5 + R() * 0.5 };
      });
      const sweat = mk(26, 60, 1, Math.PI * 1.6);
      const floorDust = mk(80, 140, 0.45, Math.PI * 1.1);
      const drawBurst = (ps, t0, t, x0, y0, g, life, col) => {
        const k = t - t0;
        if (k < 0 || k > life) return;
        ps.forEach((p) => {
          const x = x0 + p.vx * k, y = y0 + p.vy * k + 0.5 * g * k * k;
          const al = p.a * Math.pow(1 - k / life, 1.6);
          bctx.fillStyle = "rgba(" + col + "," + al.toFixed(3) + ")";
          bctx.beginPath(); bctx.arc(x, y, p.r, 0, 6.283); bctx.fill();
        });
      };
      window.HFDrive(tl, (t) => {
        dust(t, t < 0.37 ? 0 : t > 15.9 ? 0 : 1);
        bctx.clearRect(0, 0, 1920, 1080);
        drawBurst(sweat, 8.95, t, 930, 300, 40, 2.4, "246,232,200");
        drawBurst(floorDust, 12.95, t, 1650, 905, 70, 2.8, "214,186,140");
      }, 0, 16);

      window.__timelines["s3"] = tl;
    })();
  </script>
