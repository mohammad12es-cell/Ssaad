  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const W = "#s4-world ";
      const fig = window.HFFig("#s4-fig");
      gsap.set("#s4-ball", { svgOrigin: "0 0" });

      // Two side banks still burn, then cut out one by one (42.7 s, 43.5 s).
      tl.fromTo(W + ".bank1 .bulbs-on, " + W + ".bank3 .bulbs-on", { opacity: 0.75 }, { opacity: 0.75, duration: 0.01 }, 0);
      tl.fromTo(W + ".bank1 .glow, " + W + ".bank3 .glow", { opacity: 0.45 }, { opacity: 0.45, duration: 0.01 }, 0);
      tl.to([W + ".bank1 .bulbs-on", W + ".bank1 .glow"], { opacity: 0, duration: 0.08, ease: "none" }, 0.7);
      tl.to([W + ".bank3 .bulbs-on", W + ".bank3 .glow"], { opacity: 0, duration: 0.08, ease: "none" }, 1.5);
      tl.fromTo("#s4-dim", { opacity: 0.12 }, { opacity: 0.22, duration: 0.08, ease: "none" }, 0.7);
      tl.to("#s4-dim", { opacity: 0.3, duration: 0.08, ease: "none" }, 1.5);
      // Only the door at the back is left: the way out.
      tl.fromTo(W + ".door", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.inOut" }, 0.8);

      // The ball rolls to rest, alone.
      tl.fromTo("#s4-ball", { x: 400, y: 905, rotation: 0, scale: 0.95 }, { x: 520, rotation: 260, duration: 3.2, ease: "power3.out" }, 0);

      // Camera: a slow, lonely pull-back.
      tl.fromTo("#s4-cam", { scale: 1.12, transformOrigin: "1100px 640px" }, { scale: 1.0, duration: 13, ease: "sine.out" }, 0);

      // He stands, head down; then turns and walks away into the light.
      tl.set("#s4-fig", { x: 760, y: 668, scale: 0.87, opacity: 1 }, 0);
      fig.setPose(tl, "stand", 0);
      tl.to(fig.parts.neck, { rotation: 22, duration: 1.6, ease: "sine.inOut" }, 0.3);
      tl.to(fig.parts.torso, { rotation: 8, duration: 1.6, ease: "sine.inOut" }, 0.3);
      const walkStart = 2.6, walkEnd = 11.6, half = 0.6;
      fig.cycle(tl, "stepA", "stepB", walkStart, half, Math.floor((walkEnd - walkStart) / half));
      tl.to("#s4-fig", { x: 1590, y: 523, scale: 0.42, duration: walkEnd - walkStart, ease: "none" }, walkStart);
      tl.to("#s4-fig", { opacity: 0, duration: 0.5, ease: "power1.in" }, 11.2);

      // The door closes (54.2 s on the film). Black.
      tl.to(W + ".door-light", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.22, ease: "power2.in" }, 11.98);
      tl.to(W + ".door-spill", { opacity: 0, duration: 0.22, ease: "power2.in" }, 11.98);
      tl.to("#s4-black", { opacity: 1, duration: 0.25, ease: "power2.in" }, 12.0);

      const dust = window.HFDust(document.getElementById("s4-dust"), {
        seed: 4, count: 60, minR: 0.5, maxR: 1.6, drift: [-2, -3], sway: 10, alpha: 0.5,
        region: { x: 1300, y: 460, w: 560, h: 600 }, light: { x: 1600, y: 720, r: 380 },
      });
      window.HFDrive(tl, (t) => dust(t, t < 0.8 ? 0 : t > 11.98 ? 0 : Math.min(1, (t - 0.8) / 1.6)), 0, 13);
      window.__timelines["s4"] = tl;
    })();
  </script>
