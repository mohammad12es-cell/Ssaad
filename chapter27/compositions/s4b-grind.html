  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const W = "#gr-world ";
      const fig = window.HFFig("#gr-fig");
      const F = "#gr-fig", B = "#gr-ball", P = "#gr-plate", S = "#gr-shadow", CAM = "#gr-cam";
      gsap.set([B, P, S], { svgOrigin: "0 0" });
      const flash = (at, peak) => {
        tl.to("#gr-flash", { opacity: peak || 0.55, duration: 0.04, ease: "none" }, at);
        tl.to("#gr-flash", { opacity: 0, duration: 0.16, ease: "power2.out" }, at + 0.04);
      };
      const cam = (at, scale, ox, oy, x, y) => tl.set(CAM, { scale, transformOrigin: ox + "px " + oy + "px", x: x || 0, y: y || 0 }, at);
      const punch = (at, from, to, d) => tl.to(CAM, { scale: to, duration: d, ease: "sine.out" }, at);
      tl.set("#gr-flash", { opacity: 0 }, 0);

      // Night practice: one light, every night.
      tl.fromTo(W + ".bank2 .bulbs-on", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo(W + ".bank2 .glow", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo([W + ".cone", W + ".pool"], { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);

      // ── A (0 – 2.5): block jumps at the net.
      cam(0, 1.35, 1040, 560);
      punch(0, 1.35, 1.42, 2.5);
      tl.fromTo("#gr-dark", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0);
      tl.set(F, { x: 1040, y: 668, scale: 0.87, opacity: 1 }, 0);
      tl.set(S, { x: 1040, y: 832, scale: 1, opacity: 0.5 }, 0);
      fig.setPose(tl, "stand", 0);
      [[0.25, 0.95], [1.4, 2.05]].forEach(([a, l]) => {
        fig.pose(tl, "load", a, 0.25, "power2.out");
        tl.to(F, { y: 700, duration: 0.25, ease: "power2.out" }, a);
        fig.pose(tl, "rise", a + 0.25, 0.3, "power3.out");
        tl.to(F, { y: 498, duration: 0.3, ease: "power3.out" }, a + 0.25);
        tl.to(S, { scale: 0.45, opacity: 0.18, duration: 0.3, ease: "power3.out" }, a + 0.25);
        fig.pose(tl, "land", l, 0.3, "power2.in");
        tl.to(F, { y: 690, duration: 0.3, ease: "power2.in" }, l);
        tl.to(S, { scale: 1, opacity: 0.5, duration: 0.3, ease: "power2.in" }, l);
      });

      // ── B (2.5 – 4.5): sprint the length of the court.
      flash(2.5);
      cam(2.5, 1.6, 960, 540, 1056, -60);
      tl.to(CAM, { x: -1024, duration: 2.0, ease: "none" }, 2.5);
      tl.set(F, { x: 200, y: 668 }, 2.5);
      tl.set(S, { opacity: 0 }, 2.5);
      fig.setPose(tl, "runA", 2.5);
      fig.cycle(tl, "runB", "runA", 2.5, 0.16, 12);
      tl.to(F, { x: 1500, duration: 2.0, ease: "none" }, 2.5);

      // ── C (4.5 – 7.6): spike after spike.
      flash(4.5);
      cam(4.5, 1.5, 760, 430, -150, 90);
      tl.set(S, { x: 700, y: 832, scale: 1, opacity: 0.5 }, 4.5);
      [5.25, 6.2, 7.15].forEach((c, k) => {
        const a = c - 0.6;
        tl.set(F, { x: 700, y: 668 }, a);
        tl.set(S, { x: 700 }, a);
        fig.setPose(tl, "stand", a);
        fig.pose(tl, "load", a, 0.13, "power2.out");
        tl.to(F, { x: 765, y: 700, duration: 0.13, ease: "power1.out" }, a);
        fig.pose(tl, "rise", a + 0.13, 0.17, "power2.out");
        tl.to(F, { x: 840, y: 470, duration: 0.17, ease: "power2.out" }, a + 0.13);
        tl.to(S, { x: 840, scale: 0.45, opacity: 0.18, duration: 0.17, ease: "power2.out" }, a + 0.13);
        fig.pose(tl, "cock", a + 0.3, 0.2, "sine.inOut");
        tl.to(F, { x: 858, y: 452, duration: 0.2, ease: "sine.out" }, a + 0.3);
        fig.pose(tl, "contact", c - 0.1, 0.1, "power4.in");
        fig.pose(tl, "follow", c, 0.2, "power2.out");
        tl.to(F, { x: 900, y: 560, duration: 0.2, ease: "sine.in" }, c);
        fig.pose(tl, "land", c + 0.2, 0.14, "power2.out");
        tl.to(F, { x: 925, y: 698, duration: 0.14, ease: "power2.out" }, c + 0.2);
        tl.to(S, { x: 925, scale: 1, opacity: 0.5, duration: 0.34, ease: "power2.in" }, c);
        tl.set(B, { x: 860, y: 140, opacity: 1, rotation: 0, scale: 0.87 }, a + 0.1);
        tl.to(B, { x: 950, y: 280, duration: c - a - 0.1, ease: "power1.in" }, a + 0.1);
        tl.to(B, { x: 1800, y: 905, rotation: 900, duration: 0.24, ease: "power1.in" }, c);
        flash(c, 0.35);
        tl.to(CAM, { x: -150 + (k % 2 ? -10 : 12), y: 98, duration: 0.05, ease: "none" }, c);
        tl.to(CAM, { x: -150, y: 90, duration: 0.18, ease: "power2.out" }, c + 0.05);
      });
      tl.set(B, { opacity: 0 }, 7.6);

      // ── D (7.6 – 10.0): squats under the bar.
      flash(7.6);
      cam(7.6, 1.7, 720, 600, 0, 0);
      punch(7.6, 1.7, 1.78, 2.4);
      tl.set(F, { x: 720, y: 668 }, 7.6);
      tl.set(S, { x: 720, y: 832, scale: 1, opacity: 0.5 }, 7.6);
      fig.setPose(tl, "squatTop", 7.6);
      const top = { x: 720 + 11.9 - 20, y: 668 - 84.5 + 10 }, bot = { x: 720 - 53 + 52.5 - 26, y: 668 + 92 - 67.2 + 14 };
      tl.set(P, { x: top.x, y: top.y, opacity: 1 }, 7.6);
      [[7.85, 0.42, 0.42], [8.8, 0.45, 0.6]].forEach(([d, down, up]) => {
        fig.pose(tl, "squatBottom", d, down, "power2.inOut");
        tl.to(F, { x: 667, y: 760, duration: down, ease: "power2.inOut" }, d);
        tl.to(P, { x: bot.x, y: bot.y, duration: down, ease: "power2.inOut" }, d);
        fig.pose(tl, "squatTop", d + down + 0.05, up, "power2.inOut");
        tl.to(F, { x: 720, y: 668, duration: up, ease: "power2.inOut" }, d + down + 0.05);
        tl.to(P, { x: top.x, y: top.y, duration: up, ease: "power2.inOut" }, d + down + 0.05);
      });
      tl.set(P, { opacity: 0 }, 10.0);

      // ── E (10.0 – 11.6): it all, faster — four hard cuts.
      const hits = [
        [10.0, () => { cam(10.0, 2.0, 1040, 450); tl.set(F, { x: 1040, y: 500 }, 10.0); fig.setPose(tl, "rise", 10.0); tl.set(S, { x: 1040, scale: 0.45, opacity: 0.18 }, 10.0); }],
        [10.4, () => { cam(10.4, 2.2, 900, 350); tl.set(F, { x: 858, y: 452 }, 10.4); fig.setPose(tl, "contact", 10.4); tl.set(B, { x: 950, y: 280, opacity: 1 }, 10.4); tl.set(S, { opacity: 0 }, 10.4); }],
        [10.8, () => { cam(10.8, 2.0, 700, 640); tl.set(B, { opacity: 0 }, 10.8); tl.set(F, { x: 667, y: 760 }, 10.8); fig.setPose(tl, "squatBottom", 10.8); tl.set(P, { x: bot.x, y: bot.y, opacity: 1 }, 10.8); }],
        [11.2, () => { cam(11.2, 2.2, 900, 560); tl.set(P, { opacity: 0 }, 11.2); tl.set(F, { x: 900, y: 668 }, 11.2); fig.setPose(tl, "runA", 11.2); }],
      ];
      hits.forEach(([at, fn]) => { flash(at, 0.6); fn(); });
      [10.0, 10.4, 10.8, 11.2].forEach((at, i) => {
        tl.to(CAM, { scale: "+=0.07", duration: 0.38, ease: "sine.out" }, at + 0.01);
      });
      fig.pose(tl, "runB", 11.2, 0.2, "none");

      // ── F (11.6 – 13): spent. Hands on knees, then he looks up at the light.
      flash(11.6, 0.3);
      cam(11.6, 1.3, 760, 600);
      tl.to(CAM, { scale: 1.38, duration: 1.4, ease: "sine.inOut" }, 11.6);
      tl.set(F, { x: 760, y: 690 }, 11.6);
      tl.set(S, { x: 760, y: 832, scale: 1, opacity: 0.5 }, 11.6);
      fig.setPose(tl, "tired", 11.6);
      tl.to(fig.parts.torso, { rotation: 50, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.65);
      fig.pose(tl, "look", 12.15, 0.55, "power2.inOut");
      tl.to(F, { y: 668, duration: 0.55, ease: "power2.inOut" }, 12.15);
      tl.to(fig.parts.neck, { rotation: -24, duration: 0.4, ease: "sine.out" }, 12.55);
      tl.to([W + ".bank2 .bulbs-on", W + ".bank2 .glow", W + ".cone", W + ".pool"], { opacity: 0.35, duration: 0.05, ease: "none" }, 12.45);
      tl.to([W + ".bank2 .bulbs-on", W + ".bank2 .glow", W + ".cone", W + ".pool"], { opacity: 1, duration: 0.05, ease: "none" }, 12.55);
      tl.to("#gr-dark", { opacity: 1, duration: 0.12, ease: "power2.in" }, 12.83);

      // The days roll: 001 → 730.
      tl.fromTo("#gr-counter", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.4);
      const day = document.getElementById("gr-day");
      const dc = { d: 1 };
      const setDay = () => { day.textContent = String(Math.round(dc.d)).padStart(3, "0"); };
      tl.fromTo(dc, { d: 1 }, { d: 730, duration: 11.0, ease: "power2.in", onUpdate: setDay }, 0.4);
      tl.to("#gr-counter", { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, 12.6);
      setDay();

      // Dust in the light; sweat on every landing, every hit, the last rep.
      const dust = window.HFDust(document.getElementById("gr-dust"), {
        seed: 9, count: 150, minR: 0.6, maxR: 2.1, drift: [4, -7], sway: 18, alpha: 0.75,
        region: { x: 300, y: 180, w: 1300, h: 830 }, light: { x: 780, y: 620, r: 560 },
      });
      const bctx = document.getElementById("gr-burst").getContext("2d");
      const R = window.HFRand(730);
      const mk = (n, sp, up, spread) => Array.from({ length: n }, () => {
        const a = -Math.PI / 2 + (R() - 0.5) * spread, v = sp * (0.3 + R());
        return { vx: Math.cos(a) * v, vy: Math.sin(a) * v * up, r: 0.8 + R() * 2.4, a: 0.5 + R() * 0.5 };
      });
      const sweat = mk(28, 220, 1, Math.PI * 1.6), floor = mk(60, 240, 0.35, Math.PI * 1.25);
      const ev = [
        [sweat, 0.8, 1040, 360], [floor, 1.25, 1040, 860], [sweat, 1.95, 1040, 355], [floor, 2.35, 1040, 860],
        [sweat, 5.25, 930, 300], [sweat, 6.2, 930, 300], [sweat, 7.15, 930, 300], [floor, 5.6, 935, 862], [floor, 7.5, 935, 862],
        [sweat, 9.9, 735, 560], [sweat, 11.7, 800, 600],
      ];
      const burst = (ps, t0, t, x0, y0) => {
        const k = t - t0;
        if (k < 0 || k > 1.3) return;
        ps.forEach((p) => {
          bctx.fillStyle = "rgba(240,224,190," + (p.a * Math.pow(1 - k / 1.3, 1.6)).toFixed(3) + ")";
          bctx.beginPath(); bctx.arc(x0 + p.vx * k, y0 + p.vy * k + 150 * k * k, p.r, 0, 6.283); bctx.fill();
        });
      };
      window.HFDrive(tl, (t) => {
        dust(t);
        bctx.clearRect(0, 0, 1920, 1080);
        ev.forEach(([ps, t0, x, y]) => burst(ps, t0, t, x, y));
      }, 0, 13);
      window.__timelines["grind"] = tl;
    })();
  </script>
</template>
