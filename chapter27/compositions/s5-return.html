  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const W = "#s5-world ";
      const fig = window.HFFig("#s5-fig");
      gsap.set("#s5-ball", { svgOrigin: "0 0" });
      const ball = "#s5-ball";

      // ── The door opens again (55.3 s). Only its light.
      tl.set("#s5-cam", { scale: 1.0, x: 0, y: 0, transformOrigin: "960px 540px" }, 0);
      tl.fromTo("#s5-dim", { backgroundColor: "rgba(0,0,0,0.66)" }, { backgroundColor: "rgba(0,0,0,0.6)", duration: 3.4, ease: "none" }, 0);
      tl.fromTo(W + ".door-light", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 0.3);
      tl.fromTo(W + ".door", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo(W + ".door-spill", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);

      // ── He walks back in, toward us.
      tl.set("#s5-fig", { x: 1590, y: 523, scaleX: -0.42, scaleY: 0.42, opacity: 0 }, 0);
      fig.setPose(tl, "stand", 0);
      tl.to("#s5-fig", { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.2);
      fig.cycle(tl, "stepA", "stepB", 1.2, 0.45, 7);
      tl.to("#s5-fig", { x: 560, y: 668, scaleX: -0.87, scaleY: 0.87, duration: 3.15, ease: "power1.out" }, 1.2);
      fig.pose(tl, "stand", 4.35, 0.5, "sine.out");

      // ── The banks slam on: 58.5, 58.9, 59.3 s.
      [[1, 3.5], [2, 3.9], [3, 4.3]].forEach(([n, at]) => {
        tl.to(W + ".bank" + n + " .bulbs-on", { opacity: 1, duration: 0.05, ease: "none" }, at);
        tl.to(W + ".bank" + n + " .glow", { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
      });
      tl.to([W + ".cone", W + ".pool"], { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.92);
      tl.to("#s5-dim", { backgroundColor: "rgba(0,0,0,0.45)", duration: 0.1, ease: "none" }, 3.5);
      tl.to("#s5-dim", { backgroundColor: "rgba(0,0,0,0.2)", duration: 0.1, ease: "none" }, 3.9);
      tl.to("#s5-dim", { backgroundColor: "rgba(0,0,0,0)", duration: 0.3, ease: "power1.out" }, 4.3);
      tl.to(W + ".door", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 4.3);
      // He turns to face the net and looks up.
      tl.to("#s5-fig", { scaleX: 0.87, duration: 0.35, ease: "power2.inOut" }, 4.5);
      tl.to(fig.parts.neck, { rotation: -14, duration: 0.6, ease: "sine.inOut" }, 4.6);

      // ── Cut in (60.3 s): run-up, jump, spike — full speed this time.
      tl.set("#s5-cam", { scale: 1.5, x: 0, y: 90, transformOrigin: "760px 430px" }, 5.3);
      tl.to("#s5-cam", { x: -150, duration: 2.6, ease: "sine.inOut" }, 5.3);
      tl.set("#s5-fig", { x: 520, y: 668, scaleX: 0.87, scaleY: 0.87 }, 5.3);
      fig.setPose(tl, "runB", 5.3);
      fig.cycle(tl, "runA", "runB", 5.3, 0.3, 5);
      tl.to("#s5-fig", { x: 720, duration: 1.5, ease: "none" }, 5.3);
      fig.pose(tl, "load", 6.8, 0.25, "power2.out");
      tl.to("#s5-fig", { x: 765, y: 700, duration: 0.25, ease: "power1.out" }, 6.8);
      fig.pose(tl, "rise", 7.05, 0.3, "power2.out");
      tl.to("#s5-fig", { x: 840, y: 470, duration: 0.32, ease: "power2.out" }, 7.05);
      fig.pose(tl, "cock", 7.35, 0.4, "sine.inOut");
      tl.to("#s5-fig", { x: 858, y: 452, duration: 0.5, ease: "sine.out" }, 7.37);
      fig.pose(tl, "contact", 7.75, 0.15, "power4.in");
      fig.pose(tl, "follow", 7.9, 0.4, "power2.out");
      tl.to("#s5-fig", { x: 900, y: 560, duration: 0.4, ease: "sine.in" }, 7.9);
      fig.pose(tl, "land", 8.3, 0.3, "power2.out");
      tl.to("#s5-fig", { x: 925, y: 698, duration: 0.3, ease: "power2.out" }, 8.3);
      fig.pose(tl, "stand", 8.9, 1.1, "sine.inOut");
      tl.to("#s5-fig", { y: 668, duration: 1.1, ease: "sine.inOut" }, 8.9);
      tl.to(fig.parts.neck, { rotation: -8, duration: 1.4, ease: "sine.inOut" }, 9.6);

      tl.set("#s5-shadow", { x: 520, y: 832, scale: 1, opacity: 0, svgOrigin: "0 0" }, 0);
      tl.set("#s5-shadow", { opacity: 0.5 }, 5.3);
      // Contact shadow on the floor: shrinks and fades while he is in the air.
      tl.to("#s5-shadow", { x: 720, duration: 1.5, ease: "none" }, 5.3);
      tl.to("#s5-shadow", { x: 765, duration: 0.25, ease: "power1.out" }, 6.8);
      tl.to("#s5-shadow", { x: 840, duration: 0.32, ease: "power2.out" }, 7.05);
      tl.to("#s5-shadow", { x: 858, duration: 0.5, ease: "sine.out" }, 7.37);
      tl.to("#s5-shadow", { x: 900, duration: 0.4, ease: "sine.in" }, 7.9);
      tl.to("#s5-shadow", { x: 925, duration: 0.3, ease: "power2.out" }, 8.3);
      tl.to("#s5-shadow", { scale: 0.5, opacity: 0.2, duration: 0.32, ease: "power2.out" }, 7.05);
      tl.to("#s5-shadow", { scale: 0.42, opacity: 0.16, duration: 0.5, ease: "sine.out" }, 7.37);
      tl.to("#s5-shadow", { scale: 0.7, opacity: 0.3, duration: 0.4, ease: "sine.in" }, 7.9);
      tl.to("#s5-shadow", { scale: 1, opacity: 0.5, duration: 0.3, ease: "power2.out" }, 8.3);
      tl.set(ball, { x: 260, y: 120, scale: 0.87, rotation: 0, opacity: 0 }, 0);
      tl.set(ball, { opacity: 1 }, 6.2);
      tl.to(ball, { x: 950, duration: 1.7, ease: "none" }, 6.2);
      tl.to(ball, { y: 215, duration: 0.9, ease: "power1.out" }, 6.2);
      tl.to(ball, { y: 280, duration: 0.8, ease: "power1.in" }, 7.1);
      tl.to(ball, { rotation: 200, duration: 1.7, ease: "none" }, 6.2);
      tl.to(ball, { x: 1780, y: 905, rotation: 1100, duration: 0.3, ease: "power1.in" }, 7.9);
      tl.to(ball, { x: 2200, y: 640, duration: 0.5, ease: "power1.out" }, 8.2);

      // Impact (62.9 s): flash + camera shake.
      tl.fromTo("#s5-flash", { opacity: 0 }, { opacity: 0.5, duration: 0.04, ease: "none" }, 7.9);
      tl.to("#s5-flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, 7.94);
      const shake = [[14, -9], [-11, 7], [8, 5], [-6, -4], [3, 2], [0, 0]];
      shake.forEach(([dx, dy], i) => {
        tl.to("#s5-cam", { x: -150 + dx, y: 90 + dy, duration: 0.07, ease: "none" }, 7.9 + i * 0.07);
      });
      tl.to("#s5-cam", { scale: 1.62, duration: 4.2, ease: "sine.inOut" }, 8.4);

      // Hand-off: the light takes the frame.
      tl.to("#s5-flash", { opacity: 1, duration: 0.65, ease: "power2.in" }, 12.3);

      const dust = window.HFDust(document.getElementById("s5-dust"), {
        seed: 5, count: 150, minR: 0.6, maxR: 2.1, drift: [3, -6], sway: 18, alpha: 0.75,
        region: { x: 300, y: 180, w: 1300, h: 830 }, light: { x: 780, y: 620, r: 560 },
      });
      const bctx = document.getElementById("s5-burst").getContext("2d");
      const R = window.HFRand(55);
      const mk = (n, sp, up, spread) => Array.from({ length: n }, () => {
        const a = -Math.PI / 2 + (R() - 0.5) * spread;
        const v = sp * (0.3 + R());
        return { vx: Math.cos(a) * v, vy: Math.sin(a) * v * up, r: 0.8 + R() * 2.6, a: 0.5 + R() * 0.5 };
      });
      const sweat = mk(30, 220, 1, Math.PI * 1.6);
      const land = mk(70, 260, 0.35, Math.PI * 1.25);
      const burst = (ps, t0, t, x0, y0, g, life, col) => {
        const k = t - t0;
        if (k < 0 || k > life) return;
        ps.forEach((p) => {
          const x = x0 + p.vx * k, y = y0 + p.vy * k + 0.5 * g * k * k;
          bctx.fillStyle = "rgba(" + col + "," + (p.a * Math.pow(1 - k / life, 1.6)).toFixed(3) + ")";
          bctx.beginPath(); bctx.arc(x, y, p.r, 0, 6.283); bctx.fill();
        });
      };
      window.HFDrive(tl, (t) => {
        dust(t, t < 3.9 ? 0.15 : 1);
        bctx.clearRect(0, 0, 1920, 1080);
        burst(sweat, 7.9, t, 930, 300, 300, 1.2, "246,232,200");
        burst(land, 8.6, t, 935, 862, 160, 2.2, "214,186,140");
      }, 0, 13);
      window.__timelines["s5"] = tl;
    })();
  </script>
