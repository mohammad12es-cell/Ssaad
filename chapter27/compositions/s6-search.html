  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cuts = [0, 2.6, 5.2, 7.8, 10.4];
      // Open on the impact light from S5, which settles into the brown ground.
      tl.fromTo("#s6-flash", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
      const vs = ["#s6-v1", "#s6-v2", "#s6-v3", "#s6-v4", "#s6-v5"];

      // Blur swap on one stage: the brown ground never cuts.
      vs.forEach((v, i) => {
        const a = cuts[i];
        tl.fromTo(v, { opacity: 0, filter: "blur(10px)", scale: 1.04 }, { opacity: 1, filter: "blur(0px)", scale: 1.0, duration: i === 0 ? 0.6 : 0.22, ease: "power3.out" }, a);
        if (i < 4) tl.to(v, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, cuts[i + 1] - 0.18);
      });
      // Words: whole line blurs in, holds still, leaves with its scene.
      ["#s6-w1", "#s6-w2", "#s6-w3", "#s6-w4"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, cuts[i] + 0.55);
      });

      // v1 — the graph dips, then climbs.
      tl.fromTo("#s6-graph", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.7, ease: "power2.inOut" }, 0.2);
      tl.fromTo("#s6-area", { opacity: 0 }, { opacity: 0.12, duration: 0.8, ease: "power1.out" }, 1.4);
      tl.fromTo("#s6-graph-dot", { scale: 0, svgOrigin: "1640 300" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.85);

      // v2 — the building draws, windows light one by one.
      tl.fromTo("#s6-bld", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 2.75);
      tl.fromTo("#s6-windows rect", { opacity: 0 }, { opacity: 0.85, duration: 0.12, ease: "none", stagger: 0.07 }, 3.6);

      // v3 — the network fires, then becomes a frame with his face inside.
      tl.fromTo("#s6-edges path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 5.3);
      tl.fromTo("#s6-nodes circle", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.05 }, 5.3);
      tl.to(["#s6-edges", "#s6-nodes"], { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 6.35);
      tl.fromTo("#s6-film", { opacity: 0, scale: 0.85, svgOrigin: "1110 540" }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 6.5);
      tl.fromTo("#s6-film-win", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.75);

      // v4 — the globe turns, the route draws, the plane flies it.
      tl.fromTo("#s6-mer1", { attr: { rx: 210 } }, { attr: { rx: 40 }, duration: 2.6, ease: "none" }, 7.8);
      tl.fromTo("#s6-mer2", { attr: { rx: 120 } }, { attr: { rx: 230 }, duration: 2.6, ease: "none" }, 7.8);
      tl.fromTo("#s6-route", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.0);
      const route = document.getElementById("s6-route");
      const L = route.getTotalLength();
      const pts = [];
      for (let i = 0; i <= 120; i++) { const p = route.getPointAtLength((L * i) / 120); pts.push([p.x, p.y]); }
      const plane = document.getElementById("s6-plane");
      const fly = { u: 0 };
      const placePlane = () => {
        const i = Math.min(119, Math.floor(fly.u * 120));
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        const f = fly.u * 120 - i;
        const ang = (Math.atan2(y1 - y0, x1 - x0) * 180) / Math.PI;
        plane.setAttribute("transform", "translate(" + (x0 + (x1 - x0) * f) + " " + (y0 + (y1 - y0) * f) + ") rotate(" + ang + ")");
      };
      tl.fromTo(fly, { u: 0 }, { u: 1, duration: 2.0, ease: "power1.inOut", onUpdate: placePlane }, 8.1);
      placePlane();
