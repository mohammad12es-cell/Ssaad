  <filter id="__P__-rim" x="-30%" y="-30%" width="160%" height="160%">
    <feOffset in="SourceAlpha" dx="3" dy="4" result="off"/>
    <feComposite in="SourceAlpha" in2="off" operator="out" result="edge"/>
    <feGaussianBlur in="edge" stdDeviation="1.1" result="edgeb"/>
    <feFlood flood-color="#f1dcaa" flood-opacity=".95"/>
    <feComposite in2="edgeb" operator="in" result="rim"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rim"/></feMerge>
  </filter>
</defs>
