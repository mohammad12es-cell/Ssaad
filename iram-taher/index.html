<script>
const $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
const P = window.__P, E = P.ev, FPS = 30;
// captions: one line element per caption line, one span per word
const cap = $("#cap");
P.lines.forEach((L, li) => {
  const d = document.createElement("div"); d.className = "line"; d.id = "ln" + li;
  P.words.slice(L.a, L.b).forEach((w, k) => {
    const s = document.createElement("span"); s.className = "w"; s.dataset.i = L.a + k;
    s.innerHTML = "<i></i><span>" + w.w + "</span>"; d.appendChild(s); d.appendChild(document.createTextNode(" "));
  });
  cap.appendChild(d);
});

const tl = gsap.timeline({ paused: true });
let seed = 4321; const rs = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1;
function shake(t, amp = 10, dur = 0.25) {
  const n = Math.round(dur * FPS);
  for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.set("#cam", { x: rs() * amp * k, y: rs() * amp * k }, t + i / FPS); }
  tl.set("#cam", { x: 0, y: 0 }, t + dur);
}
function cardIn(sel, t) {
  tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
  tl.fromTo(sel, { y: 80, scale: 0.92 }, { y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t);
}
function cardOut(sel, t) { tl.to(sel, { opacity: 0, y: 40, duration: 0.25, ease: "power2.in" }, t); }

// ---- captions (karaoke: spoken words light up, the current word sits on a gold pill)
P.lines.forEach((L, li) => {
  const el = "#ln" + li, end = li + 1 < P.lines.length ? P.lines[li + 1].t0 : E.speech_end + 0.25;
  tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, L.t0);
  tl.to(el, { opacity: 0, duration: 0.06, ease: "none" }, end - 0.07);          // gone before the next line starts
  for (let k = L.a; k < L.b; k++) {
    const w = `${el} .w[data-i="${k}"]`, t = P.words[k].t, nt = k + 1 < L.b ? P.words[k + 1].t : end;
    tl.set(`${w}`, { color: "#faf2e0" }, t);
    tl.fromTo(`${w} i`, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)" }, t);
    tl.set(`${w} span`, { color: "#06140d", textShadow: "none" }, t);
    tl.to(`${w} i`, { opacity: 0, duration: 0.08 }, nt - 0.02);
    tl.set(`${w} span`, { color: "#faf2e0", textShadow: "0 4px 18px rgba(6,20,13,.95)" }, nt);
  }
});

// ---- camera: slow push-ins, punches on key words, settle at the location change
tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.04, duration: E.black, ease: "none" }, 0);
tl.to("#cam", { scale: 1.11, duration: 0.25, ease: "power3.out" }, E.black);
tl.to("#cam", { scale: 1.05, duration: 1.4, ease: "power2.inOut" }, E.friday + 1.0);
tl.to("#cam", { scale: 1.09, duration: 12.4 - E.think, ease: "none" }, E.think);
tl.fromTo("#cam", { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "expo.out", immediateRender: false }, 13.9);
tl.to("#cam", { scale: 1.05, duration: E.tour - 14.45, ease: "none" }, 14.45);
tl.to("#cam", { scale: 1.11, duration: 0.22, ease: "power3.out" }, E.tour);
tl.to("#cam", { scale: 1.04, duration: 1.6, ease: "power2.inOut" }, E.comment);
shake(E.black, 12, 0.3); shake(E.full, 9, 0.25); shake(E.tour, 7, 0.2);

// ---- brand: stacked logo top-right (house style) for the talking part
tl.fromTo("#brand", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
tl.to("#brand", { opacity: 0, duration: 0.3 }, E.end_card - 0.2);

// ---- G1: Armenia
tl.fromTo("#route", { opacity: 0 }, { opacity: 1, duration: 0.25 }, E.armenia - 0.9);
const arc = $("#arc"), AL = arc.getTotalLength();
tl.fromTo({ p: 0 }, { p: 0 }, { p: 1, duration: 0.9, ease: "power2.inOut", immediateRender: false,
  onUpdate() { const p = this.targets()[0].p, pt = arc.getPointAtLength(p * AL), q = arc.getPointAtLength(Math.min(AL, p * AL + 2));
    const ang = Math.atan2(q.y - pt.y, q.x - pt.x) * 180 / Math.PI; $("#planeA").setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${ang})`); } }, E.armenia - 0.9);
tl.fromTo("#dest", { attr: { r: 6 } }, { attr: { r: 16 }, duration: 0.35, ease: "back.out(3)" }, E.armenia);
tl.fromTo("#armTitle", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, E.armenia);
tl.to(["#route", "#armTitle"], { opacity: 0, duration: 0.25 }, E.black - 0.3);

// ---- G2: Black Friday tag drops in and swings
tl.set("#tagWrap", { opacity: 1 }, E.black - 0.02);
tl.fromTo("#tagWrap", { y: -520 }, { y: 0, duration: 0.35, ease: "power3.in" }, E.black - 0.35);
tl.fromTo("#tagWrap", { rotation: 0 }, { keyframes: [{ rotation: -6, duration: 0.18 }, { rotation: 4.5, duration: 0.3 }, { rotation: -2.8, duration: 0.32 }, { rotation: 1.6, duration: 0.34 }, { rotation: -0.8, duration: 0.4 }, { rotation: 0, duration: 0.5 }], ease: "sine.inOut", immediateRender: false }, E.black);
tl.to("#tagWrap", { y: -520, opacity: 0, duration: 0.35, ease: "power3.in" }, E.capacity - 0.5);

// ---- G3: hotel capacity fills up
cardIn("#meter", E.capacity - 0.15);
tl.fromTo("#meter .fill", { scaleX: 0.35 }, { scaleX: 1, duration: E.full - E.capacity, ease: "power1.in" }, E.capacity);
tl.to("#meter .red", { opacity: 1, duration: 0.15 }, E.full - 0.05);
tl.fromTo("#stamp", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, E.full - 0.2);
cardOut("#meter", E.think - 0.2);

// ---- G4: book early, then the check
cardIn("#book", E.think + 0.05);
cardOut("#book", 12.3);

// ---- the location change: a golden light sweep
// the source crossfades between its two locations at ~12.8-13.4 s: the flash and the sweep cover the double image
const I0 = 12.42, I1 = 13.9;   // interstitial in / out; the source crossfades 12.55-13.95
tl.fromTo("#inter", { clipPath: "circle(0px at 540px 1380px)" }, { clipPath: "circle(1700px at 540px 1380px)", duration: 0.32, ease: "power3.in" }, I0 - 0.04);
tl.fromTo("#keycard", { y: 0, rotation: 8 }, { y: -880, rotation: -4, duration: 0.42, ease: "back.out(1.4)" }, I0 + 0.25);
tl.to("#keycard", { y: -900, rotation: 0, duration: 0.12, ease: "power2.in" }, I0 + 0.72);
tl.to("#led", { backgroundColor: "#3fbf7f", boxShadow: "0 0 40px #3fbf7f, inset 0 0 0 5px #1d5c3c", duration: 0.1 }, I0 + 0.84);
tl.fromTo("#booked", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, I0 + 0.86);
tl.set("#sweep", { opacity: 1 }, I1 - 0.32);
tl.fromTo("#sweep", { x: 0 }, { x: 2400, duration: 0.6, ease: "power2.inOut" }, I1 - 0.32);
tl.set("#sweep", { opacity: 0 }, I1 + 0.3);
tl.to("#inter", { y: -1920, duration: 0.32, ease: "power3.in" }, I1 - 0.02);   // slides up and away with the light sweep
tl.fromTo("#flash", { opacity: 0 }, { keyframes: [{ opacity: 0.45, duration: 0.08 }, { opacity: 0, duration: 0.3 }], immediateRender: false }, I1 - 0.06);

// ---- G5: now, before it is too late
tl.fromTo("#clock", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 14.0);
tl.fromTo("#hMin", { rotation: 0 }, { rotation: 720, duration: E.comment_word - E.now, ease: "power1.in" }, E.now);
tl.fromTo("#hHr", { rotation: 0 }, { rotation: 60, duration: E.comment_word - E.now, ease: "power1.in" }, E.now);
tl.fromTo("#nowTitle", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(2)" }, E.now2);
tl.to(["#clock", "#nowTitle"], { opacity: 0, duration: 0.25 }, E.comment_word - 0.3);

// ---- G6: comment «تور», then the trip info flies to the DMs
cardIn("#cmt", E.comment_word - 0.2);
tl.set("#ph", { opacity: 0 }, E.tour);
tl.fromTo("#typed", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.3, ease: "steps(3)" }, E.tour);
tl.set("#caret", { opacity: 1 }, E.tour);
for (let t = E.tour + 0.5; t < E.info; t += 0.5) tl.set("#caret", { opacity: Math.round((t - E.tour) / 0.5) % 2 ? 0 : 1 }, t);
tl.fromTo("#cmt .send", { scale: 1 }, { keyframes: [{ scale: 1.3, duration: 0.12 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }], immediateRender: false }, E.comment);
tl.fromTo("#dm", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(2)" }, E.info);
tl.set("#plane", { opacity: 1 }, E.send - 0.15);
tl.fromTo("#plane", { x: 0, y: 0, rotation: 0, scale: 1 }, { x: 760, y: -830, rotation: -12, scale: 0.6, duration: 0.55, ease: "power2.in" }, E.send - 0.15);
tl.set("#plane", { opacity: 0 }, E.send + 0.4);
tl.fromTo("#dm", { scale: 1 }, { keyframes: [{ scale: 1.15, duration: 0.12 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }], immediateRender: false }, E.send + 0.38);
tl.to(["#cmt", "#dm"], { opacity: 0, duration: 0.25 }, E.end_card - 0.15);

// ---- end card: cream fog wipes up, logo, IRAMCO.ORG, the keyword again
tl.fromTo("#end", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.55, ease: "power3.inOut" }, E.end_card);
tl.fromTo("#endLogo", { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, E.end_card + 0.35);
tl.fromTo("#endUrl", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, E.end_card + 0.6);
tl.fromTo("#endCta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, E.end_card + 0.85);
tl.fromTo("#endLogo", { scale: 1 }, { scale: 1.03, duration: E.total - E.end_card - 1.0, ease: "none", immediateRender: false }, E.end_card + 0.95);

tl.set({}, {}, E.total);
// zoom bump on each take join cut by tools/fix_dissolves.py (source frames 185, 245, 276, 503 at 29.97 fps)
const CUTS = [185, 245, 276, 503].map(f => f * 1001 / 30000 - 0.017);
CUTS.forEach(t => tl.fromTo("#punch", { scale: 1.06 }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, t));
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
