   <path d="M760,640 Q620,740 690,880 Q740,960 840,900 Q760,860 790,800 Q860,720 960,800" fill="none" ${st('#e8eadf',14)}/>
   ${[[700,620,14],[650,700,10],[620,800,8],[740,560,12],[820,540,9],[600,900,7],[880,500,7]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#e8eadf"/>`).join('')}

  </g>
  <text x="60" y="1380" font-family="${MONO}" font-size="30" fill="#efe3c8">WEST LANDING</text>
  <text x="60" y="1420" font-family="${MONO}" font-size="22" fill="#d8cdb6">Illustration · reconstruction</text>`,
};
const k = new URLSearchParams(location.search).get('s') || 'dark';
document.getElementById('s').innerHTML = defs() + SCENES[k]() + texture(W, H);
</script></body></html>
