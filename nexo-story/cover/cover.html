      @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("../assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+2026, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Cinzel"; font-weight: 700; src: url("../assets/fonts/cinzel-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cinzel"; font-weight: 900; src: url("../assets/fonts/cinzel-latin-900-normal.woff2") format("woff2"); }
      /* ===== NEXO poster palette ===== */
      :root {
        --navy-hi: #1b2e4a; --navy: #0f1c30; --navy-lo: #050b16; --ink: #fbf3e2; --muted: #b7c0cf;
        --maroon-hi: #a31c1c; --maroon: #750b0b; --maroon-lo: #4a0606;
        --gold: linear-gradient(180deg, #fff7dc 0%, #f6dc98 28%, #d9ab55 56%, #f3d589 74%, #a8772d 100%);
        --gold-dark: #5c3f12; --silver: linear-gradient(180deg, #ffffff 0%, #dfe3e9 30%, #8e959f 58%, #e9ecf0 78%, #7c838d 100%);
        --font: "Vazirmatn", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-lo); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--navy-lo); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .scene-in { position: absolute; inset: 0; }
      .cx { position: absolute; left: 0; right: 0; margin: 0 auto; }

      /* background */
      #bgGlow { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 34%, var(--navy-hi) 0%, var(--navy) 45%, var(--navy-lo) 100%); }
      #dawn { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 90% 40% at 50% 62%, rgba(246, 196, 112, 0.55) 0%, rgba(200, 120, 70, 0.25) 35%, transparent 70%); }
      #rays { position: absolute; left: -400px; top: -620px; width: 1880px; height: 1880px; opacity: 0.2;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(170, 195, 230, 0.16) 0deg 4deg, transparent 4deg 15deg);
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%); mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%); }
      #mosque { position: absolute; left: -40px; top: 640px; width: 1160px; height: 760px; opacity: 0.32; }
      #fog { position: absolute; left: 0; right: 0; top: 1130px; height: 790px; background: linear-gradient(180deg, transparent, var(--navy-lo) 45%); }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 100% 75% at 50% 45%, transparent 60%, rgba(2, 6, 14, 0.7) 100%); }

      /* metallic gold title: extrusion layer + gradient text */
      .ttl { position: absolute; top: 236px; left: 40px; right: 40px; height: 150px; isolation: isolate; filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.6)); }
      .ttl .x, .ttl .g { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-weight: 900; font-size: 104px; line-height: 1.3; white-space: nowrap; }
      .ttl .x { top: 7px; color: var(--gold-dark); -webkit-text-stroke: 3px var(--gold-dark); }
      .ttl .g { color: transparent; background: var(--gold); -webkit-background-clip: text; background-clip: text; }
      .ttl.sm .x, .ttl.sm .g { font-size: 84px; }
      .sub { position: absolute; top: 380px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 50px; color: var(--ink); text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7); }

      /* pills */
      .pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; display: flex; align-items: center; gap: 20px; white-space: nowrap; border-radius: 999px; font-weight: 900; }
      .glass { padding: 14px 36px 18px 28px; font-size: 48px; color: var(--ink);
        background: linear-gradient(180deg, rgba(23, 38, 62, 0.94), rgba(7, 13, 25, 0.94)) padding-box, var(--silver) border-box; border: 3px solid transparent; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); }
      .maroon { padding: 14px 40px 18px 30px; font-size: 56px; color: #fff6ea;
        background: linear-gradient(180deg, var(--maroon-hi), var(--maroon) 55%, var(--maroon-lo)) padding-box, var(--gold) border-box; border: 5px solid transparent; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55); }
      .pill svg.ic { width: 60px; height: 60px; flex: none; }
      .flagC { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 3px solid #e9edf2; flex: none; }
      .flagC svg { width: 100%; height: 100%; display: block; }

      /* hook: the family photo */
      #frame { position: absolute; left: 230px; top: 470px; width: 620px; height: 640px; border-radius: 30px; padding: 16px; background: var(--gold); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65); }
      #frame .in { position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 35%, #26405f 0%, #142640 55%, #0a1426 100%); }
      #frame .spot { position: absolute; left: 50%; top: -40px; width: 520px; height: 640px; margin-left: -260px; background: radial-gradient(ellipse 50% 60% at 50% 30%, rgba(255, 230, 170, 0.28), transparent 70%); }
      #fam1 { position: absolute; left: 40px; right: 40px; bottom: 26px; height: 470px; }
      #qmark { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font-weight: 900; font-size: 200px; line-height: 1; color: transparent; background: var(--gold); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 30px rgba(246, 214, 140, 0.6)); }

      /* doubt: Ahmad alone, tangled lines, question chips */
      #ahmad { position: absolute; left: 0; right: 0; margin: 0 auto; top: 560px; width: 250px; height: 640px; }
      #tangle { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .chip { position: absolute; display: flex; align-items: center; gap: 16px; white-space: nowrap; padding: 12px 30px 16px 22px; border-radius: 999px; font-weight: 900; font-size: 50px;
        background: linear-gradient(180deg, rgba(23, 38, 62, 0.95), rgba(7, 13, 25, 0.95)) padding-box, var(--silver) border-box; border: 3px solid transparent; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55); }
      .chip svg { width: 58px; height: 58px; flex: none; }

      /* reveal + path: the NEXO folder and what comes out of it */
      #folder { position: absolute; left: 0; right: 0; margin: 0 auto; top: 760px; width: 600px; height: 380px; }
      #folder .back { position: absolute; inset: 0; border-radius: 26px; background: linear-gradient(180deg, #1d3354, #0d1a2e); border: 4px solid #c9a052; }
      #folder .tab { position: absolute; top: -40px; right: 40px; width: 220px; height: 64px; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #24406a, #1d3354); border: 4px solid #c9a052; border-bottom: none; }
      #folder .front { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; border-radius: 22px; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #213b62, #0f1e35) padding-box, var(--gold) border-box; border: 5px solid transparent; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35); }
      #folder .front svg { width: 96px; height: 102px; }
      #folder .front .nx { font-family: "Cinzel", serif; font-weight: 900; font-size: 64px; letter-spacing: 5px; line-height: 1.05; direction: ltr; color: transparent; background: var(--silver); -webkit-background-clip: text; background-clip: text; }
      #folder .front .lb { font-weight: 800; font-size: 34px; color: #e9d29a; margin-top: 4px; }
      #folder .items { position: absolute; left: 0; right: 0; bottom: 120px; height: 760px; z-index: 2; }
      #goldRoute { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .doc { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: 0; width: 360px; height: 360px; border-radius: 14px; background: linear-gradient(180deg, #fbf4e4, #efe3c8); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); }
      .doc .ln { position: absolute; right: 44px; height: 14px; border-radius: 7px; background: #c9b896; }
      .doc .hd { position: absolute; top: 28px; left: 0; right: 0; text-align: center; font-family: "Cinzel", serif; font-weight: 900; font-size: 40px; letter-spacing: 3px; color: #7a5a22; direction: ltr; }
      #stamp { position: absolute; left: 34px; top: 150px; width: 186px; height: 186px; }
      #docTick { position: absolute; right: 34px; top: 196px; width: 84px; height: 84px; }
      #bldg { position: absolute; left: 0; right: 0; margin: 0 auto; bottom: 0; width: 375px; height: 500px; }
      .rcard { position: absolute; width: 400px; height: 252px; border-radius: 22px; padding: 18px 22px; overflow: hidden;
        background: linear-gradient(160deg, #243f66, #0f1d33 70%) padding-box, var(--gold) border-box; border: 4px solid transparent; box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6); }
      .rcard .t1 { font-family: "Cinzel", serif; font-weight: 900; font-size: 20px; letter-spacing: 1px; color: #f1d38a; direction: ltr; text-align: left; }
      .rcard .t2 { font-weight: 800; font-size: 25px; color: #e7e9ee; text-align: left; direction: rtl; position: absolute; left: 22px; top: 50px; }
      .rcard .ph { position: absolute; right: 22px; top: 22px; width: 132px; height: 170px; border-radius: 12px; background: linear-gradient(180deg, #e9dcc0, #cdb98f); overflow: hidden; }
      .rcard .ph svg { position: absolute; left: 0; right: 0; bottom: -6px; margin: 0 auto; height: 160px; }
      .rcard .ln { position: absolute; left: 22px; height: 12px; border-radius: 6px; background: rgba(233, 237, 242, 0.35); }
      .rcard .chipc { position: absolute; left: 22px; bottom: 22px; width: 58px; height: 44px; border-radius: 8px; background: var(--gold); }
      .rcard .fl { position: absolute; left: 96px; bottom: 26px; width: 54px; height: 36px; border-radius: 5px; overflow: hidden; }
      #freeStamp { position: absolute; left: 0; right: 0; margin: 0 auto; top: 790px; width: 560px; height: 170px; display: flex; align-items: center; justify-content: center; border-radius: 26px;
        font-weight: 900; font-size: 112px; color: #fff3e2; background: linear-gradient(180deg, var(--maroon-hi), var(--maroon) 55%, var(--maroon-lo)) padding-box, var(--gold) border-box; border: 7px solid transparent;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.2); }
      .spark { position: absolute; width: 34px; height: 34px; }

      /* care */
      #elders { position: absolute; left: 0; right: 0; margin: 0 auto; top: 540px; width: 520px; height: 560px; border-radius: 30px; padding: 14px; background: var(--gold); box-shadow: 0 26px 60px rgba(0, 0, 0, 0.6); }
      #elders .in { position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 35%, #26405f 0%, #142640 55%, #0a1426 100%); }
      #mag { position: absolute; left: 600px; top: 620px; width: 260px; height: 260px; }
      #route { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #clip { position: absolute; left: 0; right: 0; margin: 0 auto; top: 520px; width: 470px; height: 600px; }
      .clbl { top: 418px; }

      /* life */
      #fam2 { position: absolute; left: 0; right: 0; margin: 0 auto; top: 600px; width: 720px; height: 553px; }

      /* end card */
      #logo { position: absolute; top: 560px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
      #logo svg { width: 170px; height: 180px; }
      #logo .nexo { font-family: "Cinzel", serif; font-weight: 900; font-size: 120px; line-height: 1; letter-spacing: 8px; direction: ltr; color: transparent; background: var(--silver); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #3a414c) drop-shadow(0 12px 20px rgba(0, 0, 0, 0.55)); }
      #disc { position: absolute; top: 1056px; left: 70px; right: 70px; display: flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 34px; font-weight: 700; font-size: 26px; line-height: 1.45; color: var(--muted);
        background: rgba(5, 10, 20, 0.78); border: 2px solid rgba(220, 226, 235, 0.32); }
      #disc svg { width: 42px; height: 42px; flex: none; }

      /* captions: karaoke */
      .cap { display: flex; align-items: flex-start; justify-content: center; }
      .cap-in { margin-top: 1196px; max-width: 1000px; text-align: center; font-weight: 900; font-size: 54px; line-height: 1.45; }
      .cap .w { position: relative; isolation: isolate; display: inline-block; padding: 0 10px 4px; color: rgba(251, 243, 226, 0.4); text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9); }
      .cap .w i { position: absolute; inset: 4px 0 2px; border-radius: 16px; background: var(--gold); opacity: 0; z-index: -1; }
      .cap .w span { position: relative; }
    
      #rays { transform: rotate(9deg); opacity: 0.26; }
      #mosque { top: 760px; opacity: 0.42; }
      #logo { top: 292px; }
      #logo svg { width: 118px; height: 125px; }
      #logo .nexo { font-size: 86px; letter-spacing: 6px; }
      .ttl { height: 160px; }
      .ttl .x, .ttl .g { font-size: 112px; line-height: 1.25; }
      #frame { left: 250px; top: 846px; width: 580px; height: 520px; padding: 15px; }
      #fam1 { left: 36px; right: 36px; bottom: 22px; height: 400px; }
      #qm { position: absolute; right: 96px; top: 40px; font-weight: 900; font-size: 150px; line-height: 1; color: transparent; background: var(--gold); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 24px rgba(246, 214, 140, 0.55)); }
      #sticker { position: absolute; left: 34px; top: 1282px; width: 470px; padding: 16px 22px 20px; border-radius: 32px; transform: rotate(-7deg); text-align: center;
        background: linear-gradient(180deg, var(--maroon-hi), var(--maroon) 55%, var(--maroon-lo)) padding-box, var(--gold) border-box; border: 5px solid transparent;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.2); }
      #sticker .big { display: block; white-space: nowrap; font-weight: 900; font-size: 64px; line-height: 1.15; color: transparent; background: var(--gold); -webkit-background-clip: text; background-clip: text; }
      #sticker .small { display: block; white-space: nowrap; font-weight: 800; font-size: 32px; line-height: 1.4; color: #fff3e4; }
      #badge { top: 1468px; font-size: 44px; }
      .flagR { width: 84px; height: 56px; border-radius: 9px; overflow: hidden; border: 2px solid #f1d58f; flex: none; }
      .flagR svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>

      <div class="ttl" style="top: 540px"><span class="x" aria-hidden="true">آینده‌ی بچه‌هایم</span><span class="g">آینده‌ی بچه‌هایم</span></div>
