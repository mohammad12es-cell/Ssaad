<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:500;src:url(/engine/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:600;src:url(/engine/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:800;src:url(/engine/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(/engine/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(/engine/fonts/vazirmatn-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200F,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(/engine/fonts/vazirmatn-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(/engine/fonts/vazirmatn-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200F,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(/engine/fonts/vazirmatn-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(/engine/fonts/vazirmatn-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200F,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(/engine/fonts/vazirmatn-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:absolute;inset:0;color:#fff;font-family:Montserrat,sans-serif}
.el{position:absolute;left:0;right:0;text-align:center;opacity:0;will-change:opacity,transform,filter}
.glowc{text-shadow:0 0 18px rgba(60,200,255,.55),0 0 46px rgba(60,160,255,.35),0 2px 6px rgba(0,0,0,.6)}
.glowa{text-shadow:0 0 18px rgba(255,170,90,.55),0 0 46px rgba(255,140,60,.3),0 2px 6px rgba(0,0,0,.6)}
#bug{top:128px;font-weight:600;font-size:24px;letter-spacing:.42em;color:rgba(220,236,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.8)}
#bug b{font-weight:800;color:rgba(255,255,255,.8)}
.tag{top:176px;font-weight:600;font-size:22px;letter-spacing:.18em;color:rgba(185,222,255,.78);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.8)}
#hook{top:300px;font-weight:800;font-size:74px;line-height:1.12;letter-spacing:.02em;padding:0 60px}
#hook span{display:inline-block}
.label{top:300px;font-weight:800;font-size:96px;letter-spacing:.14em}
.label small{display:block;font-weight:500;font-size:28px;letter-spacing:.32em;margin-top:14px;opacity:.75;text-transform:uppercase}
#ttag{top:1346px;font-weight:600;font-size:19px;letter-spacing:.2em;color:rgba(185,222,255,.62);text-shadow:0 1px 3px rgba(0,0,0,.9)}
#sub{top:1436px;padding:0 80px;font-family:Inter,sans-serif;font-weight:600;font-size:46px;line-height:1.32;
  text-shadow:0 2px 3px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.85),0 0 36px rgba(0,0,0,.6)}
#end{top:770px}
#end .w1{font-weight:800;font-size:104px;letter-spacing:.16em;line-height:1.02}
#end .rule{width:420px;height:3px;margin:34px auto 34px;background:linear-gradient(90deg,rgba(60,200,255,0),#3cc8ff 30%,#ffa24a 70%,rgba(255,162,74,0))}
#end .q{font-weight:600;font-size:44px;letter-spacing:.06em;line-height:1.25;color:#e8f4ff}
/* Persian */
.fa #hook,.fa #sub,.fa #end .q,.fa .label small,.fa .tag,.fa #ttag{font-family:Vazirmatn,sans-serif;direction:rtl;letter-spacing:0}
.fa #hook{font-weight:800;font-size:80px;line-height:1.35}
.fa #sub{font-weight:700;font-size:50px;line-height:1.5}
.fa #end .q{font-weight:800;font-size:54px;line-height:1.45}
.fa .label{font-family:Vazirmatn,Montserrat,sans-serif;direction:rtl;letter-spacing:0;font-size:100px}
.fa .label small{font-size:32px;font-weight:500}
.fa .tag{font-size:27px;font-weight:700}
.fa #ttag{font-size:22px;font-weight:700}
</style></head>
<body>
<div id="root">
  <div id="bug" class="el"><b>ODDLY</b> EXPLAINED</div>
  <div id="tagViz" class="el tag"></div>
  <div id="tagDream" class="el tag"></div>
  <div id="tagMem" class="el tag"></div>
  <div id="hook" class="el glowc"></div>
  <div id="nrem" class="el label glowc"></div>
  <div id="rem" class="el label glowa"></div>
  <div id="ttag" class="el"></div>
  <div id="sub" class="el"></div>
  <div id="end" class="el"><div class="w1">ODDLY<br>EXPLAINED</div><div class="rule"></div><div class="q"></div></div>
</div>
<script type="module">
const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'en';
const cfg = await (await fetch('./config.json')).json();
const tim = await (await fetch(q.get('timings') || '/build/001/audio/timings.json')).json();
const T = cfg.titles[lang]; const FPS = cfg.fps;
const root = document.getElementById('root'); if (lang === 'fa') root.classList.add('fa');
const $ = (id) => document.getElementById(id);
$('tagViz').textContent = T.tag_viz; $('tagDream').textContent = T.tag_dream; $('tagMem').textContent = T.tag_memory; $('ttag').textContent = T.tag_trace;
// hook: split into words for a staggered reveal (Persian keeps natural shaping because words stay intact)
$('hook').innerHTML = T.hook.split('<br>').map((line) => line.split(' ').map((w) => `<span>${w}</span>`).join(' ')).join('<br>');
const hookWords = [...$('hook').querySelectorAll('span')];
$('nrem').innerHTML = `${T.nrem}<small>${T.nrem_sub}</small>`;
$('rem').innerHTML = `${T.rem}<small>${T.rem_sub}</small>`;
$('end').querySelector('.q').innerHTML = T.end_q;
// subtitle cues: each chunk shown from its start until the next chunk (or line end + hang)
const cues = [];
tim.lines.forEach((ln, li) => {
  const next = tim.lines[li + 1];
  ln.chunks.forEach((c, ci) => {
    const last = ci === ln.chunks.length - 1;
    const end = last ? Math.min(ln.end + 0.35, next ? next.start - 0.1 : 29.0) : ln.chunks[ci + 1].start - 0.06;
    cues.push({ start: c.start - 0.06, end, text: c[lang] });
  });
});
await document.fonts.ready;
for (const f of ['800 74px Montserrat', '600 46px Inter', '700 50px Vazirmatn', '800 80px Vazirmatn', '500 20px Montserrat']) await document.fonts.load(f, 'آب abc');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const win = (t, a, b, fi = 0.4, fo = 0.4) => sm(a, a + fi, t) * (1 - sm(b - fo, b, t));
function set(el, o, extra = '') { el.style.opacity = o.toFixed(3); el.style.transform = extra; }

function render(t) {
  set($('bug'), 0.9 * win(t, 0.3, 27.9, 0.6, 0.5));
  set($('tagViz'), win(t, 4.6, 14.8, 0.5, 0.4) + win(t, 26.5, 27.9, 0.5, 0.4));
  set($('tagDream'), win(t, 15.3, 20.9, 0.5, 0.4));
  set($('tagMem'), win(t, 21.5, 25.7, 0.5, 0.4));
  // hook title
  const hookOut = 1 - sm(3.45, 3.85, t);
  hookWords.forEach((w, i) => {
    const a = sm(0.35 + i * 0.13, 0.75 + i * 0.13, t) * hookOut;
    w.style.opacity = a.toFixed(3); w.style.filter = `blur(${((1 - sm(0.35 + i * 0.13, 0.8 + i * 0.13, t)) * 10).toFixed(2)}px)`;
    w.style.transform = `translateY(${((1 - sm(0.35 + i * 0.13, 0.85 + i * 0.13, t)) * 18).toFixed(1)}px)`;
  });
  set($('hook'), 1, `scale(${(1 + 0.04 * sm(0.4, 3.8, t) + 0.12 * sm(3.45, 3.85, t)).toFixed(4)})`);
  // stage labels
  const ln = win(t, 9.3, 14.75, 0.5, 0.4); set($('nrem'), ln, `translateY(${(1 - sm(9.3, 9.9, t)) * 20}px)`); $('nrem').style.letterSpacing = lang === 'fa' ? '0' : `${(0.22 - 0.08 * sm(9.3, 10.4, t)).toFixed(3)}em`;
  const lr = win(t, 15.2, 20.85, 0.5, 0.4); set($('rem'), lr, `translateY(${(1 - sm(15.2, 15.8, t)) * 20}px)`); $('rem').style.letterSpacing = lang === 'fa' ? '0' : `${(0.22 - 0.08 * sm(15.2, 16.3, t)).toFixed(3)}em`;
  set($('ttag'), win(t, 9.8, 20.9, 0.5, 0.5));
  // subtitles
  const c = cues.find((c) => t >= c.start && t < c.end);
  const s = $('sub');
  if (c) { if (s.dataset.k !== c.text) { s.textContent = c.text; s.dataset.k = c.text; } set(s, sm(c.start, c.start + 0.1, t) * (1 - sm(c.end - 0.06, c.end, t))); }
  else set(s, 0);
  // end card
  const e = sm(28.3, 28.9, t); const eq = sm(28.75, 29.3, t);
  set($('end'), e, `scale(${(1.06 - 0.06 * sm(28.3, 29.6, t)).toFixed(4)})`);
  $('end').querySelector('.w1').style.filter = `blur(${((1 - e) * 12).toFixed(2)}px)`;
  $('end').querySelector('.q').style.opacity = eq.toFixed(3);
  $('end').querySelector('.rule').style.transform = `scaleX(${sm(28.5, 29.2, t).toFixed(3)})`;
}
window.OE = { frames: Math.round(cfg.duration * FPS), async renderFrame(i) { render(i / FPS); return true; } };
render(0); window.__ready = true;
</script>
</body></html>
