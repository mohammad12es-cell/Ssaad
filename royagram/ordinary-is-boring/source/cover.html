<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ROYAGRAM Cover</title>
<style>
  @font-face { font-family: "Cormorant"; font-weight: 600; src: url("fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "InterF"; font-weight: 500; src: url("fonts/inter-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "InterF"; font-weight: 600; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050302; }
  #bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,3,2,0.82) 0%, rgba(5,3,2,0.0) 30%, rgba(5,3,2,0.0) 64%, rgba(5,3,2,0.85) 100%); }
  .t { position: absolute; left: 0; right: 0; text-align: center; }
  #kicker { top: 300px; font-family: "InterF"; font-weight: 600; font-size: 30px; letter-spacing: 0.5em; padding-left: 0.5em; color: #E3A548; }
  #title { top: 352px; font-family: "Cormorant"; font-weight: 600; font-size: 104px; line-height: 1.0; letter-spacing: 0.04em; color: #F3E6CC; text-shadow: 0 4px 40px rgba(0,0,0,0.6); }
  #logo { top: 1452px; font-family: "Cormorant"; font-weight: 600; font-size: 84px; letter-spacing: 0.2em; padding-left: 0.2em;
          background: linear-gradient(100deg, #8a5a1c 0%, #e8b45c 35%, #fff1cf 50%, #e8b45c 65%, #a8692a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { top: 1566px; font-family: "InterF"; font-weight: 500; font-size: 24px; letter-spacing: 0.42em; padding-left: 0.42em; color: #F3E6CC; }
  .rule { position: absolute; left: 50%; width: 120px; height: 2px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, #E3A548, transparent); }
</style>
</head>
<body>
  <img id="bg" src="cover_bg.png" alt="">
  <div id="shade"></div>
  <div class="t" id="kicker">ROYAGRAM PRESENTS</div>
  <div class="t" id="title">Ordinary<br>is boring.</div>
  <div class="rule" style="top:1420px"></div>
  <div class="t" id="logo">ROYAGRAM</div>
  <div class="t" id="tag">SMALL THINGS. BIG WORLDS.</div>
</body>
</html>
