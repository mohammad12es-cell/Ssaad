<!doctype html>
<!-- @shahcutt reel engine. Edit script.json (segments + beats), then run `python3 build.py VOICE.wav WHISPER.json` to regenerate index.html. -->
<html lang="fa" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
      @font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
      @font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }

      /* @shahcutt look: near-black cinematic ground, one hot accent (red glow), cream type */
      :root { --bg: #07070a; --ink: #f6f1e8; --mut: #8d8a86; --acc: #ff2e3a; --acc-2: #ffb547; --ok: #3ddc84; --card: #121217; --font: "Vazirmatn", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--bg); }
      .clip { position: absolute; inset: 0; }

      /* ground: two slow glow blobs, a fine grid, grain and a vignette */
      #glowA { position: absolute; width: 1300px; height: 1300px; left: -300px; top: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 46, 58, 0.3) 0%, rgba(255, 46, 58, 0) 62%); }
      #glowB { position: absolute; width: 1100px; height: 1100px; left: 320px; top: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 181, 71, 0.12) 0%, rgba(255, 181, 71, 0) 60%); }
      #grid { position: absolute; inset: -40px; opacity: 0.07; background-image: linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px); background-size: 90px 90px; }
      #grain { position: absolute; inset: 0; opacity: 0.08; background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.6px); background-size: 4px 4px; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 100% 75% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.75) 100%); }

      /* beats live in the stage band 220..1100 px; captions sit at 1180 */
      #stage { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .beat .b-in { position: absolute; left: 50px; right: 50px; top: 320px; height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
      .ln { display: block; font-weight: 900; line-height: 1.22; white-space: nowrap; }
      .ln em { font-style: normal; color: var(--acc); text-shadow: 0 0 28px rgba(255, 46, 58, 0.75), 0 0 64px rgba(255, 46, 58, 0.45); }
      .k-hook .ln { font-size: 146px; }
      .k-hook .ln:first-of-type { font-size: 100px; color: var(--ink); opacity: 0.92; }
      /* story rings: a grid of Instagram story rings that light up one by one */
      .segs { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 22px; width: 860px; direction: rtl; margin-bottom: 44px; }
      .segs i { position: relative; width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 4px rgba(246, 241, 232, 0.14); }
      .segs i::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: rgba(246, 241, 232, 0.1); }
      .segs b { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 200deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5, #feda75); box-shadow: 0 0 22px rgba(214, 41, 118, 0.45); }
      .segs b::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #16161c; box-shadow: inset 0 0 0 4px #16161c, inset 0 0 0 30px #2a2a33; }
      .k-text .ln { font-size: 120px; }
      .k-stat .val { font-size: 340px; font-weight: 900; line-height: 1; color: var(--acc); text-shadow: 0 0 40px rgba(255, 46, 58, 0.7), 0 0 90px rgba(255, 46, 58, 0.4); direction: ltr; }
      .k-stat .val.good { color: var(--ok); text-shadow: 0 0 40px rgba(61, 220, 132, 0.6), 0 0 90px rgba(61, 220, 132, 0.35); }
      .k-stat .lab { font-size: 68px; font-weight: 800; color: var(--ink); max-width: 900px; white-space: normal; line-height: 1.35; }
      .k-rule .num { width: 200px; height: 200px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 900; color: var(--bg); background: var(--acc); box-shadow: 0 0 60px rgba(255, 46, 58, 0.6); }
      .k-rule .ln { font-size: 104px; }
      /* chart: two bars, "weak hook" vs "strong hook" */
      .k-chart .bars { display: flex; gap: 100px; align-items: flex-end; direction: rtl; }
      .k-chart .bar { width: 260px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .k-chart .col { width: 220px; border-radius: 26px 26px 10px 10px; background: var(--acc); box-shadow: 0 0 50px rgba(255, 46, 58, 0.5); transform-origin: 50% 100%; }
      .k-chart .bar.good .col { background: var(--ok); box-shadow: 0 0 50px rgba(61, 220, 132, 0.45); }
      .k-chart .v { font-size: 88px; font-weight: 900; direction: ltr; }
      .k-chart .lb { font-size: 46px; font-weight: 800; color: var(--mut); white-space: nowrap; }
      .k-chart .title { font-size: 72px; font-weight: 900; margin-bottom: 40px; }
      /* demo: one sentence at one stage of an edit, inside a phone-like screen */
      .k-demo .head { font-size: 76px; font-weight: 900; margin-bottom: 18px; white-space: nowrap; }
      .k-demo .head em { font-style: normal; color: var(--acc); text-shadow: 0 0 28px rgba(255, 46, 58, 0.7); }
      .k-demo .screen { position: relative; width: 860px; height: 640px; border-radius: 52px; display: flex; align-items: center; justify-content: center; overflow: hidden; direction: rtl; }
      .k-demo .chip { position: absolute; top: 34px; right: 34px; display: flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 40px; font-size: 40px; font-weight: 900; background: rgba(255, 255, 255, 0.1); color: rgba(246, 241, 232, 0.8); }
      .k-demo .mk { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; color: #07070a; }
      .k-demo .mk.x { background: #8d8a86; } .k-demo .mk.ok { background: var(--ok); }
      .k-demo .sent { max-width: 760px; text-align: center; line-height: 1.32; white-space: normal; }
      .k-demo .sent em { font-style: normal; display: inline-block; }
      /* before: flat grey card, small even type, nothing stands out */
      .k-demo .st-before { background: #1d1d21; box-shadow: inset 0 0 0 3px #2c2c31; }
      .k-demo .st-before .sent { font-size: 66px; font-weight: 700; color: #c9c6c0; }
      .k-demo .st-before .sent em { color: inherit; font-weight: 700; }
      /* steps: the same card, one fix at a time */
      .k-demo .st-step1, .k-demo .st-step2, .k-demo .st-step3 { background: #1d1d21; box-shadow: inset 0 0 0 3px rgba(255, 46, 58, 0.45); }
      .k-demo .st-step1 .chip, .k-demo .st-step2 .chip, .k-demo .st-step3 .chip { background: var(--acc); color: #fff; }
      .k-demo .st-step1 .sent, .k-demo .st-step2 .sent, .k-demo .st-step3 .sent { font-size: 66px; font-weight: 800; color: #e9e5de; }
      .k-demo .st-step1 .sent em, .k-demo .st-step2 .sent em, .k-demo .st-step3 .sent em { font-size: 132px; font-weight: 900; color: var(--acc); text-shadow: 0 0 30px rgba(255, 46, 58, 0.7); }
      /* after: the finished frame */
      .k-demo .st-after { background: radial-gradient(ellipse 80% 70% at 50% 45%, #3a0d12 0%, #120708 70%); box-shadow: inset 0 0 0 3px rgba(255, 46, 58, 0.8), 0 0 80px rgba(255, 46, 58, 0.35); }
      .k-demo .st-after .chip { background: var(--ok); color: #07070a; }
      .k-demo .st-after .chip .mk.ok { background: #07070a; color: var(--ok); }
      .k-demo .st-after .sent { font-size: 92px; font-weight: 900; color: #fff; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.8); }
      .k-demo .st-after .sent em { font-size: 150px; color: var(--acc); text-shadow: 0 0 34px rgba(255, 46, 58, 0.85), 0 0 90px rgba(255, 46, 58, 0.5); }
      .k-demo .spk { position: absolute; bottom: 36px; left: 40px; width: 120px; height: 70px; }
      .k-demo .wave { position: absolute; left: 0; top: 50%; border: 6px solid var(--acc-2); border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform-origin: 50% 50%; opacity: 0.3; }
      .k-demo .w1 { width: 30px; height: 30px; margin-top: -15px; } .k-demo .w2 { width: 58px; height: 58px; margin-top: -29px; left: -14px; } .k-demo .w3 { width: 86px; height: 86px; margin-top: -43px; left: -28px; }
      .k-demo .spk .wave { rotate: 45deg; }
      /* result list: rows tick in on their words */
      .k-list .ttl { font-size: 120px; font-weight: 900; margin-bottom: 26px; }
      .k-list .row { display: flex; align-items: center; gap: 30px; width: 920px; direction: rtl; padding: 22px 34px; margin-top: 10px; border-radius: 40px; background: rgba(18, 18, 23, 0.88); box-shadow: inset 0 0 0 2px rgba(61, 220, 132, 0.35), 0 20px 50px rgba(0, 0, 0, 0.5); }
      .k-list .ck { flex: 0 0 100px; height: 100px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(61, 220, 132, 0.5); }
      .k-list .ck svg { width: 66px; height: 66px; }
      .k-list .ck path { fill: none; stroke: #07070a; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; }
      .k-list .rt { font-size: 74px; font-weight: 900; white-space: nowrap; }
      .k-list .rt em { font-style: normal; color: var(--ok); text-shadow: 0 0 26px rgba(61, 220, 132, 0.6); }
      /* CTA: an Instagram-style comment box typing the keyword */
      .k-cta .cbox { width: 900px; height: 170px; border-radius: 85px; background: var(--ink); display: flex; align-items: center; padding: 0 24px; gap: 24px; direction: rtl; box-shadow: 0 0 0 5px var(--acc), 0 24px 60px rgba(0, 0, 0, 0.6); }
      .k-cta .av { flex: 0 0 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf); }
      .k-cta .field { flex: 1; display: flex; align-items: center; }
      .k-cta .word { font-size: 84px; font-weight: 900; color: var(--bg); white-space: nowrap; }
      .k-cta .caret { width: 6px; height: 76px; background: var(--acc); margin-right: 8px; }
      .k-cta .send { flex: 0 0 120px; height: 120px; border-radius: 50%; background: var(--acc); display: flex; align-items: center; justify-content: center; }
      .k-cta .ln { font-size: 86px; }


      /* UI: a stylised app panel (LTR), the cursor, its click ripple and a red arrow on what was clicked */
      .k-ui .ln { font-size: 84px; }
      #b0.k-ui .ln { font-size: 104px; }
      .k-ui .ui { position: relative; flex: 0 0 auto; width: 900px; height: 540px; margin-top: 10px; border-radius: 40px; background: #1a1a1f; box-shadow: inset 0 0 0 3px #2c2c33, 0 30px 80px rgba(0, 0, 0, 0.6); direction: ltr; text-align: left; font-weight: 700; color: #e9e5de; }
      .k-ui .bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; border-radius: 40px 40px 0 0; background: #24242a; font-size: 28px; line-height: 64px; padding-left: 110px; color: #a9a5a0; white-space: nowrap; }
      .k-ui .bar::before { content: ""; position: absolute; left: 32px; top: 25px; width: 14px; height: 14px; border-radius: 50%; background: #55555d; box-shadow: 22px 0 0 #55555d, 44px 0 0 #55555d; }
      .k-ui .seq { position: absolute; left: 24px; right: 24px; top: 84px; height: 76px; border-radius: 14px; display: flex; align-items: center; gap: 18px; padding-left: 18px; font-size: 34px; white-space: nowrap; }
      .k-ui .seq .ic { flex: 0 0 46px; height: 34px; border-radius: 7px; background: linear-gradient(135deg, #3ddc84, #1e8f55); }
      .k-ui .menu { position: absolute; left: 130px; top: 150px; width: 520px; padding: 10px; border-radius: 18px; background: #2d2d33; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 0 0 2px #3c3c44; opacity: 0; transform-origin: 0 0; z-index: 5; }
      .k-ui .it { height: 64px; line-height: 64px; padding-left: 22px; border-radius: 10px; font-size: 32px; white-space: nowrap; color: #d9d5ce; }
      .k-ui .row { position: absolute; left: 40px; width: 560px; }
      .k-ui .row .lb { height: 42px; font-size: 28px; color: #a9a5a0; white-space: nowrap; }
      .k-ui .box { position: relative; height: 80px; border-radius: 14px; background: #121216; box-shadow: inset 0 0 0 2px #3a3a42; }
      .k-ui .box span { position: absolute; left: 24px; top: 0; line-height: 80px; font-size: 34px; white-space: nowrap; }
      .k-ui .box .v1 { opacity: 0; color: #fff; }
      .k-ui .box b { position: absolute; right: 24px; top: 0; line-height: 80px; font-size: 30px; color: #8d8a86; }
      .k-ui .dd { position: absolute; left: 0; right: 0; top: 128px; padding: 8px; border-radius: 14px; background: #2d2d33; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 2px #3c3c44; opacity: 0; transform-origin: 50% 0; }
      .k-ui .dd .it { height: 56px; line-height: 56px; font-size: 30px; }
      .k-ui .btns { position: absolute; right: 40px; bottom: 40px; display: flex; gap: 20px; z-index: 1; }
      .k-ui .btn { height: 78px; padding: 0 40px; border-radius: 39px; font-size: 32px; line-height: 78px; box-shadow: inset 0 0 0 2px #4a4a52; color: #c9c6c0; white-space: nowrap; }
      .k-ui .btn.go { color: #fff; background: #34343c; box-shadow: inset 0 0 0 3px var(--acc); }
      .k-ui .cur { position: absolute; left: 0; top: 0; z-index: 30; transform-origin: 3px 3px; }
      .k-ui .cur path { fill: #fff; stroke: #07070a; stroke-width: 4; stroke-linejoin: round; }
      .k-ui .rip { position: absolute; left: 0; top: 0; width: 80px; height: 80px; border-radius: 50%; border: 6px solid var(--acc-2); opacity: 0; z-index: 29; }
      .k-ui .arw { position: absolute; left: 0; top: 0; z-index: 28; opacity: 0; transform-origin: 4px 45px; overflow: visible; }
      .k-ui .arw path { fill: var(--acc); stroke: #fff; stroke-width: 4; stroke-linejoin: round; }
      /* reframe / pair: a 16:9 frame, the subject, the tracking 9:16 crop */
      .k-ui .v-reframe, .k-ui .v-pair { overflow: hidden; }
      .k-ui .fr { position: absolute; left: 40px; top: 40px; width: 820px; height: 460px; border-radius: 22px; overflow: hidden; background: #2a2024; }
      .k-ui .scene { position: absolute; left: 0; top: 0; width: 820px; height: 460px; transform-origin: 0 0; background: linear-gradient(180deg, #4a3029 0%, #2b1f22 62%, #1b1517 100%); }
      .k-ui .win { position: absolute; left: 70px; top: 60px; width: 200px; height: 250px; border-radius: 10px; background: linear-gradient(160deg, #ffd9a0, #e8935c); opacity: 0.55; }
      .k-ui .lamp { position: absolute; left: 600px; top: 40px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 181, 71, 0.55), rgba(255, 181, 71, 0) 65%); }
      .k-ui .floor { position: absolute; left: 0; right: 0; top: 360px; height: 2px; background: rgba(255, 255, 255, 0.12); }
      .k-ui .subj { position: absolute; left: 295px; top: 110px; width: 230px; height: 400px; }
      .k-ui .subj .hd { position: absolute; left: 66px; top: 0; width: 98px; height: 110px; border-radius: 50%; background: #e7b48f; }
      .k-ui .subj .bd { position: absolute; left: 0; top: 118px; width: 230px; height: 300px; border-radius: 110px 110px 20px 20px; background: linear-gradient(180deg, #ff2e3a, #b3141e); }
      .k-ui .crop { position: absolute; left: 280px; top: 0; width: 260px; height: 460px; box-shadow: 0 0 0 1000px rgba(5, 5, 8, 0.66), inset 0 0 0 6px var(--acc); border-radius: 8px; }
      .k-ui .tag { position: absolute; left: 50%; top: 14px; margin-left: -62px; width: 124px; height: 52px; border-radius: 26px; background: var(--acc); color: #fff; font-size: 30px; font-weight: 900; line-height: 52px; text-align: center; }
      .k-ui .tag.t0 { left: 18px; margin-left: 0; background: rgba(255, 255, 255, 0.16); color: #e9e5de; }
      .k-ui .v-reframe .tag.t0 { left: auto; right: 18px; top: auto; bottom: 16px; }
      .k-ui .fr.sm { left: 30px; top: 150px; width: 440px; height: 247px; }
      .k-ui .fr.sm .scene { transform: scale(0.5366); }
      .k-ui .fr.vt { left: 600px; top: 30px; width: 270px; height: 480px; box-shadow: inset 0 0 0 6px var(--acc); }
      .k-ui .fr.vt .scene { transform: translateX(-292px) scale(1.0435); }
      .k-ui .fr.vt .tag { top: 18px; }

      .k-ui .nx path { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }

      .k-ui .ok svg { width: 50px; height: 50px; }
      .k-ui .ok path { fill: none; stroke: #07070a; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .k-ui .cp { position: absolute; top: 412px; font-size: 40px; font-weight: 900; color: var(--mut); white-space: nowrap; }
      .k-ui .cp.c0 { left: 30px; width: 440px; text-align: center; }
      .k-ui .cp.c1 { display: none; }

      #handle { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; direction: ltr; font-weight: 900; font-size: 40px; letter-spacing: 2px; color: rgba(246, 241, 232, 0.55); }

      /* captions: karaoke, word by word */
      .cap { display: flex; align-items: flex-start; justify-content: center; }
      .cap-in { margin-top: 1180px; max-width: 1000px; text-align: center; font-weight: 900; font-size: 58px; line-height: 1.5; }
      .cap .w { position: relative; isolation: isolate; display: inline-block; padding: 0 12px 4px; color: rgba(246, 241, 232, 0.42); text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95); }

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
      <div id="ground" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="0">
        <div id="glowA"></div><div id="glowB"></div><div id="grid"></div><div id="grain"></div><div id="vig"></div>
        <div id="handle">@shahcutt</div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1" data-layout-allow-overlap>
        <!--__BEATS__-->
      </div>
      <!--__CAPTIONS__-->
      <audio id="vo" src="assets/voiceover.wav" data-start="0" data-duration="__VO_DUR__" data-volume="1"></audio>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="__TOTAL__" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="__TOTAL__" data-volume="1"></audio>
    </div>

    <script>
      window.__T = /*__TIMING__*/null;
      const T = window.__T;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const $ = (id) => document.getElementById(id);

      // ground drifts slowly for the whole film
      tl.fromTo("#glowA", { x: 0, y: 0 }, { x: 240, y: -160, duration: T.total, ease: "sine.inOut" }, 0);
      tl.fromTo("#glowB", { x: 0, y: 0 }, { x: -260, y: -220, duration: T.total, ease: "sine.inOut" }, 0);
      tl.fromTo("#grid", { y: 0 }, { y: 90, duration: T.total, ease: "none" }, 0);

      // beats: each enters on its word with a camera punch and leaves when the next one starts
      T.beats.forEach((b, i) => {
        const el = $("b" + i), inner = el.querySelector(".b-in"), parts = b.kind === "list" ? inner.querySelectorAll(".ttl") : inner.children, next = i < T.beats.length - 1 ? T.beats[i + 1].start : T.total;
        if (i === 0) {
          // frame 0 is the thumbnail and the hook: fully visible from the first frame, settling with a slow push
          tl.fromTo(parts, { scale: 1.08 }, { scale: 1, duration: 1.4, ease: "power2.out", stagger: 0.05 }, 0);
        } else {
          tl.fromTo(inner, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, b.start - 0.04);
          tl.fromTo(parts, { y: 70, scale: 0.86, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)", stagger: 0.09 }, b.start - 0.04);
          tl.fromTo("#stage", { scale: 1.035 }, { scale: 1, duration: 0.5, ease: "power3.out" }, b.start - 0.04);
        }
        if (i < T.beats.length - 1) tl.to(inner, { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, next - 0.16);
        if (b.kind === "stat") {
          const v = el.querySelector(".val"), num = parseFloat(v.dataset.n), suf = v.dataset.suf || "";
          const st = { n: 0 }, fa = (x) => String(x).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
          tl.fromTo(st, { n: 0 }, { n: num, duration: 0.8, ease: "power2.out", onUpdate: () => { v.textContent = fa(Math.round(st.n)) + suf; } }, b.start);
        }
        if (b.segs) {
          el.querySelectorAll(".segs b").forEach((s, k) => {
            const t = T.segT0 + k * T.segDt;
            if (t <= 0) gsap.set(s, { opacity: 1, scale: 1 });
            else tl.fromTo(s, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.2)" }, t);
          });
        }
        if (b.kind === "demo" && b.hits) {
          const sent = el.querySelector(".sent"), em = sent.querySelector("em"), scr = el.querySelector(".screen"), waves = el.querySelectorAll(".wave");
          b.hits.forEach((h, k) => {
            const ir = { immediateRender: k === 0 };
            tl.fromTo(sent, { scale: 1 }, { scale: k % 2 ? 1.05 : 1.1, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, ...ir }, h);
            if (em) tl.fromTo(em, { y: 0, rotation: 0 }, { y: -22, rotation: k % 2 ? 4 : -4, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, ...ir }, h);
            if (waves.length) tl.fromTo(waves, { opacity: 0.3, scale: 1 }, { opacity: 1, scale: 1.25, duration: 0.1, stagger: 0.03, yoyo: true, repeat: 1, ...ir }, h);
            if (b.state === "after") tl.fromTo(scr, { x: 0 }, { x: k % 2 ? 10 : -10, duration: 0.05, yoyo: true, repeat: 1, ...ir }, h);
          });
        }
        if (b.kind === "list") {
          el.querySelectorAll(".row").forEach((r, k) => {
            const at = b.rowsAt[k];
            tl.fromTo(r, { x: -90, opacity: 0, scale: 0.92 }, { x: 0, opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, at - 0.06);
            tl.fromTo(r.querySelector("path"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + 0.06);
          });
        }
        if (b.kind === "chart") {
          el.querySelectorAll(".col").forEach((c, k) => tl.fromTo(c, { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, b.start + 0.25 + k * 0.45));
        }

        if (b.kind === "ui") {
          const scr = el.querySelector(".ui"), cur = scr.querySelector(".cur"), rip = scr.querySelector(".rip"), arw = scr.querySelector(".arw");
          const P = (e) => { let x = 0, y = 0; while (e && e !== scr) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return [x, y]; };
          const span = next - b.start;
          if (b.view === "reframe" || b.view === "pair") {
            const sub = scr.querySelector(".fr .subj"), crop = scr.querySelector(".crop"), n = Math.max(1, Math.floor(span / 1.5));
            tl.fromTo(sub, { x: -130 }, { x: 130, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, b.start);
            if (crop) tl.fromTo(crop, { x: -130 }, { x: 130, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, b.start + 0.14);
            if (b.view === "pair") {
              tl.fromTo(scr.querySelector(".fr.vt"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, b.start + 0.45);
              tl.fromTo(scr.querySelector(".nx"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, b.start + 0.35);
              tl.fromTo(scr.querySelector(".ok"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, b.start + 0.85);
            }
          }
          if (cur && b.acts) {
            let px = 700, py = 430, first = true, arrowOn = false;
            const go = (x, y, t) => { tl.fromTo(cur, { x: px, y: py }, { x, y, duration: 0.4, ease: "power2.inOut", immediateRender: first }, t - 0.46); first = false; px = x; py = y; };
            const press = (t) => {
              tl.fromTo(cur, { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t);
              tl.fromTo(rip, { x: px - 40, y: py - 40, scale: 0.2, opacity: 0.95 }, { x: px - 40, y: py - 40, scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
            };
            const point = (x, y, rot, t) => {
              if (!arrowOn) tl.fromTo(arw, { x: x + 70 * Math.cos(rot * Math.PI / 180), y: y - 45 + 70 * Math.sin(rot * Math.PI / 180), rotation: rot, opacity: 0 }, { x, y: y - 45, rotation: rot, opacity: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
              else tl.to(arw, { x, y: y - 45, rotation: rot, duration: 0.3, ease: "power3.inOut" }, t);
              arrowOn = true;
            };
            const hl = (e, t) => { tl.fromTo(e, { backgroundColor: "rgba(255,46,58,0)", color: "#d9d5ce" }, { backgroundColor: "rgba(255,46,58,1)", color: "#ffffff", duration: 0.1, ease: "power1.out", immediateRender: false }, t); };
            b.acts.forEach((a) => {
              if (a.a === "rc") {
                const seq = scr.querySelector(".seq"), [sx, sy] = P(seq), menu = scr.querySelector(".menu");
                go(sx + 120, sy + 44, a.t); press(a.t);
                tl.fromTo(seq, { backgroundColor: "rgba(90,140,255,0)" }, { backgroundColor: "rgba(90,140,255,0.3)", duration: 0.1, immediateRender: false }, a.t);
                tl.fromTo(menu, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, a.t + 0.05);
              } else if (a.a === "pick" && a.row === undefined) {
                const it = scr.querySelector(".menu .pk"), [ix, iy] = P(it), menu = scr.querySelector(".menu");
                go(ix + 330, iy + 36, a.t); hl(it, a.t - 0.12); press(a.t);
                point(P(menu)[0] + menu.offsetWidth + 14, iy + 32, 0, a.t + 0.08);
              } else if (a.a === "open") {
                const row = scr.querySelectorAll(".row")[a.row], box = row.querySelector(".box"), dd = row.querySelector(".dd"), [bx, by] = P(box);
                go(bx + 470, by + 44, a.t); press(a.t);
                tl.fromTo(box, { boxShadow: "inset 0 0 0 2px #3a3a42" }, { boxShadow: "inset 0 0 0 3px #ff2e3a", duration: 0.1, immediateRender: false }, a.t);
                tl.fromTo(dd, { opacity: 0, scaleY: 0.7 }, { opacity: 1, scaleY: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, a.t + 0.04);
              } else if (a.a === "pick") {
                const row = scr.querySelectorAll(".row")[a.row], box = row.querySelector(".box"), dd = row.querySelector(".dd"), it = dd.querySelector(".pk"), [ix, iy] = P(it), [bx, by] = P(box);
                go(ix + 300, iy + 32, a.t); hl(it, a.t - 0.12); press(a.t);
                tl.fromTo(dd, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, a.t + 0.16);
                tl.fromTo(box.querySelector(".v0"), { opacity: 1 }, { opacity: 0, duration: 0.1, immediateRender: false }, a.t + 0.16);
                tl.fromTo(box.querySelector(".v1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, a.t + 0.18);
                point(bx + box.offsetWidth + 14, by + 40, 0, a.t + 0.2);
              } else if (a.a === "btn") {
                const btn = scr.querySelector(".btn.go"), [gx, gy] = P(btn);
                go(gx + btn.offsetWidth / 2, gy + 40, a.t); press(a.t);
                tl.fromTo(btn, { backgroundColor: "rgba(52,52,60,1)" }, { backgroundColor: "rgba(255,46,58,1)", duration: 0.1, immediateRender: false }, a.t);
                point(gx + btn.offsetWidth / 2, gy - 12, -90, a.t + 0.08);
              }
            });
            if (arrowOn) {
              const last = b.acts[b.acts.length - 1].t + 0.45;
              let k = Math.floor((next - last - 0.25) / 0.28); k -= k % 2;                // whole in-out pairs, so it ends at rest
              if (k >= 2) tl.fromTo(arw, { scale: 1 }, { scale: 1.12, duration: 0.28, yoyo: true, repeat: k - 1, ease: "sine.inOut", immediateRender: false }, last);
            }
          }
        }
        if (b.kind === "cta") {
          const w = el.querySelector(".word"), car = el.querySelector(".caret");
          tl.fromTo(w, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(5)" }, b.wordAt + 0.02);
          tl.fromTo(car, { opacity: 1 }, { opacity: 0, duration: 0.26, yoyo: true, repeat: 9, ease: "steps(1)" }, b.start);
          tl.to(el.querySelector(".send"), { scale: 1.15, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, b.wordAt + 0.6);
        }
      });

      // captions: line fades in, each word lights up as it is spoken
      T.lines.forEach((L, i) => {
        const cap = $("cap" + i), inner = cap.firstElementChild, ws = inner.querySelectorAll(".w");
        tl.fromTo(inner, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, L.start - 0.06);
        tl.to(inner, { opacity: 0, duration: 0.12, ease: "power1.in" }, L.hold - 0.12);
        ws.forEach((w, j) => {
          const [s] = L.w[j], nxt = j < ws.length - 1 ? L.w[j + 1][0] : Math.min(L.hold - 0.12, L.w[j][1] + 0.25);
          const bx = w.firstElementChild, done = w.classList.contains("hi") ? "#ff6b72" : "#f6f1e8";
          tl.fromTo(bx, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, s - 0.03);
          tl.fromTo(w, { color: "rgba(246,241,232,0.42)" }, { color: "#07070a", duration: 0.08 }, s - 0.03);
          tl.to(bx, { opacity: 0, duration: 0.1, ease: "power1.in" }, nxt - 0.04);
          tl.to(w, { color: done, duration: 0.1 }, nxt - 0.04);
        });
      });
    </script>
  </body>
</html>
