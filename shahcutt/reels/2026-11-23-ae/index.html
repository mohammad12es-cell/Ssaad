    <style>

      :root {

      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--app); }

      /* toolbar */
      #tools { position: absolute; left: 12px; right: 12px; top: 150px; height: 74px; background: var(--panel); border-radius: 8px; display: flex; align-items: center; gap: 6px; padding: 0 14px; }

      #tools .ws { margin-left: auto; display: flex; gap: 22px; font-size: 22px; font-weight: 700; color: var(--dim); }
      #tools .ws b { color: var(--val); border-bottom: 3px solid var(--val); padding-bottom: 4px; }

      /* panels */
      .panel { position: absolute; left: 12px; right: 12px; background: var(--panel); border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2px transparent; }
      .panel.act { box-shadow: inset 0 0 0 2px var(--blue); }

      #comp { top: 238px; height: 860px; }

      #frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #bbox { position: absolute; border: 2px solid #e2e2e2; opacity: 0; }
      #bbox i { position: absolute; width: 12px; height: 12px; background: #e2e2e2; margin: -7px 0 0 -7px; }
      #motionPath { position: absolute; inset: 0; opacity: 0; }
      #vfoot { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: var(--panel2); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 22px; padding: 0 16px; font-size: 20px; font-weight: 700; color: #bbb; }
      #vfoot .tc { color: var(--val); }

      #tlp { top: 1108px; height: 560px; }
      #tlhead { position: relative; height: 70px; display: flex; align-items: center; padding: 0 16px; gap: 14px; border-bottom: 1px solid var(--line); }
      #bigtc { font-size: 34px; font-weight: 700; color: var(--val); letter-spacing: 0.5px; min-width: 190px; }
      #fps { font-size: 15px; color: var(--dim); line-height: 1.2; }
      #search { width: 180px; height: 34px; border-radius: 17px; background: #1a1a1a; box-shadow: inset 0 0 0 1px #3a3a3a; }
      #ruler { position: absolute; left: 548px; right: 16px; top: 0; height: 70px; }
      #ruler .n { position: absolute; top: 12px; font-size: 16px; color: var(--dim); transform: translateX(-50%); }
      #ruler .t { position: absolute; bottom: 0; width: 1px; height: 12px; background: #555; }
      #wa { position: absolute; left: 548px; right: 16px; top: 70px; height: 12px; background: #3d3d3d; }
      #cols { height: 34px; display: flex; align-items: center; padding: 0 16px; gap: 0; font-size: 17px; font-weight: 700; color: var(--dim); border-bottom: 1px solid var(--line); margin-top: 12px; }
      #cols span { display: inline-block; }
      #layers { position: absolute; left: 0; right: 0; top: 128px; bottom: 0; }
      .row { position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; font-size: 20px; border-bottom: 1px solid #2c2c2c; }
      .row.sel { background: #2f3a4a; }
      .row .sw { width: 112px; display: flex; gap: 10px; padding-left: 16px; }
      .row .sw i { width: 16px; height: 16px; border-radius: 3px; background: #4a4a4a; }
      .row .sw i.eye { background: none; border: 2px solid #9a9a9a; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
      .row .lb { width: 18px; height: 18px; border-radius: 3px; margin-right: 12px; }
      .row .num { width: 34px; color: var(--dim); }
      .row .ic { width: 30px; font-weight: 900; color: #ddd; font-size: 20px; }
      .row .nm { width: 300px; color: #e3e3e3; font-weight: 700; white-space: nowrap; overflow: hidden; }
      .row.prop .nm { padding-left: 40px; font-weight: 400; color: #c3c3c3; width: 220px; }
      .row.prop .sw { width: 112px; }
      .row .stop { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8f8f8f; margin-right: 10px; position: relative; flex: none; }
      .row .stop::after { content: ""; position: absolute; left: 8px; top: 3px; width: 2px; height: 7px; background: #8f8f8f; }
      .row .stop .on { position: absolute; inset: -2px; border-radius: 50%; background: var(--val); opacity: 0; }
      .row .v { width: 190px; color: var(--val); font-weight: 700; white-space: nowrap; position: relative; }
      .row .v span { position: absolute; left: 0; top: -13px; }
      .row .tw { width: 24px; color: #9a9a9a; font-size: 16px; }
      .bar { position: absolute; top: 9px; height: 28px; border-radius: 3px; opacity: 0.85; }
      .kf { position: absolute; top: 14px; width: 18px; height: 18px; margin-left: -9px; background: var(--kf); rotate: 45deg; border-radius: 2px; box-shadow: 0 0 0 1px #111; }
      .kf.ez { border-radius: 50% 0; }
      .kf.selk { background: var(--val); }
      #cti { position: absolute; top: 58px; width: 3px; height: 500px; background: var(--cti); margin-left: -1px; z-index: 5; }
      #cti::before { content: ""; position: absolute; left: -10px; top: -2px; width: 23px; height: 16px; background: var(--cti); border-radius: 3px 3px 10px 10px; }
      .wave { position: absolute; top: 6px; height: 34px; display: flex; align-items: center; gap: 2px; }
      .wave b { width: 3px; background: #6bbf6b; border-radius: 1px; }

      /* tutorial layer: cursor, keycaps, callouts, captions (above the camera) */
      #cursor { position: absolute; left: 0; top: 0; width: 120px; height: 120px; z-index: 30; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5)); }
      #cursor svg { width: 100%; height: 100%; fill: #fff; stroke: #111; stroke-width: 1.3; stroke-linejoin: round; }
      #ripple { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 5px solid var(--acc); opacity: 0; z-index: 29; }
      .key { position: absolute; z-index: 31; min-width: 120px; height: 120px; padding: 0 28px; border-radius: 22px; background: linear-gradient(#f4f4f4, #d6d6d6); box-shadow: 0 10px 0 #9a9a9a, 0 20px 40px rgba(0,0,0,0.6); color: #111; font: 900 64px/120px var(--ui); text-align: center; opacity: 0; }
      .callout { position: absolute; z-index: 32; padding: 18px 30px; border-radius: 22px; background: var(--acc); color: #fff; font: 900 50px/1.3 var(--fa); direction: rtl; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,0.55); opacity: 0; }
      .callout::after { content: ""; position: absolute; width: 28px; height: 28px; background: var(--acc); rotate: 45deg; }
      .callout.down::after { left: 50%; bottom: -12px; margin-left: -14px; } .callout.up::after { left: 50%; top: -12px; margin-left: -14px; }
      #title { position: absolute; left: 40px; right: 40px; top: 1700px; text-align: center; font: 900 58px/1.35 var(--fa); direction: rtl; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,0.9); }
      #title em { font-style: normal; color: var(--acc); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="ws" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="cam">
          <div id="tools">
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M6 15 L16 6 L26 15 M9 13 V26 H23 V13" /></svg></div>
            <div class="tb on"><svg viewBox="0 0 32 32"><path d="M9 5 V24 L14 19 L18 27 L21 25.5 L17 18 L24 18 Z" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M11 17 V9 a2 2 0 0 1 4 0 V15 M15 15 V7 a2 2 0 0 1 4 0 V15 M19 15 V9 a2 2 0 0 1 4 0 V19 c0 5 -3 8 -8 8 c-4 0 -6 -2 -8 -6 l-3 -5 a2 2 0 0 1 3 -2 l3 3" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><circle cx="13" cy="13" r="8" /><path d="M19 19 L27 27 M10 13 H16 M13 10 V16" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M16 5 A11 11 0 1 1 5 16 M5 9 V16 H12" /></svg></div>

            <div class="tb"><svg viewBox="0 0 32 32"><path d="M6 26 L10 14 L22 6 L26 10 L18 22 Z M10 14 L18 22" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M8 7 H24 M16 7 V26 M12 26 H20" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M8 24 C12 14 18 8 26 6 C24 14 18 20 8 24 Z" /></svg></div>
            <div class="tb"><svg viewBox="0 0 32 32"><path d="M10 26 L22 26 M12 26 L20 10 L24 14 L16 26" /></svg></div>
            <div class="ws"><span>Default</span><b>Animation</b><span>Effects</span></div>
          </div>

          <div class="panel act" id="comp">
            <div class="tabs"><div class="tab"><i>✕</i>Project</div><div class="tab on"><i>✕</i>Composition&nbsp; <span style="color:#fff">reel_final</span> <i>≡</i></div><div class="tab"><i>✕</i>Layer</div></div>
            <div id="crumb">◀ <b>reel_final</b> ▸</div>
            <div id="viewer">
              <div id="frame">
                <video id="vRaw" class="clip" src="assets/placeholder.mp4" data-start="0" data-duration="8" data-track-index="5" muted playsinline></video>
                <div id="bbox"><i style="left:0;top:0"></i><i style="left:100%;top:0"></i><i style="left:0;top:100%"></i><i style="left:100%;top:100%"></i><i style="left:50%;top:0"></i><i style="left:50%;top:100%"></i><i style="left:0;top:50%"></i><i style="left:100%;top:50%"></i></div>
              </div>
            </div>
            <div id="vfoot"><span>48.1% ▾</span><span>⛶</span><span class="tc" id="vtc">0;00;00;00</span><span>📷</span><span>Full ▾</span><span>▭</span><span>Active Camera ▾</span><span>1 View ▾</span></div>
          </div>

          <div class="panel" id="tlp">
            <div class="tabs"><div class="tab"><i>✕</i>Render Queue</div><div class="tab on"><i>✕</i>reel_final <i>≡</i></div></div>
            <div id="tlhead"><div id="bigtc">0:00:00:00</div><div id="fps">00000<br />(30.00 fps)</div><div id="search"></div><div id="ruler"></div></div>
            <div id="wa"></div>
            <div id="cols"><span style="width:112px">👁 🔊 ● 🔒</span><span style="width:30px"></span><span style="width:34px">#</span><span style="width:330px">Layer Name</span><span>Parent &amp; Link</span></div>
            <div id="layers"></div>

      </div>

      <div id="tut" class="clip" data-start="0" data-duration="8" data-track-index="2">
        <div id="ripple"></div>
        <div id="cursor"><svg viewBox="0 0 24 24"><path d="M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z" /></svg></div>
        <div class="key" id="keyS">S</div>
        <div class="callout down" id="co1">اینجا رو بزن ⏱</div>
        <div id="title">اسکیل رو <em>کی‌فریم</em> کن</div>
      </div>
    </div>

    <script>
      // ---------- workspace model (film_ae.py fills this from the edit plan)
      const AE = window.__AE || {
        r0: 0, r1: 6, now: 2.5,
        layers: [
          { name: "عنوان هوک", ic: "T", label: "--red", in: 0, out: 6, sel: true, props: [
            { name: "Scale", v: "100.0, 100.0%", kfs: [1.0, 1.6, 2.3], ez: true, on: true },
            { name: "Position", v: "540.0, 960.0", kfs: [] } ] },
          { name: "Zoom (Adjustment)", ic: "▣", label: "--lav", in: 0.8, out: 6 },
          { name: "raw_clip.mp4", ic: "▶", label: "--aqua", in: 0, out: 6 },
          { name: "whoosh.wav", ic: "♪", label: "--grn", in: 1.0, out: 1.6, audio: true },
          { name: "music.wav", ic: "♪", label: "--grn", in: 0, out: 6, audio: true },
        ],
      };
      const X0 = 548, XW = 1080 - 12 - 16 - X0;   // timeline area in panel coords
      const tx = (t) => X0 + ((t - AE.r0) / (AE.r1 - AE.r0)) * XW;
      // ruler
      const ruler = document.getElementById("ruler");
      for (let s = Math.ceil(AE.r0); s <= AE.r1; s++) {
        const n = document.createElement("div"); n.className = "n"; n.style.left = (tx(s) - X0) + "px"; n.textContent = String(s).padStart(2, "0") + "s"; ruler.appendChild(n);
        for (let q = 0; q < 4 && s + q / 4 <= AE.r1; q++) { const t = document.createElement("div"); t.className = "t"; t.style.left = (tx(s + q / 4) - X0) + "px"; t.style.height = q ? "7px" : "12px"; ruler.appendChild(t); }
      }
      // layers
      const L = document.getElementById("layers"); let y = 0;
      AE.layers.forEach((ly, i) => {
        const r = document.createElement("div"); r.className = "row" + (ly.sel ? " sel" : ""); r.style.top = y + "px"; y += 46;
        r.innerHTML = `<div class="sw"><i class="eye"></i><i></i><i></i></div><div class="lb" style="background:var(${ly.label})"></div><div class="num">${i + 1}</div><div class="tw">${ly.props ? "▾" : "▸"}</div><div class="ic">${ly.ic}</div><div class="nm">${ly.name}</div>`;
        const bar = document.createElement("div"); bar.className = "bar"; bar.style.left = tx(ly.in) + "px"; bar.style.width = (tx(ly.out) - tx(ly.in)) + "px"; bar.style.background = `var(${ly.label})`; bar.style.opacity = 0.55; r.appendChild(bar);
        if (ly.audio) { const w = document.createElement("div"); w.className = "wave"; w.style.left = tx(ly.in) + "px"; let h = ""; const n = Math.floor((tx(ly.out) - tx(ly.in)) / 5); for (let k = 0; k < n; k++) h += `<b style="height:${6 + 26 * Math.abs(Math.sin(k * 1.7 + i) * Math.cos(k * 0.31))}px"></b>`; w.innerHTML = h; r.appendChild(w); }
        L.appendChild(r);
        (ly.props || []).forEach((p) => {
          const pr = document.createElement("div"); pr.className = "row prop"; pr.style.top = y + "px"; y += 46;
          pr.innerHTML = `<div class="sw"></div><div class="tw"></div><div class="stop"><i class="on" style="opacity:${p.on ? 1 : 0}"></i></div><div class="nm">${p.name}</div><div class="v"><span>${p.v}</span></div>`;
          p.kfs.forEach((t) => { const k = document.createElement("div"); k.className = "kf" + (p.ez ? " ez" : ""); k.style.left = tx(t) + "px"; pr.appendChild(k); });
          L.appendChild(pr);
        });
      });
      document.getElementById("cti").style.left = (12 + tx(AE.now)) + "px";
      document.getElementById("cti").style.left = tx(AE.now) + "px";

      // ---------- preview: cursor on the stopwatch, S key, callout
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      gsap.set("#cursor", { x: 300, y: 1500 });
      tl.to("#cursor", { x: 150, y: 1305, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo("#ripple", { x: 160, y: 1316, scale: 0.4, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.4 }, 0.95);
      tl.fromTo("#keyS", { x: 480, y: 980, scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 0.2);
      tl.fromTo("#co1", { x: 40, y: 1150, opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.0);
      tl.to("#cam", { scale: 1.6, x: -40, y: -1700, duration: 0.8, ease: "power3.inOut" }, 2.0);
    </script>
