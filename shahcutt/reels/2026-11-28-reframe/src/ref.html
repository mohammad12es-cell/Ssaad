    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">

      <!--__PIX__-->
      <!--__CAPTIONS__-->
      <audio id="vo" src="assets/voiceover.wav" data-start="0" data-duration="__VO_DUR__" data-volume="1"></audio>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="__TOTAL__" data-volume="1"></audio>

    </div>

    <script>
      window.__T = /*__TIMING__*/null;
      const T = window.__T, K = T.k;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
      const S = {}; T.scenes.forEach((s, i) => { s.el = document.getElementById("sc" + i); S[s.name] = s; });
      const FAd = (x) => String(x).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

      // scene entrances: a push on plain cuts, a slow settle under the pixel dissolves
      T.scenes.forEach((s, i) => {
        if (i === 0) return;
        const si = s.el.querySelector(".si");
        if (s.pix) tl.fromTo(si, { scale: 1.05 }, { scale: 1, duration: 0.6, ease: "power2.out" }, s.start);
        else tl.fromTo(si, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, s.start);
      });
      // 3D words pop in on their word; text lines rise in
      $$(".ice[data-at]").forEach((e) => tl.fromTo(e, { opacity: 0, scale: 0.55, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }, +e.dataset.at));
      $$("[data-in]").forEach((e) => tl.fromTo(e, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, +e.dataset.in));

      // the footage card: presenter moves, the 9:16 crop follows him a beat later
      function track(f, t0, t1, P, A, lag) {
        const n = Math.max(1, Math.floor((t1 - t0) / (P / 2))), half = P / 2;
        const pp = $$(".pp", f), main = pp[pp.length - 1], cr = $(".crop", f);
        tl.fromTo(main, { x: -A }, { x: A, duration: half, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, t0);
        pp.slice(0, -1).forEach((g, k) => tl.fromTo(g, { x: -A }, { x: A, duration: half, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, t0 + 0.05 * (pp.length - 1 - k)));
        if (cr) tl.fromTo(cr, { x: -A }, { x: A, duration: half, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, t0 + lag);
      }

      // HOOK (frame 0 = the thumbnail: everything visible, settling)
      {
        const s = S.hook, el = s.el;
        tl.fromTo($(".hk", el), { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 0);
        tl.fromTo($(".f-hook", el), { y: 30 }, { y: 0, duration: 1.2, ease: "power2.out" }, 0);
        track($(".f-hook", el), 0, s.end, 2.0, 150, 0.16);
      }
      // BUTTON: the hand presses Auto Reframe, the 16:9 card squeezes into a 9:16 one
      {
        const s = S.button, el = s.el, btn = $(".gbtn", el), hand = $(".hand", el), rip = $(".brip", el);
        tl.fromTo(btn, { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, s.start + 0.05);
        tl.fromTo($(".mA", el), { y: -40, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, s.start + 0.1);
        tl.fromTo(hand, { x: 900, y: 1700 }, { x: 600, y: 1255, duration: 0.45, ease: "power2.out" }, K.press - 0.5);
        tl.fromTo(hand, { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, K.press);
        tl.fromTo(btn, { y: 0 }, { y: 14, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, K.press);
        tl.fromTo(rip, { scale: 0.4, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out" }, K.press);
        tl.to(hand, { x: 980, y: 1800, duration: 0.4, ease: "power2.in" }, K.press + 0.35);
        tl.to($(".mA", el), { scaleX: 0.5625, opacity: 0, duration: 0.4, ease: "power3.in" }, K.morph - 0.1);
        tl.fromTo($(".mB", el), { scaleY: 0.5625, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, K.morph + 0.2);
      }
      // CENTER: inside the 9:16 the presenter stays centred while the studio slides behind him
      {
        const s = S.center, el = s.el, n = Math.max(1, Math.floor((s.end - s.start) / 1.0)), A = 330;
        tl.fromTo($(".world", el), { x: A }, { x: -A, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, s.start + 0.12);
        tl.fromTo($(".vin .pp", el), { x: -A }, { x: A, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, s.start);
        tl.fromTo($(".fr916", el), { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, s.start + 0.05);
      }
      // HILL: count up to 500+
      {
        const s = S.hill, el = s.el, sp = $$(".num span", el), st = { n: 0 };
        tl.fromTo($(".plate img", el), { scale: 1 }, { scale: 1.08, duration: s.end - s.start + 0.4, ease: "none" }, s.start);
        tl.fromTo(st, { n: 0 }, { n: 500, duration: 0.9, ease: "power2.out", onUpdate: () => { const v = FAd(Math.round(st.n)) + "+"; sp.forEach((e) => (e.textContent = v)); } }, K.count);
      }
      // CLOCK: slow turn and push
      {
        const s = S.clock, el = s.el;
        tl.fromTo($(".plate img", el), { scale: 1.04, rotation: 0 }, { scale: 1.14, rotation: 4, duration: s.end - s.start + 0.4, ease: "none" }, s.start);
      }
      // STEPS: the app panel, every click shown (cursor, ripple, blue arrow)
      ["step1", "step2", "step3"].forEach((name) => {
        const s = S[name], el = s.el, scr = $(".ui", el), cur = $(".cur", scr), rip = $(".rip", scr), arw = $(".arw", scr), next = s.end;
        tl.fromTo($(".bignum .ice", el), { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 0.32, duration: 0.7, ease: "power3.out" }, s.start + 0.05);
        tl.fromTo(scr, { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, s.start + 0.08);
        const P = (e) => { let x = 0, y = 0; while (e && e !== scr) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return [x, y]; };
        let px = 700, py = 430, first = true, arrowOn = false;
        const go = (x, y, t) => { tl.fromTo(cur, { x: px, y: py }, { x, y, duration: 0.4, ease: "power2.inOut", immediateRender: first }, t - 0.46); first = false; px = x; py = y; };
        const press = (t) => {
          tl.fromTo(cur, { scale: 1 }, { scale: 0.8, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(rip, { x: px - 40, y: py - 40, scale: 0.2, opacity: 0.95 }, { x: px - 40, y: py - 40, scale: 1.7, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
        };
        const point = (x, y, rot, t) => {
          if (!arrowOn) tl.fromTo(arw, { x: x + 70 * Math.cos(rot * Math.PI / 180), y: y - 45 + 70 * Math.sin(rot * Math.PI / 180), rotation: rot, opacity: 0 }, { x, y: y - 45, rotation: rot, opacity: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
          else tl.to(arw, { x, y: y - 45, rotation: rot, duration: 0.3, ease: "power3.inOut" }, t);
          arrowOn = true;
        };
        const hl = (e, t) => { tl.fromTo(e, { backgroundColor: "rgba(47,140,255,0)", color: "#26364a" }, { backgroundColor: "rgba(47,140,255,1)", color: "#ffffff", duration: 0.1, ease: "power1.out", immediateRender: false }, t); };
        s.acts.forEach((a) => {
          if (a.a === "rc") {
            const seq = $(".seq", scr), [sx, sy] = P(seq), menu = $(".menu", scr);
            go(sx + 120, sy + 44, a.t); press(a.t);
            tl.fromTo(seq, { backgroundColor: "rgba(47,140,255,0)" }, { backgroundColor: "rgba(47,140,255,0.16)", duration: 0.1, immediateRender: false }, a.t);
            tl.fromTo(menu, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, a.t + 0.05);
          } else if (a.a === "pick" && a.row === undefined) {
            const it = $(".menu .pk", scr), [ix, iy] = P(it), menu = $(".menu", scr);
            go(ix + 330, iy + 36, a.t); hl(it, a.t - 0.12); press(a.t);
            point(P(menu)[0] + menu.offsetWidth + 14, iy + 32, 0, a.t + 0.08);
          } else if (a.a === "open") {
            const row = $$(".row", scr)[a.row], box = $(".box", row), dd = $(".dd", row), [bx, by] = P(box);
            go(bx + 470, by + 44, a.t); press(a.t);
            tl.fromTo(box, { boxShadow: "inset 0 0 0 2px #cfdbe7" }, { boxShadow: "inset 0 0 0 3px #2f8cff", duration: 0.1, immediateRender: false }, a.t);
            tl.fromTo(dd, { opacity: 0, scaleY: 0.7 }, { opacity: 1, scaleY: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, a.t + 0.04);
          } else if (a.a === "pick") {
            const row = $$(".row", scr)[a.row], box = $(".box", row), dd = $(".dd", row), it = $(".pk", dd), [ix, iy] = P(it), [bx, by] = P(box);
            go(ix + 300, iy + 32, a.t); hl(it, a.t - 0.12); press(a.t);
            tl.fromTo(dd, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, a.t + 0.16);
            tl.fromTo($(".v0", box), { opacity: 1 }, { opacity: 0, duration: 0.1, immediateRender: false }, a.t + 0.16);
            tl.fromTo($(".v1", box), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, a.t + 0.18);
            point(bx + box.offsetWidth + 14, by + 40, 0, a.t + 0.2);
          } else if (a.a === "btn") {
            const btn = $(".btn.go", scr), [gx, gy] = P(btn);
            go(gx + btn.offsetWidth / 2, gy + 40, a.t); press(a.t);
            tl.fromTo(btn, { backgroundColor: "rgba(127,182,245,1)" }, { backgroundColor: "rgba(31,111,224,1)", duration: 0.1, immediateRender: false }, a.t);
            point(gx + btn.offsetWidth / 2, gy - 12, -90, a.t + 0.08);
          }
        });
        if (arrowOn) {
          const last = s.acts[s.acts.length - 1].t + 0.45;
          let k = Math.floor((next - last - 0.25) / 0.28); k -= k % 2;
          if (k >= 2) tl.fromTo(arw, { scale: 1 }, { scale: 1.12, duration: 0.28, yoyo: true, repeat: k - 1, ease: "sine.inOut", immediateRender: false }, last);
        }
      });
      // FAST: the presenter whips left and right, the crop keeps up (ghost trail)
      {
        const s = S.fast, el = s.el, f = $(".f-fast", el);
        tl.fromTo(f, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, s.start + 0.05);
        track(f, s.start, s.end, 0.8, 190, 0.07);
      }
      // SPLIT: the grey 16:9 original, then the new vertical slides over it
      {
        const s = S.split, el = s.el;
        tl.fromTo($(".c16", el), { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, s.start + 0.08);
        tl.fromTo($(".c916", el), { x: 420, rotation: 8, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, K.amudi - 0.08);
        tl.fromTo($(".c916 .pp", el), { x: -50 }, { x: 50, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, K.amudi);
      }
      // CTA: the keyword types into the comment box
      {
        const s = S.cta, el = s.el, w = $(".word", el), car = $(".caret", el);
        tl.fromTo($(".plate img", el), { scale: 1 }, { scale: 1.06, duration: s.end - s.start + 0.4, ease: "none" }, s.start);
        tl.fromTo($(".cbox", el), { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, s.start + 0.3);
        tl.fromTo(w, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(6)" }, K.word + 0.02);
        tl.fromTo(car, { opacity: 1 }, { opacity: 0, duration: 0.26, yoyo: true, repeat: 9, ease: "steps(1)" }, s.start + 0.3);
        tl.fromTo($(".send", el), { scale: 1 }, { scale: 1.15, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, K.word + 0.6);
      }
      // END: the mark, two ripples, the handle types on
      {
        const s = S.end, el = s.el;
        tl.fromTo($(".mk", el), { scale: 0.3, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, s.start + 0.05);
        $$(".rp", el).forEach((r, k) => tl.fromTo(r, { scale: 0.6, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out" }, s.start + 0.25 + k * 0.3));
        tl.fromTo($$(".handle span", el), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", stagger: 0.05 }, s.start + 0.45);
      }
      // pixel dissolves
      $$(".pix").forEach((p) => {
        const tc = +p.dataset.tc;
        $$("i", p).forEach((q) => {
          tl.fromTo(q, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "power2.out" }, tc - 0.3 + +q.dataset.a);
          tl.fromTo(q, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.1, ease: "power2.in", immediateRender: false }, tc + 0.02 + +q.dataset.b);
        });
      });
      // captions
      T.lines.forEach((L, i) => {
        const cap = document.getElementById("cap" + i), inner = cap.firstElementChild, ws = inner.querySelectorAll(".w"), dark = cap.classList.contains("on-dark");
        tl.fromTo(inner, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, L.start - 0.06);
        tl.to(inner, { opacity: 0, duration: 0.12, ease: "power1.in" }, L.hold - 0.12);
        ws.forEach((w, j) => {
          const [s] = L.w[j], nxt = j < ws.length - 1 ? L.w[j + 1][0] : Math.min(L.hold - 0.12, L.w[j][1] + 0.25);
          const bx = w.firstElementChild, base = dark ? "rgba(255,255,255,0.55)" : "rgba(13,35,64,0.5)", done = w.classList.contains("hi") ? (dark ? "#8fd0ff" : "#1f6fe0") : (dark ? "#ffffff" : "#0d2340");
          tl.fromTo(bx, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, s - 0.03);
          tl.fromTo(w, { color: base }, { color: "#ffffff", duration: 0.08 }, s - 0.03);
          tl.to(bx, { opacity: 0, duration: 0.1, ease: "power1.in" }, nxt - 0.04);
          tl.to(w, { color: done, duration: 0.1 }, nxt - 0.04);
        });
      });
    </script>
  </body>
