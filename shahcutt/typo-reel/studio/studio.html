<!doctype html>
<html>
<!-- The spotlight studio still for typo-reel: an empty black director's chair under a top spotlight,
     light pool and chair shadow on the floor, a dark curtain, a soft beam. Static, so it is rendered once:
     node studio/render.cjs  ->  assets/studio.png (rendered at 2x, downscaled). -->
<head>
<meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from "three";
const W = 1080, H = 1920;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50); cam.position.set(0, 1.12, 6.0); cam.lookAt(0, 0.74, 0);

// seeded noise
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

// floor: dark, slightly glossy concrete
const floorTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.fillStyle = "#555"; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) { const v = 70 + rnd() * 40 | 0; g.fillStyle = `rgba(${v},${v},${v},.25)`; g.fillRect(rnd() * 512, rnd() * 512, 1.5, 1.5); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: floorTex, color: 0x8c8c8c, roughness: 0.62, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// curtain: vertical folds, near black
const curtTex = (() => { const c = document.createElement("canvas"); c.width = 1024; c.height = 8; const g = c.getContext("2d");
  for (let x = 0; x < 1024; x++) { const v = 0.5 + 0.5 * Math.sin(x / 1024 * Math.PI * 2 * 34 + Math.sin(x / 90) * 1.3); const l = 16 + v * 22 | 0; g.fillStyle = `rgb(${l},${l},${l})`; g.fillRect(x, 0, 1, 8); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const curtain = new THREE.Mesh(new THREE.PlaneGeometry(14, 9), new THREE.MeshStandardMaterial({ map: curtTex, roughness: 1 }));
curtain.position.set(0, 4.0, -2.6); curtain.receiveShadow = true; scene.add(curtain);

// director's chair, black frame and black canvas
const wood = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.42, metalness: 0.05 });
const canvasM = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.95 });
const chair = new THREE.Group(); scene.add(chair);
const box = (w, h, d, m, x, y, z, rx = 0, ry = 0, rz = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); o.castShadow = o.receiveShadow = true; chair.add(o); return o; };
const halfW = 0.30, depth = 0.25, seatY = 0.47, legT = 0.04;
for (const sx of [-1, 1]) {
  const x = sx * halfW;
  box(0.05, 0.045, 2 * depth + 0.04, wood, x, seatY, 0);                 // seat rail (front to back)
  box(0.045, 0.30, 0.045, wood, x, seatY + 0.15, depth);                 // front post
  box(0.06, 0.035, 2 * depth + 0.12, wood, x, seatY + 0.31, 0.03);       // armrest
  box(0.045, 0.62, 0.045, wood, x, seatY + 0.30, -depth);                // back post (taller)
  box(0.05, 0.03, 2 * depth + 0.06, wood, x, 0.015, 0);                  // floor runner
}
// the X legs, seen from the front and from the back (the chair folds sideways)
for (const z of [depth, -depth]) {
  const L = Math.hypot(2 * halfW, seatY) + 0.01, ang = Math.atan2(seatY, 2 * halfW);
  box(L, 0.04, 0.035, wood, 0, seatY / 2 + 0.01, z, 0, 0, ang);
  box(L, 0.04, 0.035, wood, 0, seatY / 2 + 0.01, z + (z > 0 ? -0.04 : 0.04), 0, 0, -ang);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0x8a8a8a, metalness: 0.9, roughness: 0.3 }));
  pin.rotation.x = Math.PI / 2; pin.position.set(0, seatY / 2 + 0.01, z + (z > 0 ? -0.02 : 0.02)); chair.add(pin);
}
// seat canvas, a little sag
const seatGeo = new THREE.BoxGeometry(2 * halfW - 0.02, 0.02, 2 * depth - 0.04, 12, 1, 6);
{ const p = seatGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i) / halfW; p.setY(i, p.getY(i) - 0.025 * (1 - x * x)); } seatGeo.computeVertexNormals(); }
const seat = new THREE.Mesh(seatGeo, canvasM); seat.position.set(0, seatY + 0.01, 0); seat.castShadow = seat.receiveShadow = true; chair.add(seat);
// back canvas with the page name, a little curved
const backTex = (() => { const c = document.createElement("canvas"); c.width = 1024; c.height = 320; const g = c.getContext("2d");
  g.fillStyle = "#121212"; g.fillRect(0, 0, 1024, 320);
  g.fillStyle = "rgba(235,235,230,.85)"; g.font = "600 92px Helvetica, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.letterSpacing = "26px"; g.fillText("SHAHCUTT", 512 + 13, 166);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; })();
const backGeo = new THREE.BoxGeometry(2 * halfW + 0.06, 0.2, 0.012, 16, 1, 1);
{ const p = backGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i) / (halfW + 0.03); p.setZ(i, p.getZ(i) - 0.03 * (1 - x * x)); } backGeo.computeVertexNormals(); }
const backMats = [canvasM, canvasM, canvasM, canvasM, new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.95 }), canvasM];
const back = new THREE.Mesh(backGeo, backMats); back.position.set(0, seatY + 0.47, -depth + 0.02); back.castShadow = back.receiveShadow = true; chair.add(back);
chair.rotation.y = -0.32; chair.position.set(0, 0, 0.1);

// the top spotlight
const spot = new THREE.SpotLight(0xfff6e8, 150, 0, 0.30, 1.0, 2);
spot.position.set(0.25, 3.6, 0.0); spot.target.position.set(0, 0, 0.25); scene.add(spot, spot.target);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = 6; spot.shadow.bias = -0.0004; spot.shadow.camera.near = 1; spot.shadow.camera.far = 9;
// lamp spill on the curtain
const spill = new THREE.SpotLight(0xffffff, 85, 0, 0.3, 1.0, 2); spill.position.set(0, 6.2, 2.2); spill.target.position.set(0, 3.6, -2.6); scene.add(spill, spill.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.015));
const fill = new THREE.SpotLight(0xfff2e0, 9, 0, 0.12, 1.0, 2); fill.position.set(-0.6, 1.8, 6.5); fill.target.position.set(0, 0.7, 0); scene.add(fill, fill.target);

// the beam: an open cone, additive, bright at the top and soft at the edges
const beamGeo = new THREE.CylinderGeometry(0.05, 1.0, 3.6, 96, 1, true); beamGeo.translate(0, -1.8, 0);
const beam = new THREE.Mesh(beamGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ vec4 wp = modelMatrix*vec4(position,1.); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition-wp.xyz); vY = -position.y/3.6; gl_Position = projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: `varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ float f = pow(abs(dot(vN,vV)), 2.2); float a = f*pow(1.-vY,1.7)*0.42; gl_FragColor = vec4(vec3(1.,.97,.92)*a, a); }`,
}));
beam.position.set(0.12, 3.6, -0.15); scene.add(beam);

r.render(scene, cam);
window.__ready = true;
</script>
</body>
</html>
