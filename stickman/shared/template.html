<!doctype html>
<html lang="en" data-resolution="{RES}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={W}, height={H}" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/inky.js"></script>
    <script src="assets/props.js"></script>
    <script src="assets/engine.js"></script>
    <style>
      @font-face { font-family: "Patrick Hand"; font-weight: 400; src: url("assets/patrick-hand-latin-400-normal.woff2") format("woff2"); }
      :root { --paper: #fbf7ea; --ink: #1d1d2b; --font-display: "Patrick Hand", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {W}px; height: {H}px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; }
      svg.stage { width: {W}px; height: {H}px; }
      .ink { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .cap { position: absolute; text-align: center; color: var(--ink); line-height: 1.05; {CAPCSS} }
      .cap span { display: inline-block; background: #ffe45c; padding: 0 28px 6px; border: 7px solid var(--ink); border-radius: 26px; transform: rotate(-2deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{DUR}" data-width="{W}" data-height="{H}">
      <svg id="world" class="clip stage" data-start="0" data-duration="{DUR}" data-track-index="0" viewBox="{VB}">
        <defs id="defs">
          <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="0" />
            <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <rect x="-1000" y="-600" width="3200" height="3200" fill="#fbf7ea" />
        <g id="lines" stroke="#a9c8ee" stroke-width="3"></g>
        <line x1="120" y1="-600" x2="120" y2="2600" stroke="#f0a3a8" stroke-width="4" />
        <g id="art" filter="url(#boil)">
          <g id="sky"></g>
          <path id="ground" class="ink" d="M-560,1250 C-200,1244 100,1256 400,1250 S800,1244 1100,1250 S1500,1256 1700,1250" />
          <g id="back"></g>
          <g id="mid"></g>
          <g id="figs"></g>
          <g id="front"></g>
          <g id="fx"></g>
        </g>
        <g id="pens"></g>
      </svg>
      <audio id="sound" src="assets/audio.wav" data-start="0" data-duration="{DUR}" data-volume="1"></audio>
    </div>
    <script src="assets/episode.js"></script>
  </body>
</html>
